    };
  },
  station(p) {
    const s = findStation(p.sid);
    if (!s) return state.st.list ? { title: '📡 Station', body: `<p class="${SUB}">Diese Station liefert gerade keine Daten.</p>` } : null;
    const mode = p.mode === 'ski' ? 'ski' : 'main', loc = currentLoc(), k = stKey(s);
    const isMain = loc && loc.stMain === k, isSki = loc && loc.stSki === k;
    const hints = [];
    if (isNum(s.oft) && isNum(s.t) && s.oft < s.t - 4) hints.push(['🌌', `Die Schnee-Oberfläche ist ${fmt(s.t - s.oft)} °C kälter als die Luft – typisch nach einer klaren Nacht. Der Schnee bleibt länger hart und griffig.`]);
    if (isNum(s.hs24) && s.hs24 >= 5) hints.push(['❄️', `In den letzten 24 Stunden sind rund ${fmt(s.hs24, ' cm')} Schnee dazugekommen.`]);
    if (isNum(s.wg) && s.wg >= 60) hints.push(['🚩', 'Sturmböen – exponierte Lifte stehen oft still, Triebschnee möglich.']);
    if (isNum(s.t) && s.t > 0 && isNum(s.hs) && s.hs > 0) hints.push(['💧', 'Plusgrade auf Schnee: Er wird nass und schwer – warmes Wachs und grobe Struktur.']);
    const btn = (attrs, txt, on) => `<button ${attrs} class="w-full py-3 font-extrabold ${on ? 'bg-emerald-600 text-white' : 'bg-sky-600 text-white'}">${on ? '✓ ' : ''}${txt}</button>`;
    return {
      title: `📡 ${esc(s.name)}`, sub: `${fmt(s.alt)} m · ${fmt(s.dist, ' km', 1)} entfernt · ${SRC_NAME[s.src]}`,
      body: `<div class="${CARD} p-4 flex items-center gap-4">${isNum(s.wd) ? compass(s.wd, 96) : '<div class="text-6xl">🌡️</div>'}
          <div><div class="text-5xl font-black tabular leading-none">${fmt(s.t, '°', 1)}</div><div class="font-extrabold mt-1">Lufttemperatur</div><div class="${SUB}">Messung ${ago(s.time)}${s.time ? ` (${clock(s.time)} Uhr)` : ''}</div></div></div>
        ${rowsCard([
          isNum(s.td) ? ['💦 Taupunkt', fmt(s.td, ' °C', 1)] : null,
          isNum(s.rh) ? ['💧 Luftfeuchte', fmt(s.rh, ' %')] : null,
          isNum(s.ws) ? ['🌬️ Wind', `${fmt(s.ws)} km/h${isNum(s.wd) ? ` aus ${dirName(s.wd)}` : ''}`] : null,
          isNum(s.wg) ? ['💨 Böen', fmt(s.wg, ' km/h')] : null,
          isNum(s.hs) ? ['❄️ Schneehöhe', fmt(s.hs, ' cm')] : null,
          isNum(s.hs24) ? ['📈 Schnee 24 h', signed(s.hs24, ' cm')] : null,
          isNum(s.hs72) ? ['📈 Schnee 72 h', signed(s.hs72, ' cm')] : null,
          isNum(s.oft) ? ['🧊 Schnee-Oberfläche', fmt(s.oft, ' °C', 1)] : null,
          isNum(s.n24) ? ['🌧️ Niederschlag 24 h', fmt(s.n24, ' mm', 1)] : null,
          isNum(s.rr) ? ['🌧️ Niederschlag 10 Min.', fmt(s.rr, ' mm', 1)] : null,
          isNum(s.p) ? ['🎈 Luftdruck', fmt(s.p, ' hPa')] : null,
          ['🏢 Betreiber', `<span class="text-sm">${esc(s.op || SRC_NAME[s.src])}</span>`]
        ])}
        ${hints.map(([ic, t]) => note(ic, t)).join('')}
        <div class="space-y-2">
          ${btn(`data-act="st-choose" data-v="${esc(k)}" data-mode="main"`, 'Für Wetter verwenden', isMain)}
          ${btn(`data-act="st-choose" data-v="${esc(k)}" data-mode="ski"`, 'Für Ski & Wachs verwenden', isSki)}
          <button data-act="st-save" data-sid="${esc(k)}" class="w-full py-3 bg-zinc-200 dark:bg-zinc-800 font-extrabold">★ Als eigenen Ort speichern (${fmt(s.alt)} m)</button>
          ${s.link ? `<a href="${esc(s.link)}" target="_blank" rel="noopener" class="block text-center py-2 text-sm font-extrabold underline text-zinc-600 dark:text-zinc-300">Messdiagramme beim Betreiber ↗</a>` : ''}
        </div>
        <button data-info="stations" data-mode="${mode}" class="w-full py-2 text-sm font-extrabold text-zinc-600 dark:text-zinc-300 underline">‹ Alle Stationen in der Nähe</button>`
    };
  },

  /* --- Schnellzugriffe auf dem Startbildschirm (Manifest-Shortcuts) --- */
  shortcuts() {
    const android = /Android/i.test(navigator.userAgent);
    const step = (n, html) => `<li class="flex gap-3 items-start ${CARD} p-3"><span class="w-7 h-7 shrink-0 grid place-items-center rounded-full bg-sky-600 text-white font-black">${n}</span><div class="text-sm font-semibold leading-snug pt-0.5">${html}</div></li>`;
    const sc = [['🌤️', 'Wetter', 'aktuelles Wetter & 7 Tage'], ['🚴', 'Rennrad', 'Ampel mit Grenzwerten'], ['🎿', 'Skiwachs', 'Swix-Empfehlung für heute'], ['📡', 'Stationen', 'Messwerte in deiner Nähe']];
    return {
      title: '📱 Schnellzugriffe', sub: 'Direkt vom Startbildschirm zu den Details',
      body: `${note('⚡', 'Halte das <b>AlpinWetter-Symbol</b> auf dem Startbildschirm gedrückt – dann erscheinen vier Schnellzugriffe. Jeder öffnet die App direkt an der passenden Stelle mit allen Details.')}
      <div class="grid grid-cols-2 gap-2">${sc.map(([ic, n, t]) => `<div class="${CARD} p-3"><div class="text-2xl">${ic}</div><div class="font-black mt-1">${n}</div><div class="text-xs font-semibold text-zinc-600 dark:text-zinc-300">${t}</div></div>`).join('')}</div>

        ${step(2, 'Einen Schnellzugriff (z. B. <b>Skiwachs</b>) <b>gedrückt halten und auf einen freien Platz ziehen</b>.')}
        ${step(3, 'Fertig – das neue Symbol öffnet AlpinWetter direkt mit diesen Details.')}
      </ol>
      ${note('⏳', 'Neue Schnellzugriffe erscheinen, sobald Chrome die installierte App aktualisiert hat. Das kann bis zu einem Tag dauern – AlpinWetter dazwischen ruhig ein paar Mal öffnen.')}
      ${note('🧩', 'Echte Widgets mit Live-Werten (Temperatur, Ampel, Wachs direkt auf dem Startbildschirm) kann eine Web-App unter Android nicht anzeigen. Dafür wäre eine eigene kleine Android-Zusatz-App nötig.')}
      ${android ? '' : note('🍏', 'Auf dem iPhone bietet iOS für Web-Apps leider keine Schnellzugriffe an.')}`
    };
  }
};

/* --- Info-Sheet öffnen / schließen (mit Zurück-Geste) --- */
let info = null, navDepth = 0, ignorePop = 0;
function navPush() { try { history.pushState({ aw: ++navDepth }, ''); } catch (e) { navDepth = Math.max(0, navDepth - 1); } }
function navPop(n = 1) {
  n = Math.min(n, navDepth);
  if (n <= 0) return;
  navDepth -= n; ignorePop++;
  history.go(-n);
}
function renderInfo(keepScroll) {
  if (!info) return;
  let r = null;
  try { r = INFO[info.key](info.p || {}); }
  catch (e) { console.error(e); r = { title: 'Fehler', body: errorCard({ kind: 'render', message: e.message }) }; }
  const body = $('#infoBody'), top = body.scrollTop;
  $('#infoTitle').innerHTML = r ? r.title : 'Lade …';
  $('#infoSub').innerHTML = r && r.sub ? r.sub : '';
  body.innerHTML = r ? r.body : `<div class="flex items-center justify-center gap-2 py-12 font-bold text-zinc-600 dark:text-zinc-300">${SPINNER} Lade Daten …</div>`;
  body.scrollTop = keepScroll ? top : 0;
}
function openInfo(key, p = {}) {
  if (!INFO[key]) return;
  const el = $('#info'), was = !!info;
  info = { key, p };
  renderInfo(false);
  if (!was) {
    el.classList.remove('hidden'); el.setAttribute('aria-hidden', 'false');
    $('#infoBody').scrollTop = 0;
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      $('.sheet-panel', el).classList.remove('translate-y-full');
      $('.sheet-overlay', el).classList.remove('opacity-0');
    }));
    navPush();
  }
  if (key === 'stations' || key === 'station' || key === 'snow') loadStations();
}
function closeInfo(fromNav) {
  if (!info) return;
  info = null;
  const el = $('#info');
  $('.sheet-panel', el).classList.add('translate-y-full');
  $('.sheet-overlay', el).classList.add('opacity-0');
  if (!sheetOpen) document.body.style.overflow = '';
  setTimeout(() => { if (!info) { el.classList.add('hidden'); el.setAttribute('aria-hidden', 'true'); } }, 300);
  if (!fromNav) navPop(1);
}

/* --- Links (Schnellzugriffe, Lesezeichen): ?tab=ski&info=wax&loc=<id>&lat=..&lon=..&name=..&elev=.. --- */
let pendingInfo = null;
function applyDeepLink() {
  let q;
  try { q = new URLSearchParams(location.search); } catch (e) { return; }
  if (!Array.from(q.keys()).length) return;
  const tab = q.get('tab');
  if (['wetter', 'rad', 'ski'].includes(tab)) { state.tab = tab; LS.set('aw_tab', tab); }
  const id = q.get('loc'), lat = parseFloat(q.get('lat')), lon = parseFloat(q.get('lon'));
  let target = id ? state.locations.find(l => l.id === id) : null;
  if (!target && isNum(lat) && isNum(lon)) target = state.locations.find(l => Math.abs(l.lat - lat) < 0.005 && Math.abs(l.lon - lon) < 0.005);
  if (target) { state.selectedId = target.id; LS.set('aw_selected', target.id); }
  else if (isNum(lat) && isNum(lon)) {
    const ev = parseFloat(q.get('elev'));
    state.tempLoc = { id: '__temp', name: (q.get('name') || 'Ort aus Link').slice(0, 60), region: 'per Link geöffnet', lat, lon, elevation: isNum(ev) ? Math.round(ev) : null, valley: null };
    state.selectedId = '__temp'; persistLocs(); LS.set('aw_selected', '__temp');
  }
  const key = q.get('info');
  if (key && INFO[key]) pendingInfo = { key, p: { d: q.get('d') || '', t: q.get('t') || '', mode: q.get('mode') || '', slot: q.get('slot') || '' } };
  try { history.replaceState(null, '', location.pathname); } catch (e) { /* egal */ }
}

const TABS = ['wetter', 'rad', 'ski'];
const TAB_STYLE = {
  wetter: { on: 'text-sky-700 dark:text-sky-400', bar: 'bg-sky-600' },
  rad: { on: 'text-emerald-700 dark:text-emerald-400', bar: 'bg-emerald-600' },
  ski: { on: 'text-indigo-700 dark:text-indigo-400', bar: 'bg-indigo-600' }
};

function renderChrome() {
  const loc = currentLoc();

  $('#hdrName').textContent = loc ? loc.name : 'Kein Ort gewählt';
  let sub = 'Tippen, um einen Ort zu wählen';
  if (loc) {
    const e = state.main.data && isNum(state.main.data.elevation) ? state.main.data.elevation : mainElev(loc);
    sub = [loc.region, isNum(e) ? `${fmt(e)} m` : '', state.main.ts ? `${clock(state.main.ts)} Uhr` : ''].filter(Boolean).join(' · ');
  }
  $('#hdrSub').textContent = sub;
  /* Punkte = Favoriten (seitlich über den Ortsnamen wischen) */
  const favs = state.locations;
  $('#hdrDots').innerHTML = favs.length > 1 && favs.length <= 10
    ? favs.map(l => `<span class="w-1.5 h-1.5 ${loc && l.id === loc.id ? 'bg-zinc-900 dark:bg-zinc-100' : 'bg-zinc-300 dark:bg-zinc-700'}"></span>`).join('') : '';
  const busy = state.main.loading || (state.tab === 'ski' && state.ski.loading);
  $('#loadbar').classList.toggle('on', !!busy && !!S.data);
  $$('[data-tab]').forEach(btn => {
    const on = btn.dataset.tab === state.tab;
    btn.setAttribute('aria-selected', String(on));
    btn.className = `flex flex-col items-center gap-1 pt-2.5 pb-2 transition-colors ${on ? TAB_STYLE[btn.dataset.tab].on : 'text-zinc-400 dark:text-zinc-500'}`;
  });

  if (!ind.dataset.drag) ind.style.transform = `translateX(${TABS.indexOf(state.tab) * 100}%)`;
  ind.className = `absolute top-0 left-0 w-1/3 h-[3px] ${TAB_STYLE[state.tab].bar}`;
  $('#netBanner').innerHTML = navigator.onLine === false
    ? `<div class="px-4 py-2 bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900 text-xs font-bold uppercase tracking-wider">📡 Offline – gespeicherte Daten</div>` : '';
}

function emptyState() {
  return `<div class="${PANEL} px-5 py-8 mt-3 text-center fade-in">
    <div class="text-5xl mb-3">🗺️</div>
    <h2 class="text-xl font-black tracking-tight mb-1">Noch kein Ort gespeichert</h2>
    <p class="${SUB} mb-5">Suche einen Ort oder stelle die Standard-Orte wieder her.</p>
    <div class="flex flex-col gap-px bg-zinc-200 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-800">
      <button data-act="open-sheet" class="px-6 py-3.5 bg-sky-600 text-white font-bold active:bg-sky-700">Ort suchen</button>
      <button data-act="restore" class="px-6 py-3.5 bg-white dark:bg-zinc-900 font-bold ${PRESS}">Standard-Orte wiederherstellen</button>
    </div>
  </div>`;
}

function render() {
  const view = $('#view');
  const scrolls = {};
  if (!state.resetScroll) $$('[data-scroll]', view).forEach(el => { scrolls[el.dataset.scroll] = el.scrollLeft; });
  state.resetScroll = false;
  let html;
  try {
    if (!currentLoc()) html = emptyState();
    else if (state.tab === 'rad') html = renderBike();
    else if (state.tab === 'ski') html = renderSki();
    else html = renderWeather();
  } catch (e) {
    console.error(e);
    html = errorCard({ kind: 'render', message: e.message });
  }
  view.innerHTML = html;
  $$('[data-scroll]', view).forEach(el => { if (scrolls[el.dataset.scroll] != null) el.scrollLeft = scrolls[el.dataset.scroll]; });
  renderChrome();
  if (info) renderInfo(true);
  if (pendingInfo) { const pi = pendingInfo; pendingInfo = null; openInfo(pi.key, pi.p); }
}

/* =====================================================================
   Orte: Sheet, Suche, Favoriten
   ===================================================================== */
const flag = cc => (cc && /^[A-Za-z]{2}$/.test(cc)) ? String.fromCodePoint(...cc.toUpperCase().split('').map(ch => 127397 + ch.charCodeAt(0))) : '📍';
const LOC_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" class="w-5 h-5" aria-hidden="true"><path d="M2 12h3M19 12h3M12 2v3M12 19v3"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/></svg>';

        <li><button data-act="pick-result" data-i="${i}" class="${row} ${PRESS}">
          <span class="text-2xl">${flag(r.country_code)}</span>

          <span class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 truncate">${esc([r.admin2, r.admin1, r.country].filter(Boolean).join(', '))}${isNum(r.elevation) ? ` · ${fmt(r.elevation)} m` : ''}</span></span>
          <span class="text-sky-600 dark:text-sky-400 font-black text-xl">＋</span>

      <button data-act="save-temp" class="self-stretch px-4 bg-sky-600 text-white text-xs font-black uppercase tracking-wider active:bg-sky-700">Speichern</button>
    </div>` : '';
  const favs = state.locations.map(l => {
    const on = cur && cur.id === l.id;
    const e = isNum(l.elevation) ? `⛰️ ${fmt(l.elevation)} m` : (isNum(l.valley) ? `${fmt(l.valley)} m` : '');
    return `<li data-fav="${esc(l.id)}" class="relative overflow-hidden bg-red-600">
      <div class="absolute inset-0 flex items-center justify-between px-5 text-white text-xs font-black uppercase tracking-wider" aria-hidden="true"><span>Löschen</span><span>Löschen</span></div>
      <button data-act="select" data-id="${esc(l.id)}" class="fav-row relative ${row} ${PRESS}" aria-label="${esc(l.name)} anzeigen (lange drücken: bearbeiten, wischen: löschen)">
        <span class="absolute left-0 inset-y-0 w-1 ${on ? 'bg-sky-600' : ''}"></span>
        <span class="min-w-0 flex-1"><span class="block font-bold truncate">${esc(l.name)}</span>
        <span class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 truncate">${esc([l.region, e].filter(Boolean).join(' · '))}</span></span>
        ${on ? '<span class="text-[10px] font-black uppercase tracking-wider text-sky-700 dark:text-sky-400">Aktiv</span>' : ''}
      </button>
    </li>`;
  }).join('');
  const pref = themePref();
  const seg = (v, l) => `<button data-act="theme-set" data-v="${v}" aria-pressed="${pref === v}" class="py-2.5 text-sm font-bold ${pref === v ? 'bg-zinc-900 text-white dark:bg-white dark:text-zinc-900' : `bg-white dark:bg-zinc-900 ${PRESS}`}">${l}</button>`;
  $('#sheetBody').innerHTML = `
    ${results ? `<div>${results}</div>` : ''}
    <div class="${CARD} divide-y divide-zinc-200 dark:divide-zinc-800">
      <button data-act="geo" class="${row} ${PRESS} text-sky-700 dark:text-sky-400">${LOC_ICON}<span class="font-bold">Aktuellen Standort verwenden</span></button>
    </div>
    ${tempItem ? `<div>${tempItem}</div>` : ''}
    <div>
      <div class="flex items-baseline justify-between mb-1.5"><span class="${LABEL}">Favoriten</span>${favs ? hint('← wischen = löschen · lange drücken = bearbeiten') : ''}</div>
      ${favs ? `<ul class="border border-zinc-200 dark:border-zinc-800 divide-y divide-zinc-200 dark:divide-zinc-800">${favs}</ul>` : `<p class="${SUB}">Noch keine Favoriten – suche oben nach einem Ort.</p>`}
      <button data-act="restore" class="mt-2 text-xs font-bold text-zinc-500 dark:text-zinc-400 underline py-1">Standard-Orte wiederherstellen</button>
    </div>
    <div>
      <div class="${LABEL} mb-1.5">Darstellung</div>
      <div class="grid grid-cols-3 gap-px bg-zinc-200 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-800">${seg('auto', 'Automatisch')}${seg('light', 'Hell')}${seg('dark', 'Dunkel')}</div>
    </div>
    <button data-info="shortcuts" class="${row} ${CARD} ${PRESS}">
      <span class="text-2xl">📱</span><span class="flex-1"><span class="block font-bold">Schnellzugriffe</span><span class="block text-xs font-medium text-zinc-500 dark:text-zinc-400">Wetter, Rennrad, Skiwachs & Stationen als eigene Symbole</span></span>${CHEVRON}
    </button>`;
}

let sheetOpen = false;
function openSheet() {
  const el = $('#sheet');
  el.classList.remove('hidden'); el.setAttribute('aria-hidden', 'false');
  renderSheet();
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $('.sheet-panel', el).classList.remove('translate-y-full');
    $('.sheet-overlay', el).classList.remove('opacity-0');
  }));
  if (!sheetOpen) navPush();
  sheetOpen = true;
}
function closeSheet(fromNav) {
  if (!sheetOpen) return;
  const el = $('#sheet');
  $('.sheet-panel', el).classList.add('translate-y-full');
  $('.sheet-overlay', el).classList.add('opacity-0');
  document.body.style.overflow = '';
  $('#searchInput').blur();
  sheetOpen = false;
  setTimeout(() => { if (!sheetOpen) { el.classList.add('hidden'); el.setAttribute('aria-hidden', 'true'); } }, 300);
  if (!fromNav) navPop(1);
}

let searchTimer = null, searchSeq = 0;
async function doSearch(q) {
  const seq = ++searchSeq;
  state.search = { q, status: 'loading', results: [], error: null };
  renderSheet();
  try {
    const url = `${GEO_API}?${new URLSearchParams({ name: q, count: '8', language: 'de', format: 'json' })}`;
    const data = await fetchJSON(url, 10000);
    if (seq !== searchSeq) return;
    state.search = { q, status: 'done', results: Array.isArray(data.results) ? data.results : [], error: null };
  } catch (e) {
    if (seq !== searchSeq) return;
    state.search = { q, status: 'error', results: [], error: e };
  }
  if (sheetOpen) renderSheet();
}

/* --- Dialog speichern/bearbeiten --- */
let dlgCtx = null;
function openDlg(ctx) {
  dlgCtx = ctx;
  const f = $('#dlgForm'), loc = ctx.loc;
  $('#dlgTitle').textContent = ctx.mode === 'edit' ? 'Ort bearbeiten' : 'Ort hinzufügen';
  $('#dlgInfo').textContent = `${loc.region || ''} · ${(+loc.lat).toFixed(3)}, ${(+loc.lon).toFixed(3)}`;
  f.elements.name.value = loc.name || '';
  f.elements.elevation.value = isNum(loc.elevation) ? loc.elevation : '';
  f.elements.elevation.placeholder = isNum(loc.valley) ? `leer = Talhöhe ${fmt(loc.valley)} m` : 'leer = Geländehöhe';
  $('#dlgElevHint').textContent = 'Für Berg-Orte die Höhe der Bergstation / des Gipfels eintragen (z. B. 3250). Ohne Angabe gilt die Höhe des Ortes (Tal).';
  $('#dlgError').classList.add('hidden');
  $('[data-act="dlg-delete"]').classList.toggle('hidden', ctx.mode !== 'edit');
  $('[data-act="dlg-view"]').classList.toggle('hidden', ctx.mode !== 'add');
  const el = $('#dlg'); el.classList.remove('hidden'); el.setAttribute('aria-hidden', 'false');
}
function closeDlg() { const el = $('#dlg'); el.classList.add('hidden'); el.setAttribute('aria-hidden', 'true'); dlgCtx = null; }
function readDlg() {
  const f = $('#dlgForm');
  const name = f.elements.name.value.trim();
  const raw = String(f.elements.elevation.value).trim().replace(',', '.');
  const err = m => { const e = $('#dlgError'); e.textContent = m; e.classList.remove('hidden'); return null; };
  if (!name) return err('Bitte einen Namen eingeben.');
  let elevation = null;
  if (raw !== '') {
    elevation = Number(raw);
    if (!Number.isFinite(elevation) || elevation < -400 || elevation > 8848) return err('Die Höhe muss zwischen −400 und 8848 m liegen.');
    elevation = Math.round(elevation);
  }
  return { name, elevation };
}

function selectLoc(id) {
  state.selectedId = id;
  LS.set('aw_selected', id);
  state.rideStart = 0; state.skiDay = null; state.resetScroll = true;
  const open = (info ? 1 : 0) + (sheetOpen ? 1 : 0);
  closeInfo(true); closeSheet(true); navPop(open);
  window.scrollTo({ top: 0 });
  render();
  loadAll();
}
function locFromResult(r) {
  return {
    id: 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: r.name, region: [r.admin1, r.country].filter(Boolean).join(', '),
    lat: r.latitude, lon: r.longitude, elevation: null,
    valley: isNum(r.elevation) ? Math.round(r.elevation) : null, cc: r.country_code || ''
  };
}

/* =====================================================================
   Toast, Theme
   ===================================================================== */
/* Hinweisleiste (Snackbar) – optional mit Aktion, z. B. toast('Gelöscht', { label: 'Rückgängig', fn }) */
let toastTimer = null, toastFn = null;
function toast(msg, opt = {}) {
  const t = $('#toast'), a = $('#toastAct');
  $('#toastMsg').textContent = msg;
  toastFn = opt.fn || null;
  a.textContent = opt.label || '';
  a.classList.toggle('hidden', !opt.label);
  t.classList.remove('opacity-0', 'translate-y-2');
  t.classList.toggle('pointer-events-none', !opt.label);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, opt.ms || (opt.label ? 6000 : 3000));
}
function hideToast() {
  $('#toast').classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
  toastFn = null;
}

/* Darstellung: automatisch (wie das Handy), hell oder dunkel – einstellbar in der Orte-Liste */
const themePref = () => { const t = LS.get('aw_theme', null); return t === 'light' || t === 'dark' ? t : 'auto'; };
function applyTheme() {
  const p = themePref(), dark = p === 'auto' ? systemDark() : p === 'dark';
  document.documentElement.classList.toggle('dark', dark);
  $('#themeColor').setAttribute('content', dark ? '#09090b' : '#f4f4f5');
}

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; e.preventDefault(); return; }   // nach langem Drücken
  if (e.target.closest('#toastAct')) { const fn = toastFn; hideToast(); if (fn) fn(); return; }
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { switchTab(tabBtn.dataset.tab); return; }
  const infoBtn = e.target.closest('[data-info]');
  if (infoBtn) { openInfo(infoBtn.dataset.info, { ...infoBtn.dataset }); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  const loc = currentLoc();
  switch (act) {
    case 'open-sheet': openSheet(); break;
    case 'close-sheet': closeSheet(); break;
    case 'close-info': closeInfo(); break;
    case 'st-retry': loadStations(true); break;
    case 'st-choose': {
      if (!loc) break;
      const mode = el.dataset.mode === 'ski' ? 'ski' : 'main';
      if (mode === 'ski') loc.stSki = v || null; else loc.stMain = v || null;
      persistLocs();
      const s = v ? findStation(v) : null;
      toast(s ? `„${s.name}“ wird ${mode === 'ski' ? 'für Ski & Wachs' : 'fürs Wetter'} verwendet` : 'Station wird automatisch gewählt');
      closeInfo(); render();
      break;
    }
    case 'st-save': {
      const s = findStation(el.dataset.sid);
      if (!s) break;
      openDlg({ mode: 'add', loc: { id: 'l' + Date.now().toString(36), name: s.name, region: `Messstation · ${SRC_NAME[s.src]}`, lat: s.lat, lon: s.lon, elevation: isNum(s.alt) ? Math.round(s.alt) : null, valley: null, cc: '', stMain: stKey(s), stSki: stKey(s) } });
      break;
    }
    case 'refresh': case 'retry':
      if (navigator.onLine === false) toast('Keine Internetverbindung');
      loadAll(true); break;
    case 'theme-set':
      LS.set('aw_theme', v === 'light' || v === 'dark' ? v : null);
      applyTheme(); renderChrome(); if (sheetOpen) renderSheet(); break;
    case 'ridestart': state.rideStart = Number(v) || 0; render(); break;
    case 'ridedur': state.rideDur = Number(v) || 3; LS.set('aw_ridedur', state.rideDur); render(); break;
    case 'skimode':
      if (v !== state.skiMode) { state.skiMode = v; LS.set('aw_skimode', v); render(); load('ski'); }
      break;
    case 'snowtype': state.snowType = v; LS.set('aw_snowtype', v); render(); break;
    case 'skiday': state.skiDay = Number(v) || 0; render(); break;
    case 'select': selectLoc(el.dataset.id); break;
    case 'del': deleteFav(el.dataset.id); break;
    case 'pick-result': {
      const r = state.search.results[Number(el.dataset.i)];
      if (r) openDlg({ mode: 'add', loc: locFromResult(r) });
      break;
    }
    case 'save-temp': if (state.tempLoc) openDlg({ mode: 'add', loc: { ...state.tempLoc, id: 'l' + Date.now().toString(36) } }); break;
    case 'restore': {
      const ids = new Set(state.locations.map(l => l.id));
      DEFAULT_LOCATIONS.forEach(d => { if (!ids.has(d.id)) state.locations.push(JSON.parse(JSON.stringify(d))); });
      persistLocs();
      toast('Standard-Orte wiederhergestellt');
      if (sheetOpen) renderSheet();
      if (!currentLoc() || state.selectedId === '__temp' && !state.tempLoc) selectLoc(state.locations[0].id); else render();
      break;
    }
    case 'geo': {
      if (!('geolocation' in navigator)) { toast('Standortbestimmung wird nicht unterstützt'); break; }
      toast('Standort wird ermittelt …');
      navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;
        state.tempLoc = { id: '__temp', name: 'Mein Standort', region: `${latitude.toFixed(3)}, ${longitude.toFixed(3)}`, lat: latitude, lon: longitude, elevation: null, valley: null };
        persistLocs(); selectLoc('__temp');
      }, err => toast(err.code === 1 ? 'Standortzugriff wurde verweigert' : 'Standort nicht verfügbar'), { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 });
      break;
    }
    case 'close-dlg': closeDlg(); break;
    case 'dlg-view': {
      if (!dlgCtx) break;
      const vals = readDlg(); if (!vals) break;
      state.tempLoc = { ...dlgCtx.loc, ...vals, id: '__temp' };
      persistLocs(); closeDlg(); selectLoc('__temp');
      break;
    }
    case 'dlg-delete': {
      if (!dlgCtx) break;
      const id = dlgCtx.loc.id; closeDlg();
      deleteFav(id);
      break;
    }
  }
});

$('#dlgForm').addEventListener('submit', e => {
  e.preventDefault();
  if (!dlgCtx) return;
  const vals = readDlg(); if (!vals) return;
  if (dlgCtx.mode === 'edit') {
    const l = dlgCtx.loc;
    if (l.elevation !== vals.elevation) l.skiBerg = null;
    l.name = vals.name; l.elevation = vals.elevation;
    persistLocs(); closeDlg();
    if (sheetOpen) renderSheet();
    if (currentLoc() === l) { render(); loadAll(); }
    toast('Gespeichert');
  } else {
    const l = { ...dlgCtx.loc, ...vals };
    if (state.tempLoc && state.selectedId === '__temp' && Math.abs(state.tempLoc.lat - l.lat) < 1e-6 && Math.abs(state.tempLoc.lon - l.lon) < 1e-6) state.tempLoc = null;
    state.locations.push(l);
    persistLocs(); closeDlg();
    state.search = { q: '', status: 'idle', results: [], error: null };
    $('#searchInput').value = '';
    toast(`„${l.name}“ gespeichert`);
    selectLoc(l.id);
  }
});

$('#searchInput').addEventListener('input', e => {
  const q = e.target.value.trim();
  clearTimeout(searchTimer);
  if (q.length < 2) { searchSeq++; state.search = { q, status: 'idle', results: [], error: null }; renderSheet(); return; }
  searchTimer = setTimeout(() => doSearch(q), 350);
});
$('#searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); const q = e.target.value.trim(); clearTimeout(searchTimer); if (q.length >= 2) doSearch(q); e.target.blur(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (dlgCtx) closeDlg(); else if (info) closeInfo(); else if (sheetOpen) closeSheet();
});
/* Android-Zurück-Geste: schließt zuerst offene Fenster statt die App */
window.addEventListener('popstate', () => {
  if (ignorePop > 0) { ignorePop--; return; }
  navDepth = Math.max(0, navDepth - 1);
  if (dlgCtx) { closeDlg(); navPush(); return; }
  if (info) closeInfo(true); else if (sheetOpen) closeSheet(true);
});

window.addEventListener('online', () => { toast('Wieder online – lade aktuelle Daten'); renderChrome(); loadAll(true); });
window.addEventListener('offline', () => { toast('Keine Internetverbindung'); render(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (Date.now() - state.main.ts > TTL) loadAll(); else { render(); loadStations(); }
  }
});
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onChange = () => { if (themePref() === 'auto') { applyTheme(); renderChrome(); } };
  if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
}
let lastHour = new Date().getHours();
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - state.main.ts > TTL && !state.main.loading && navigator.onLine !== false) loadAll();
  else {
    if (new Date().getHours() !== lastHour) { lastHour = new Date().getHours(); render(); }
    if (navigator.onLine !== false) loadStations();          // lädt nur, wenn die Stationsdaten veraltet sind
  }
}, 60 * 1000);

/* =====================================================================
   Gesten (wie Android):
   · seitlich über den Inhalt wischen  → Tab wechseln (Wetter ↔ Rennrad ↔ Ski)
   · oben nach unten ziehen            → aktualisieren
   · über den Ortsnamen wischen        → nächster / voriger Favorit
   · Sheet nach unten wischen          → schließen
   · im Detail-Sheet seitlich wischen  → nächste / vorige Stunde bzw. Tag
   · Favorit zur Seite wischen         → löschen (mit „Rückgängig“), lange drücken → bearbeiten
   ===================================================================== */
const reduceMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const EASE = 'cubic-bezier(.2,.8,.2,1)';

/* --- Tabwechsel mit Schiebe-Animation --- */
let tabAnim = false;
function switchTab(t) {
  const v = $('#view'), ind = $('#tabInd');
  delete ind.dataset.drag;
  if (!TABS.includes(t) || t === state.tab) { snapView(); return; }
  const dir = TABS.indexOf(t) > TABS.indexOf(state.tab) ? 1 : -1;
  const go = () => {
    state.tab = t; LS.set('aw_tab', t); state.resetScroll = true;
    window.scrollTo({ top: 0 });
    render();
    if (t === 'ski') load('ski');
  };
  if (reduceMotion() || tabAnim) { v.style.transition = ''; v.style.transform = ''; v.style.opacity = ''; go(); return; }
  tabAnim = true;
  v.style.transition = `transform .16s ease-in, opacity .16s ease-in`;
  v.style.transform = `translateX(${-dir * 35}%)`;
  v.style.opacity = '0';
  setTimeout(() => {
    v.style.transition = 'none';
    v.style.transform = `translateX(${dir * 25}%)`;
    go();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      v.style.transition = `transform .26s ${EASE}, opacity .2s ease-out`;
      v.style.transform = '';
      v.style.opacity = '';
      setTimeout(() => { v.style.transition = ''; tabAnim = false; }, 280);
    }));
  }, 150);
}
function snapView() {
  const v = $('#view'), ind = $('#tabInd');
  v.style.transition = `transform .22s ${EASE}`;
  v.style.transform = '';
  delete ind.dataset.drag;
  ind.style.transition = '';
  ind.style.transform = `translateX(${TABS.indexOf(state.tab) * 100}%)`;
  setTimeout(() => { if (!g) v.style.transition = ''; }, 240);
}

/* --- Ziehen zum Aktualisieren --- */
const PTR_MAX = 110, PTR_GO = 70;
let ptrBusy = false;
function ptrShow(p) {
  const el = $('#ptr');
  el.style.transition = 'none';
  el.style.opacity = String(Math.min(1, p / 40));
  el.style.transform = `translate(-50%, ${p - 56}px)`;
  $('#ptrIcon').style.transform = `rotate(${p * 3}deg)`;
  el.classList.toggle('text-zinc-400', p < PTR_GO);
}
function ptrHide() {
  const el = $('#ptr');
  el.style.transition = '';
  el.style.opacity = '0';
  el.style.transform = 'translate(-50%, -70px)';
  $('#ptrIcon').classList.remove('spin');
}
function doRefresh() {
  if (ptrBusy) return;
  if (navigator.onLine === false) { toast('Keine Internetverbindung'); ptrHide(); return; }
  ptrBusy = true;
  const el = $('#ptr');
  el.style.transition = '';
  el.style.opacity = '1';
  el.style.transform = 'translate(-50%, 18px)';
  el.classList.remove('text-zinc-400');
  $('#ptrIcon').style.transform = '';
  $('#ptrIcon').classList.add('spin');
  const tasks = [loadAll(true)];
  if (state.tab === 'ski') tasks.push(load('ski', true));
  Promise.allSettled(tasks).then(() => {
    ptrBusy = false;
    ptrHide();
    if (!state.main.error) toast(`Aktualisiert · ${clock(Date.now())} Uhr`);
  });
}

/* --- Favorit wechseln per Wischen über den Ortsnamen --- */
function cycleLoc(step) {
  const L = state.locations;
  if (!L.length) return;
  const i = L.findIndex(l => l.id === state.selectedId);
  const next = L[i < 0 ? (step > 0 ? 0 : L.length - 1) : (i + step + L.length) % L.length];
  const el = $('#hdrText');
  if (!reduceMotion()) {
    el.style.transition = 'none';
    el.style.transform = `translateX(${step * 40}px)`;
    el.style.opacity = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transition = `transform .25s ${EASE}, opacity .2s`; el.style.transform = ''; el.style.opacity = ''; }));
  }
  selectLoc(next.id);
}

/* --- Favorit löschen mit „Rückgängig“ --- */
function deleteFav(id) {
  const idx = state.locations.findIndex(x => x.id === id);
  if (idx < 0) return;
  const [l] = state.locations.splice(idx, 1);
  const wasSel = state.selectedId === id;
  persistLocs();
  if (wasSel) { const nx = state.locations[0]; state.selectedId = nx ? nx.id : '__temp'; LS.set('aw_selected', state.selectedId); render(); loadAll(); }
  if (sheetOpen) renderSheet();
  renderChrome();
  toast(`„${l.name}“ gelöscht`, {
    label: 'Rückgängig',
    fn: () => {
      if (state.locations.some(x => x.id === l.id)) return;
      state.locations.splice(Math.min(idx, state.locations.length), 0, l);
      persistLocs();
      if (wasSel) { state.selectedId = l.id; LS.set('aw_selected', l.id); state.resetScroll = true; render(); loadAll(); }
      if (sheetOpen) renderSheet();
      renderChrome();
    }
  });
}

/* --- Lange drücken = bearbeiten --- */
let lpTimer = null, suppressClick = false;
function startLongPress(id) {
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => {
    lpTimer = null;
    const l = state.locations.find(x => x.id === id);
    if (!l) return;
    suppressClick = true;
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) { /* egal */ } }
    if (g) g = null;
    openDlg({ mode: 'edit', loc: l });
  }, 520);
}
const cancelLongPress = () => { clearTimeout(lpTimer); lpTimer = null; };

/* --- Gesten-Erkennung --- */
let g = null;
const EDGE = 22;           // Randbereich für die System-Zurück-Geste freihalten
function gestureTarget(t) {
  if (dlgCtx || !t || !t.closest) return null;
  if (info) { const panel = t.closest('#info .sheet-panel'); return panel ? { kind: 'info', panel } : null; }
  if (sheetOpen) { const panel = t.closest('#sheet .sheet-panel'); return panel ? { kind: 'sheet', panel, fav: t.closest('[data-fav]') } : null; }
  if (t.closest('#toast, #tabbar')) return null;
  if (t.closest('#locBtn')) return { kind: 'loc' };
  if (t.closest('#view, #netBanner')) return { kind: 'view', hs: !!t.closest('[data-scroll], input, textarea, select') };
  return null;
}
function gestureStart(G) {
  const W = window.innerWidth;
  if (G.kind === 'view' || G.kind === 'loc') {
    if (G.dir === 'v') return G.dy > 0 && window.scrollY <= 0 && !ptrBusy ? (G.mode = 'ptr') : false;
    if (G.kind === 'loc') return state.locations.length > 1 ? (G.mode = 'loc') : false;
    if (G.hs || G.x0 < EDGE || G.x0 > W - EDGE || !currentLoc()) return false;
    return (G.mode = 'tab');
  }
  const body = G.kind === 'info' ? $('#infoBody') : $('#sheetBody');
  if (G.dir === 'v') {
    const onGrab = !!G.target.closest('.sheet-grab');
    return G.dy > 0 && (onGrab || body.scrollTop <= 0) ? (G.mode = 'drag') : false;
  }
  if (G.kind === 'sheet' && G.fav) { G.row = $('.fav-row', G.fav); return (G.mode = 'fav'); }
  if (G.kind === 'info' && info && (info.key === 'hour' || info.key === 'day') && !G.target.closest('[data-scroll]')) return (G.mode = 'infonav');
  return false;
}
function gestureMove(G) {
  const { dx, dy } = G, W = window.innerWidth;
  switch (G.mode) {
    case 'tab': {
      const i = TABS.indexOf(state.tab), edge = (dx > 0 && i === 0) || (dx < 0 && i === TABS.length - 1);
      const x = edge ? dx * 0.25 : dx;
      const v = $('#view'), ind = $('#tabInd');
      v.style.transition = 'none';
      v.style.transform = `translateX(${x}px)`;
      ind.dataset.drag = '1';
      ind.style.transition = 'none';
      ind.style.transform = `translateX(${clamp(i - x / W, 0, TABS.length - 1) * 100}%)`;
      return true;
    }
    case 'ptr': ptrShow(clamp(dy * 0.5, 0, PTR_MAX)); return true;
    case 'loc': { const el = $('#hdrText'); el.style.transition = 'none'; el.style.transform = `translateX(${dx * 0.4}px)`; el.style.opacity = String(1 - Math.min(0.6, Math.abs(dx) / 300)); return true; }
    case 'drag': {
      const y = Math.max(0, dy);
      G.panel.style.transition = 'none';
      G.panel.style.transform = `translateY(${y}px)`;
      const ov = G.panel.previousElementSibling;
      ov.style.transition = 'none';
      ov.style.opacity = String(Math.max(0.15, 1 - y / G.panel.offsetHeight));
      return true;
    }
    case 'fav': G.row.style.transition = 'none'; G.row.style.transform = `translateX(${dx}px)`; return true;
    case 'infonav': { const b = $('#infoBody'); b.style.transition = 'none'; b.style.transform = `translateX(${dx * 0.6}px)`; b.style.opacity = String(1 - Math.min(0.7, Math.abs(dx) / 400)); return true; }
  }
  return false;
}
function gestureEnd(G) {
  const { dx, dy } = G, W = window.innerWidth, dt = Math.max(1, Date.now() - G.t0);
  const fast = (d) => Math.abs(d) / dt > 0.45 && Math.abs(d) > 40;
  switch (G.mode) {
    case 'tab': {
      const i = TABS.indexOf(state.tab), next = i + (dx < 0 ? 1 : -1);
      if (next >= 0 && next < TABS.length && (Math.abs(dx) > W * 0.28 || fast(dx))) switchTab(TABS[next]);
      else snapView();
      break;
    }
    case 'ptr': if (clamp(dy * 0.5, 0, PTR_MAX) >= PTR_GO) doRefresh(); else ptrHide(); break;
    case 'loc': {
      const el = $('#hdrText');
      el.style.transition = `transform .2s ${EASE}, opacity .2s`; el.style.transform = ''; el.style.opacity = '';
      if (Math.abs(dx) > 50 || fast(dx)) cycleLoc(dx < 0 ? 1 : -1);
      break;
    }
    case 'drag': {
      const ov = G.panel.previousElementSibling;
      G.panel.style.transition = ''; G.panel.style.transform = '';
      ov.style.transition = ''; ov.style.opacity = '';
      if (dy > G.panel.offsetHeight * 0.22 || fast(dy)) { if (G.kind === 'info') closeInfo(); else closeSheet(); }
      break;
    }
    case 'fav': {
      const row = G.row;
      if (Math.abs(dx) > W * 0.35 || fast(dx)) {
        row.style.transition = `transform .18s ease-in`;
        row.style.transform = `translateX(${dx < 0 ? -110 : 110}%)`;
        setTimeout(() => deleteFav(G.fav.dataset.fav), 170);
      } else { row.style.transition = `transform .2s ${EASE}`; row.style.transform = ''; }
      break;
    }
    case 'infonav': {
      const b = $('#infoBody'), side = dx < 0 ? 'next' : 'prev', target = $(`#infoBody [data-swipe="${side}"]`);
      if (target && (Math.abs(dx) > 60 || fast(dx))) {
        openInfo(target.dataset.info, { ...target.dataset });
        b.style.transition = 'none';
        b.style.transform = `translateX(${dx < 0 ? 40 : -40}px)`;
        b.style.opacity = '0';
        requestAnimationFrame(() => requestAnimationFrame(() => { b.style.transition = `transform .22s ${EASE}, opacity .18s`; b.style.transform = ''; b.style.opacity = ''; }));
      } else { b.style.transition = `transform .2s ${EASE}, opacity .2s`; b.style.transform = ''; b.style.opacity = ''; }
      break;
    }
  }
}

document.addEventListener('touchstart', e => {
  cancelLongPress();
  suppressClick = false;
  if (e.touches.length !== 1) { if (g && g.mode) gestureEnd({ ...g, dx: 0, dy: 0 }); g = null; return; }
  const p = e.touches[0], tg = gestureTarget(e.target);
  if (!tg) { g = null; return; }
  g = { ...tg, x0: p.clientX, y0: p.clientY, t0: Date.now(), dx: 0, dy: 0, dir: null, mode: null, target: e.target };
  if (g.kind === 'sheet' && g.fav) startLongPress(g.fav.dataset.fav);
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!g) return;
  const p = e.touches[0];
  g.dx = p.clientX - g.x0; g.dy = p.clientY - g.y0;
  if (!g.dir) {
    if (Math.abs(g.dx) < 10 && Math.abs(g.dy) < 10) return;
    cancelLongPress();
    g.dir = Math.abs(g.dx) > Math.abs(g.dy) * 1.2 ? 'h' : 'v';
    if (!gestureStart(g)) { g = null; return; }
  }
  if (g.mode && gestureMove(g) && e.cancelable) e.preventDefault();
}, { passive: false });

const endGesture = () => {
  cancelLongPress();
  if (g && g.mode) { const G = g; g = null; gestureEnd(G); }
  g = null;
};
document.addEventListener('touchend', endGesture);
document.addEventListener('touchcancel', () => { if (g && g.mode) g.dx = g.dy = 0; endGesture(); });

/* Rechtsklick (Desktop) bzw. Kontextmenü auf einem Favoriten = bearbeiten */
document.addEventListener('contextmenu', e => {
  const fav = e.target.closest && e.target.closest('[data-fav]');
  if (!fav) return;
  e.preventDefault();
  if (lpTimer || dlgCtx) return;
  const l = state.locations.find(x => x.id === fav.dataset.fav);
  if (l) { suppressClick = true; setTimeout(() => { suppressClick = false; }, 400); openDlg({ mode: 'edit', loc: l }); }
});

/* Gipfelhöhe per Schieberegler */
let bergTimer = null;
document.addEventListener('input', e => {
  if (e.target.id !== 'bergRange') return;
  const v = $('#bergVal');
  if (v) v.textContent = `${fmt(Number(e.target.value))} m`;
});
document.addEventListener('change', e => {
  if (e.target.id !== 'bergRange') return;
  const loc = currentLoc();
  if (!loc) return;
  loc.skiBerg = clamp(Math.round(Number(e.target.value)), BERG_MIN, BERG_MAX);
  persistLocs();
  render();
  clearTimeout(bergTimer);
  bergTimer = setTimeout(() => load('ski'), 300);
});

/* Einmaliger Hinweis auf die Gesten */
function gestureHint() {
  if (LS.get('aw_hint_gestures', false) || !state.main.data) return;
  LS.set('aw_hint_gestures', true);
  setTimeout(() => toast('Tipp: Seitlich wischen wechselt zwischen Wetter, Rennrad und Ski. Nach unten ziehen aktualisiert.', { label: 'OK', fn: () => {}, ms: 9000 }), 800);
}

/* =====================================================================
   Start
   ===================================================================== */
applyTheme();
applyDeepLink();
render();
loadAll();

/* Service Worker: App startet auch offline */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
})();
</script>
