(function () {
  try {

    t = t ? JSON.parse(t) : null;

    if (dark) document.documentElement.classList.add('dark');

})();

</script>

  html, body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }

  html.dark body { background: #020617; color: #fff; }
  .tabular { font-variant-numeric: tabular-nums; }
  .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .pt-safe { padding-top: env(safe-area-inset-top); }
  .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

  .shimmer {
    background: linear-gradient(90deg, rgba(148,163,184,.22) 25%, rgba(148,163,184,.42) 37%, rgba(148,163,184,.22) 63%);
    background-size: 400% 100%; animation: shimmer 1.4s ease infinite;
  }
  @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  .fade-in { animation: fadeIn .28s ease-out both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadbar .bar { height: 100%; width: 40%; background: linear-gradient(90deg, #0ea5e9, #6366f1); transform: translateX(-120%); opacity: 0; }
  #loadbar.on .bar { opacity: 1; animation: loadbar 1.1s ease-in-out infinite; }
  @keyframes loadbar { 0% { transform: translateX(-120%); } 100% { transform: translateX(260%); } }
  .sheet-panel { transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .sheet-overlay { transition: opacity .28s ease; }

  input[type=number]::-webkit-inner-spin-button { opacity: 1; }

<script>
(() => {
'use strict';

/* =====================================================================
   Hilfsfunktionen
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* Speicher voll / privat */ } }
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pad = n => String(n).padStart(2, '0');
const range = (a, b) => { const r = []; for (let i = a; i < b; i++) r.push(i); return r; };
const nums = arr => arr.filter(isNum);
const sum = arr => nums(arr).reduce((a, b) => a + b, 0);
const avg = arr => { const f = nums(arr); return f.length ? f.reduce((a, b) => a + b, 0) / f.length : null; };
const maxOf = arr => { const f = nums(arr); return f.length ? Math.max(...f) : null; };
const minOf = arr => { const f = nums(arr); return f.length ? Math.min(...f) : null; };
const hv = (o, k, i) => (o && o[k] && i >= 0 && i < o[k].length ? o[k][i] : null);
const round100 = v => Math.round(v / 100) * 100;

/** Zahl formatieren: deutsches Komma, echtes Minuszeichen, "–" bei fehlenden Werten */
function fmt(v, unit = '', dec = 0) {
  if (!isNum(v)) return '–';
  let n = dec ? v.toFixed(dec) : String(Math.round(v));
  if (Number(n) === 0) n = n.replace('-', '');
  return n.replace('.', ',').replace('-', '−') + unit;
}
const fmtT = v => fmt(v, '°');

const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const WDL = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
function dateObj(s) { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = dateObj(s); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function dayLabel(s, today, long = false) {
  if (s === today) return 'Heute';
  if (s === addDays(today, 1)) return 'Morgen';
  const d = dateObj(s);
  return long ? `${WDL[d.getDay()]}, ${d.getDate()}.${d.getMonth() + 1}.` : WD[d.getDay()];
}
function clock(ts) { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function dateTime(ts) { const d = new Date(ts); return `${d.getDate()}.${d.getMonth() + 1}. ${clock(ts)}`; }

const WIND_DIRS = ['N', 'NNO', 'NO', 'ONO', 'O', 'OSO', 'SO', 'SSO', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
const dirName = deg => isNum(deg) ? WIND_DIRS[Math.round((((deg % 360) + 360) % 360) / 22.5) % 16] : '–';

function tempColor(t) {
  const stops = [[-15, [79, 70, 229]], [-5, [14, 165, 233]], [5, [34, 197, 94]], [15, [234, 179, 8]], [25, [249, 115, 22]], [35, [220, 38, 38]]];
  if (!isNum(t)) return 'rgb(148,163,184)';
  if (t <= stops[0][0]) return `rgb(${stops[0][1]})`;
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const [t0, c0] = stops[i - 1], [t1, c1] = stops[i], f = (t - t0) / (t1 - t0);
      return `rgb(${c0.map((c, j) => Math.round(c + (c1[j] - c) * f)).join(',')})`;
    }
  }
  return `rgb(${stops[stops.length - 1][1]})`;
}

/* WMO-Wettercodes → Text & Icon (Tag / Nacht) */
const WMO = {
  0: ['Klar', '☀️', '🌙'], 1: ['Überwiegend klar', '🌤️', '🌙'], 2: ['Teilweise bewölkt', '⛅', '☁️'], 3: ['Bedeckt', '☁️'],
  45: ['Nebel', '🌫️'], 48: ['Reifnebel', '🌫️'],
  51: ['Leichter Nieselregen', '🌦️', '🌧️'], 53: ['Nieselregen', '🌧️'], 55: ['Starker Nieselregen', '🌧️'],
  56: ['Gefrierender Niesel', '🌧️'], 57: ['Starker gefrierender Niesel', '🌧️'],
  61: ['Leichter Regen', '🌦️', '🌧️'], 63: ['Regen', '🌧️'], 65: ['Starker Regen', '🌧️'],
  66: ['Gefrierender Regen', '🌧️'], 67: ['Starker gefrierender Regen', '🌧️'],
  71: ['Leichter Schneefall', '🌨️'], 73: ['Schneefall', '🌨️'], 75: ['Starker Schneefall', '❄️'], 77: ['Schneegriesel', '🌨️'],
  80: ['Leichte Regenschauer', '🌦️', '🌧️'], 81: ['Regenschauer', '🌧️'], 82: ['Heftige Regenschauer', '⛈️'],
  85: ['Schneeschauer', '🌨️'], 86: ['Starke Schneeschauer', '❄️'],
  95: ['Gewitter', '⛈️'], 96: ['Gewitter mit Hagel', '⛈️'], 99: ['Schweres Gewitter mit Hagel', '⛈️']
};
function wmo(code, isDay = 1) {
  const w = WMO[code] || ['Keine Angabe', '🌡️'];
  return { text: w[0], icon: (!isDay && w[2]) ? w[2] : w[1] };
}
function uvInfo(uv) {
  if (!isNum(uv)) return { label: '–', cls: 'bg-slate-200 text-slate-900' };
  if (uv < 3) return { label: 'niedrig', cls: 'bg-emerald-500 text-white' };
  if (uv < 6) return { label: 'mäßig', cls: 'bg-yellow-400 text-slate-950' };
  if (uv < 8) return { label: 'hoch', cls: 'bg-orange-500 text-white' };
  if (uv < 11) return { label: 'sehr hoch', cls: 'bg-red-600 text-white' };
  return { label: 'extrem', cls: 'bg-fuchsia-700 text-white' };
}

/* =====================================================================
   Konfiguration & Zustand
   ===================================================================== */
const API = 'https://api.open-meteo.com/v1/forecast';
const GEO_API = 'https://geocoding-api.open-meteo.com/v1/search';
const TTL = 10 * 60 * 1000;            // Daten gelten 10 Min. als frisch
const CACHE_KEY = 'aw_cache_v1';
const CURRENT = ['temperature_2m', 'relative_humidity_2m', 'apparent_temperature', 'is_day', 'precipitation', 'weather_code', 'cloud_cover', 'wind_speed_10m', 'wind_direction_10m', 'wind_gusts_10m'];
const HOURLY_CORE = ['temperature_2m', 'relative_humidity_2m', 'dew_point_2m', 'apparent_temperature', 'precipitation_probability', 'precipitation', 'rain', 'showers', 'snowfall', 'weather_code', 'cloud_cover', 'wind_speed_10m', 'wind_direction_10m', 'wind_gusts_10m', 'uv_index', 'is_day'];
const HOURLY_EXTRA = ['snow_depth', 'cloud_cover_low', 'visibility', 'freezing_level_height', 'wind_speed_700hPa', 'wind_direction_700hPa'];
const DAILY = ['weather_code', 'temperature_2m_max', 'temperature_2m_min', 'precipitation_sum', 'precipitation_probability_max', 'snowfall_sum', 'sunrise', 'sunset', 'uv_index_max', 'wind_speed_10m_max', 'wind_gusts_10m_max'];

const DEFAULT_LOCATIONS = [
  { id: 'jenbach', name: 'Jenbach', region: 'Tal · Tirol', lat: 47.3893, lon: 11.7808, elevation: null, valley: 563, cc: 'AT' },
  { id: 'hintertux', name: 'Hintertuxer Gletscher', region: 'Gletscher · Zillertal', lat: 47.0742, lon: 11.6773, elevation: 3250, valley: 1500, cc: 'AT' },
  { id: 'innsbruck', name: 'Innsbruck', region: 'Tirol', lat: 47.2627, lon: 11.3945, elevation: null, valley: 574, cc: 'AT' }
];

const systemDark = () => window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
const state = {
  locations: LS.get('aw_locations', null) || JSON.parse(JSON.stringify(DEFAULT_LOCATIONS)),
  selectedId: LS.get('aw_selected', 'jenbach'),
  tempLoc: LS.get('aw_temp', null),
  tab: ['wetter', 'rad', 'ski'].includes(LS.get('aw_tab', 'wetter')) ? LS.get('aw_tab', 'wetter') : 'wetter',
  theme: LS.get('aw_theme', null) || (systemDark() ? 'dark' : 'light'),
  skiMode: LS.get('aw_skimode', 'berg'),
  snowType: LS.get('aw_snowtype', 'auto'),
  rideStart: 0,
  rideDur: LS.get('aw_ridedur', 3),
  skiDay: null,
  main: { key: null, data: null, ts: 0, stale: false, error: null, loading: false },
  ski: { key: null, data: null, ts: 0, stale: false, error: null, loading: false },
  search: { q: '', status: 'idle', results: [], error: null },
  resetScroll: false
};
if (!Array.isArray(state.locations)) state.locations = JSON.parse(JSON.stringify(DEFAULT_LOCATIONS));

const persistLocs = () => { LS.set('aw_locations', state.locations); LS.set('aw_temp', state.tempLoc); };

function currentLoc() {
  if (state.selectedId === '__temp' && state.tempLoc) return state.tempLoc;
  return state.locations.find(l => l.id === state.selectedId) || state.locations[0] || state.tempLoc || null;
}
/* Höhen: Wetter/Rad = Höhenangabe des Favoriten, sonst Talhöhe (Geocoding) bzw. Geländemodell */
const mainElev = loc => isNum(loc.elevation) ? loc.elevation : (isNum(loc.valley) ? loc.valley : null);
const talElev = loc => isNum(loc.valley) ? loc.valley : null;
function bergElev(loc) {
  if (isNum(loc.skiBerg)) return loc.skiBerg;
  const v = isNum(loc.valley) ? loc.valley : 600;
  if (isNum(loc.elevation) && loc.elevation >= v + 300) return loc.elevation;
  return clamp(round100(v + 1400), 1500, 3000);
}
const skiElev = loc => state.skiMode === 'tal' ? talElev(loc) : bergElev(loc);

/* =====================================================================
   Datenabruf (Open-Meteo) mit Cache, Timeout & Offline-Fallback
   ===================================================================== */
const memCache = new Map(Object.entries(LS.get(CACHE_KEY, {}) || {}));
function saveCache() {
  const entries = Array.from(memCache.entries()).sort((a, b) => b[1].ts - a[1].ts).slice(0, 8);
  LS.set(CACHE_KEY, Object.fromEntries(entries));
}
const cacheKey = (loc, elev) => `${(+loc.lat).toFixed(3)},${(+loc.lon).toFixed(3)},${isNum(elev) ? Math.round(elev) : 'dem'}`;

async function fetchJSON(url, timeout = 12000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    let body = null;
    try { body = await res.json(); } catch (e) { /* kein JSON */ }
    if (!res.ok || (body && body.error)) {
      const err = new Error((body && body.reason) || `HTTP ${res.status}`);
      err.kind = 'http'; err.status = res.status; throw err;
    }
    if (!body) { const err = new Error('Leere Antwort'); err.kind = 'data'; throw err; }
    return body;
  } catch (e) {
    if (e.kind) throw e;
    const err = new Error(e.name === 'AbortError' ? 'Zeitüberschreitung' : 'Netzwerkfehler');
    err.kind = e.name === 'AbortError' ? 'timeout' : (navigator.onLine === false ? 'offline' : 'network');
    throw err;
  } finally { clearTimeout(timer); }
}

function forecastUrl(loc, elev, lite) {
  const p = new URLSearchParams({
    latitude: String(loc.lat), longitude: String(loc.lon),
    timezone: 'auto', past_days: '2', forecast_days: '7',
    current: CURRENT.join(','),
    hourly: (lite ? HOURLY_CORE : HOURLY_CORE.concat(HOURLY_EXTRA)).join(','),
    daily: DAILY.join(','),
    wind_speed_unit: 'kmh'
  });
  if (isNum(elev)) p.set('elevation', String(Math.round(elev)));
  return `${API}?${p}`;
}

const inflight = new Map();
function getForecast(loc, elev, force = false) {
  const key = cacheKey(loc, elev);
  const cached = memCache.get(key);
  if (!force && cached && Date.now() - cached.ts < TTL) return Promise.resolve({ ...cached, stale: false });
  if (inflight.has(key)) return inflight.get(key);
  const p = (async () => {
    try {
      let data;
      try { data = await fetchJSON(forecastUrl(loc, elev, false)); }
      catch (e) {
        // Falls ein Zusatzparameter nicht unterstützt wird → mit Basis-Variablen erneut versuchen
        if (e.kind === 'http' && e.status === 400) data = await fetchJSON(forecastUrl(loc, elev, true));
        else throw e;
      }
      if (!data.hourly || !Array.isArray(data.hourly.time) || !data.hourly.time.length || !data.daily || !Array.isArray(data.daily.time)) {
        const err = new Error('Unvollständige Wetterdaten'); err.kind = 'data'; throw err;
      }
      const entry = { ts: Date.now(), data };
      memCache.set(key, entry); saveCache();
      return { ...entry, stale: false };
    } catch (e) {
      if (cached) return { ...cached, stale: true, error: e };
      throw e;
    } finally { inflight.delete(key); }
  })();
  inflight.set(key, p);
  return p;
}

async function load(slot, force = false) {
  const loc = currentLoc();
  if (!loc) { render(); return; }
  const elev = slot === 'main' ? mainElev(loc) : skiElev(loc);
  const key = cacheKey(loc, elev);
  const S = state[slot];
  if (S.key !== key) {
    const c = memCache.get(key);
    Object.assign(S, { key, data: c ? c.data : null, ts: c ? c.ts : 0, stale: false, error: null });
  }
  S.loading = true; S.error = null;
  renderChrome();
  try {
    const r = await getForecast(loc, elev, force);
    if (S.key !== key) return;
    Object.assign(S, { data: r.data, ts: r.ts, stale: !!r.stale, error: r.error || null });
    if (r.stale && force) toast(describeError(r.error).title + ' – zeige gespeicherte Daten');
  } catch (e) {
    if (S.key !== key) return;
    S.error = e;
    if (S.data) S.stale = true;
  } finally {
    if (S.key === key) { S.loading = false; render(); }
  }
}
function loadAll(force = false) {
  const p = load('main', force);
  if (state.tab === 'ski') load('ski', force);
  else p.then(() => load('ski', force && state.tab === 'ski'));
  return p;
}

/* Aufbereitung: aktueller Stundenindex in Ortszeit */
function prep(data) {
  const h = data.hourly, dl = data.daily;
  const nowStr = new Date(Date.now() + (data.utc_offset_seconds || 0) * 1000).toISOString().slice(0, 16);
  let nowIdx = 0;
  for (let i = 0; i < h.time.length; i++) { if (h.time[i] <= nowStr) nowIdx = i; else break; }
  const today = nowStr.slice(0, 10);
  let todayD = dl.time.indexOf(today);
  if (todayD < 0) { todayD = dl.time.findIndex(t => t >= today); if (todayD < 0) todayD = dl.time.length - 1; }
  return { h, dl, nowIdx, nowStr, today, todayD, n: h.time.length, hour: Number(nowStr.slice(11, 13)) };
}
function currentVals(data, P, ts) {
  const o = {};
  for (const k of Object.keys(P.h)) if (k !== 'time') o[k] = P.h[k][P.nowIdx];
  if (data.current && Date.now() - ts < 90 * 60 * 1000) {
    for (const [k, v] of Object.entries(data.current)) if (isNum(v) && k !== 'interval') o[k] = v;
  }
  return o;
}

function windowStats(h, a, b) {

function rateBike(W) {
  const f = [];
  let l = 0;
  if (W.gustMax > 55 || W.windMax > 40) l = 2; else if (W.gustMax > 38 || W.windMax > 25) l = 1;
  f.push({ icon: '💨', name: 'Wind', level: l, text: `Böen bis ${fmt(W.gustMax)} km/h` });

  const storm = W.codes.some(c => c >= 95), ice = W.codes.some(c => [56, 57, 66, 67].includes(c));
  let r = 0;
  if (storm || ice || W.popMax >= 60 || W.precip >= 2) r = 2; else if (W.popMax >= 30 || W.precip >= 0.3) r = 1;
  f.push({ icon: '🌧️', name: 'Regen', level: r, text: storm ? 'Gewittergefahr!' : ice ? 'Gefrierender Regen!' : `Risiko ${fmt(W.popMax)} %` });

  let t = 0;
  if (W.tMin < 2 || W.tMax > 36) t = 2; else if (W.tMin < 7 || W.tMax > 31) t = 1;
  f.push({ icon: '🌡️', name: 'Temperatur', level: t, text: W.tMin < 2 ? `${fmt(W.tMin, ' °C')} – Glätte!` : W.tMax > 31 ? `${fmt(W.tMax, ' °C')} – Hitze` : `${fmt(W.tMin)} bis ${fmt(W.tMax, ' °C')}` });

  const level = Math.max(l, r, t);
  const worst = f.filter(x => x.level === level && level > 0).map(x => x.name);
  const summary = level === 0 ? 'Wenig Wind, trocken und angenehme Temperaturen.' : `${level === 2 ? 'Kritisch' : 'Achtung'}: ${worst.join(' & ')}`;
  return { level, factors: f, summary };
}

/* Fahrt-Windchill: JAG/TI-Formel (≤ 10 °C), darüber lineare Näherung */
function rideChill(T, v) {
  if (!isNum(T)) return null;
  if (T <= 10 && v >= 4.8) { const p = Math.pow(v, 0.16); return 13.12 + 0.6215 * T - 11.37 * p + 0.3965 * T * p; }
  return T - 0.11 * v;
}

function clothing(W) {

  const eff = rideChill(W.tMin, vEff), effMax = rideChill(W.tMax, vEff);
  const items = [];
  let head;

  const d = S.data, P = prep(d), h = P.h, i0 = P.nowIdx, n = P.n;
  const c = currentVals(d, P, S.ts);
  const elevUsed = isNum(d.elevation) ? d.elevation : skiElev(loc);

  /* --- Jetzt-Werte --- */
  const snowPast = sum(range(Math.max(0, i0 - 23), i0 + 1).map(i => hv(h, 'snowfall', i)));
  const snowNext = sum(range(i0 + 1, Math.min(n, i0 + 25)).map(i => hv(h, 'snowfall', i)));
  const fzl = hv(h, 'freezing_level_height', i0);
  const fz24 = range(i0, Math.min(n, i0 + 24)).map(i => hv(h, 'freezing_level_height', i));
  const fzMin = minOf(fz24), fzMax = maxOf(fz24);
  let fzTxt = 'keine Daten';
  if (isNum(fzl)) {
    const diff = fzl - elevUsed;
    fzTxt = fzl < 150 ? 'Frost bis in die Täler'
      : diff > 300 ? `<b class="text-red-600 dark:text-red-400">${fmt(diff)} m über dir</b> – Tauwetter auf deiner Höhe`
      : diff >= -300 ? '<b class="text-amber-600 dark:text-amber-400">nahe deiner Höhe</b> – Schnee um 0 °C'
      : `<b class="text-emerald-700 dark:text-emerald-400">${fmt(-diff)} m unter dir</b> – Schnee bleibt kalt`;
  }
  const cloud = c.cloud_cover, low = hv(h, 'cloud_cover_low', i0), vis = hv(h, 'visibility', i0);
  let sight;
  if (c.weather_code === 45 || c.weather_code === 48 || (isNum(vis) && vis < 1000)) sight = { lvl: 2, icon: '🌫️', text: 'Nebel – Whiteout-Gefahr' };
  else if ((hv(h, 'snowfall', i0) || 0) >= 0.5 || (isNum(vis) && vis < 4000)) sight = { lvl: 2, icon: '🌨️', text: 'Schneefall – schlechte Sicht' };
  else if (isNum(cloud) && cloud >= 85) sight = { lvl: 1, icon: '☁️', text: 'Diffuses Licht (Flat Light)' };
  else if (isNum(cloud) && cloud >= 50) sight = { lvl: 1, icon: '⛅', text: 'Wechselnd bewölkt' };
  else sight = { lvl: 0, icon: '😎', text: 'Gute Sicht' };
  const sightCls = ['text-emerald-700 dark:text-emerald-400', 'text-amber-600 dark:text-amber-400', 'text-red-600 dark:text-red-400'][sight.lvl];
  const visTxt = isNum(vis) ? (vis >= 20000 ? '> 20 km' : vis >= 1000 ? fmt(vis / 1000, ' km', vis < 10000 ? 1 : 0) : fmt(vis, ' m')) : '–';
  const hochnebel = state.skiMode === 'tal' && isNum(low) && low >= 70 ? '<div class="mt-1 text-sm font-bold text-sky-700 dark:text-sky-300">Tiefe Wolken – oben oft Sonne über dem Nebel!</div>' : '';

  const gust = c.wind_gusts_10m, w700 = hv(h, 'wind_speed_700hPa', i0), d700 = hv(h, 'wind_direction_700hPa', i0);
  const lift = !isNum(gust) ? null
    : gust >= 80 ? { cls: 'bg-red-600 text-white', t: '🚫 Sturm – Liftsperren wahrscheinlich' }
    : gust >= 60 ? { cls: 'bg-red-600 text-white', t: '⚠️ Exponierte Lifte evtl. geschlossen' }
    : gust >= 40 ? { cls: 'bg-amber-400 text-slate-950', t: '🌬️ Windig – Windchill beachten' }
    : { cls: 'bg-emerald-600 text-white', t: '✅ Ruhige Verhältnisse' };
  const depth = hv(h, 'snow_depth', i0);

  /* --- Skitags-Planer --- */
  const dates = range(0, 5).map(k => addDays(P.today, k));
  const stats = dates.map((dt, k) => skiDayStats(P, dt, k === 0 ? i0 : null));
  let sel = state.skiDay != null ? state.skiDay : (P.hour >= 16 ? 1 : 0);
  if (!stats[sel]) sel = Math.max(0, stats.findIndex(Boolean));
  const SD = stats[sel];
  const days = stats.map((s, k) => {
    if (!s) return '';
    const di = P.dl.time.indexOf(s.date), ww = wmo(hv(P.dl, 'weather_code', di), 1), sc = skiScore(s), on = k === sel;
    return `<button data-act="skiday" data-v="${k}" aria-pressed="${on}" class="snap-start shrink-0 w-[5.6rem] rounded-2xl p-2.5 text-center border-2 transition ${on ? 'border-indigo-600 bg-indigo-50 dark:bg-indigo-950/60 shadow-md' : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900'}">
      <div class="text-sm font-extrabold">${dayLabel(s.date, P.today)}</div>
      <div class="text-3xl my-1 leading-none">${ww.icon}</div>
      <div class="text-amber-500 text-sm leading-none tracking-tighter" aria-label="${sc} von 5">${'★'.repeat(sc)}<span class="text-slate-300 dark:text-slate-700">${'★'.repeat(5 - sc)}</span></div>
      <div class="text-sm font-black tabular mt-1">${fmt(s.tMin)}/${fmtT(s.tMax)}</div>
      <div class="text-xs font-extrabold text-sky-700 dark:text-sky-300 tabular">${s.snowNew >= 0.5 ? `❄️ ${fmt(s.snowNew)} cm` : '❄️ 0 cm'}</div>
    </button>`;
  }).join('');

  /* --- Skiwachs-Berater --- */
  let waxHtml = '';
  if (SD) {
    const det = detectSnow(P, SD.a, SD.b);
    const st = state.snowType === 'auto' ? det.type : state.snowType;
    const A = waxAdvice(SD, st);
    const typeBtns = SNOW_TYPES.map(([v, l]) => `<button data-act="snowtype" data-v="${v}" aria-pressed="${state.snowType === v}" class="shrink-0 px-3.5 py-2 rounded-xl font-extrabold text-sm border-2 ${state.snowType === v ? 'bg-slate-900 text-white border-slate-900 dark:bg-white dark:text-slate-900 dark:border-white' : 'border-slate-300 dark:border-slate-700'}">${l}</button>`).join('');
    waxHtml = `
    ${sectionTitle('Skiwachs-Berater')}
    <section class="rounded-3xl overflow-hidden border border-slate-200 dark:border-slate-800 shadow-sm">
      <div class="${A.cat.card} p-5">
        <div class="text-xs font-extrabold uppercase tracking-widest opacity-90">Empfehlung · ${dayLabel(SD.date, P.today, true)} · ${fmt(elevUsed)} m</div>
        <div class="flex items-center justify-between gap-3 mt-1">
          <div>
            <div class="text-5xl font-black leading-none">${A.cat.name}</div>
            <div class="text-xl font-extrabold mt-1">${A.cat.label} · ${A.cat.range}</div>
          </div>
          <div class="text-6xl" aria-hidden="true">🎿</div>
        </div>
        <p class="mt-2 font-bold">${A.cat.desc}</p>
      </div>
      <div class="p-4 space-y-4 bg-white dark:bg-slate-900">
        ${waxScale(SD.tMin, SD.tMax, A.tRef)}
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="rounded-2xl bg-slate-100 dark:bg-slate-800 p-2.5"><div class="text-[11px] font-extrabold uppercase text-slate-600 dark:text-slate-300">${sel === 0 ? 'Aktuell' : 'Ø Skitag'}</div><div class="text-xl font-black tabular">${fmt(sel === 0 ? c.temperature_2m : SD.tAvg, ' °C')}</div></div>
          <div class="rounded-2xl bg-slate-100 dark:bg-slate-800 p-2.5"><div class="text-[11px] font-extrabold uppercase text-slate-600 dark:text-slate-300">${sel === 0 && SD.a > P.h.time.indexOf(`${SD.date}T09:00`) ? 'Bis 16 Uhr' : '9–16 Uhr'}</div><div class="text-xl font-black tabular whitespace-nowrap">${fmt(SD.tMin)}/${fmt(SD.tMax, '°')}</div></div>
          <div class="rounded-2xl bg-slate-100 dark:bg-slate-800 p-2.5"><div class="text-[11px] font-extrabold uppercase text-slate-600 dark:text-slate-300">Wachs-Ref.</div><div class="text-xl font-black tabular">${fmt(A.tRef, ' °C')}</div></div>
        </div>

        <div>
          <div class="${LABEL} mb-2">Schneebeschaffenheit</div>
          <div class="flex flex-wrap gap-2">${typeBtns}</div>
          <div class="${SUB} mt-2">${state.snowType === 'auto' ? `Automatisch erkannt: <b>${SNOW_NAMES[det.type]}</b> (${det.why})` : `Manuell gewählt: <b>${SNOW_NAMES[st]}</b> · Auto hätte „${SNOW_NAMES[det.type]}“ erkannt`}</div>
        </div>

        ${A.mix ? `<div class="rounded-2xl border-2 border-indigo-300 dark:border-indigo-700 bg-indigo-50 dark:bg-indigo-950/50 p-3.5"><div class="font-black">🔀 Wachs-Mix empfohlen</div><div class="text-sm font-semibold mt-1 leading-snug">${A.mix}</div></div>` : ''}

        <div class="rounded-2xl border-2 p-3.5 ${A.hum.cls}">
          <div class="font-black">${A.hum.icon} ${A.hum.title}</div>
          <div class="text-sm font-semibold mt-1 leading-snug">${A.hum.text}</div>
        </div>

        <div class="flex gap-3 items-start rounded-2xl bg-slate-100 dark:bg-slate-800 p-3.5">
          ${structIcon(A.struct.lvl)}
          <div><div class="font-black">Struktur: ${A.struct.name}</div><div class="text-sm font-semibold mt-1 leading-snug">${A.struct.text}</div></div>
        </div>

        <ul class="space-y-2">
          ${A.notes.map(([ic, t]) => `<li class="flex gap-3 items-start text-sm font-semibold leading-snug"><span class="text-lg leading-5">${ic}</span><span>${t}</span></li>`).join('')}
          <li class="flex gap-3 items-start text-sm font-semibold leading-snug"><span class="text-lg leading-5">♨️</span><span>Bügeleisen ca. <b>${A.cat.iron}</b> (Herstellerangabe beachten, Wachs darf nicht rauchen). 20–30 Min. abkühlen lassen, abziehen, bürsten: Messing → Nylon → Rosshaar.</span></li>
        </ul>
      </div>
    </section>`;
  }

  return `${staleBanner(S)}${toggle}
  ${sectionTitle(`Jetzt auf ${fmt(elevUsed)} m`)}
  <div class="grid grid-cols-2 gap-3 fade-in">
    ${tile({ icon: '🌡️', label: 'Temperatur', value: fmt(c.temperature_2m, ' °C'), sub: `Gefühlt ${fmt(c.apparent_temperature, ' °C')} · ${fmt(c.relative_humidity_2m, ' %')} rF` })}
    ${tile({ icon: '❄️', label: 'Neuschnee', value: `${fmt(snowPast, '', snowPast > 0 && snowPast < 10 ? 1 : 0)}<span class="text-base"> cm</span>`, sub: `letzte 24 h · <b>+${fmt(snowNext, ' cm', snowNext > 0 && snowNext < 10 ? 1 : 0)}</b> nächste 24 h${isNum(depth) ? ` · Schneehöhe ${fmt(depth * 100, ' cm')}` : ''}`, accent: snowPast >= 10 ? 'text-sky-600 dark:text-sky-400' : '' })}
    <div class="${CARD} p-3.5 col-span-2">
      <div class="${LABEL}">🧊 Nullgradgrenze</div>
      <div class="flex items-baseline gap-3 mt-1.5">
        <div class="text-[30px] leading-none font-black tabular">${fmt(fzl, ' m')}</div>
        <div class="text-sm font-bold text-slate-600 dark:text-slate-300 tabular">24 h: ${fmt(fzMin)}–${fmt(fzMax, ' m')}</div>
      </div>
      <div class="${SUB} mt-1.5">${fzTxt}</div>
    </div>
    <div class="${CARD} p-3.5 col-span-2">
      <div class="${LABEL}">👁️ Bewölkung & Sicht</div>
      <div class="flex items-center gap-3 mt-1.5">
        <div class="text-4xl">${sight.icon}</div>
        <div class="min-w-0">
          <div class="text-xl font-black ${sightCls}">${sight.text}</div>
          <div class="${SUB}">Wolken ${fmt(cloud, ' %')} · tief ${fmt(low, ' %')} · Sicht ${visTxt}</div>
          ${hochnebel}
        </div>
      </div>
    </div>
    <div class="${CARD} p-3.5 col-span-2">
      <div class="${LABEL}">🌬️ Wind in Gipfellage</div>
      <div class="flex items-center gap-4 mt-1.5">
        ${compass(c.wind_direction_10m, 96)}
        <div class="min-w-0 flex-1">
          <div class="text-[28px] leading-none font-black tabular">${fmt(c.wind_speed_10m)}<span class="text-base"> km/h</span></div>
          <div class="${SUB} mt-1">Böen <b>${fmt(gust)} km/h</b> · aus ${dirName(c.wind_direction_10m)}</div>
          ${isNum(w700) ? `<div class="${SUB}">Höhenwind ~3000 m: <b>${fmt(w700)} km/h</b> aus ${dirName(d700)}</div>` : ''}
        </div>
      </div>
      ${lift ? `<div class="mt-3 rounded-xl px-3 py-2 font-extrabold text-sm ${lift.cls}">${lift.t}</div>` : ''}
    </div>
  </div>

  ${sectionTitle('Skitags-Planer', `<span class="text-xs font-bold text-slate-500 dark:text-slate-400">9–16 Uhr</span>`)}
  <div data-scroll="skidays" class="no-scrollbar flex gap-2 overflow-x-auto snap-x -mx-4 px-4 pb-1">${days}</div>
  ${SD ? (() => {
    const sc = skiScore(SD);
    return `<section class="${CARD} p-4">
      <div class="flex items-center justify-between">
        <div><div class="${LABEL}">${dayLabel(SD.date, P.today, true)}</div><div class="text-2xl font-black">${SCORE_TXT[sc]} ${SD.snowNew >= 15 && (SD.cloudAvg ?? 100) < 60 ? '· Powder! 🤩' : ''}</div></div>
        <div class="text-amber-500 text-2xl tracking-tighter">${'★'.repeat(sc)}<span class="text-slate-300 dark:text-slate-700">${'★'.repeat(5 - sc)}</span></div>
      </div>
      <div class="grid grid-cols-2 gap-2 mt-3 text-sm font-bold">
        <div class="rounded-xl bg-slate-100 dark:bg-slate-800 px-3 py-2">☁️ Wolken Ø <b class="tabular">${fmt(SD.cloudAvg, ' %')}</b></div>
        <div class="rounded-xl bg-slate-100 dark:bg-slate-800 px-3 py-2">🌬️ Böen bis <b class="tabular">${fmt(SD.gustMax, ' km/h')}</b></div>
        <div class="rounded-xl bg-slate-100 dark:bg-slate-800 px-3 py-2">❄️ Neuschnee <b class="tabular">${fmt(SD.snowNew, ' cm')}</b></div>
        <div class="rounded-xl bg-slate-100 dark:bg-slate-800 px-3 py-2">🧊 0°-Grenze Ø <b class="tabular">${fmt(SD.fzlAvg, ' m')}</b></div>
      </div>
    </section>`;
  })() : ''}
  ${waxHtml}
  ${footer(S)}`;
}

/* =====================================================================
   Rendern
   ===================================================================== */
const TAB_STYLE = {
  wetter: { on: 'text-sky-700 dark:text-sky-300', pill: 'bg-sky-100 dark:bg-sky-900/60' },
  rad: { on: 'text-emerald-700 dark:text-emerald-300', pill: 'bg-emerald-100 dark:bg-emerald-900/60' },
  ski: { on: 'text-indigo-700 dark:text-indigo-300', pill: 'bg-indigo-100 dark:bg-indigo-900/60' }
};
const SUN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" class="w-5 h-5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
const MOON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';

function renderChrome() {
  const loc = currentLoc();
  const S = state.tab === 'ski' ? state.ski : state.main;
  $('#hdrName').textContent = loc ? loc.name : 'Kein Ort gewählt';
  let sub = 'Tippen, um einen Ort zu wählen';
  if (loc) {
    const e = state.main.data && isNum(state.main.data.elevation) ? state.main.data.elevation : mainElev(loc);
    sub = [loc.region, isNum(e) ? `${fmt(e)} m` : '', state.main.ts ? `${clock(state.main.ts)} Uhr` : ''].filter(Boolean).join(' · ');
  }
  $('#hdrSub').textContent = sub;
  const busy = state.main.loading || (state.tab === 'ski' && state.ski.loading);
  $('#refreshIcon').classList.toggle('spin', !!busy);
  $('#loadbar').classList.toggle('on', !!busy && !!S.data);
  $('#themeIcon').innerHTML = state.theme === 'dark' ? SUN_SVG : MOON_SVG;
  $$('[data-tab]').forEach(btn => {
    const on = btn.dataset.tab === state.tab, st = TAB_STYLE[btn.dataset.tab];
    btn.setAttribute('aria-selected', String(on));
    btn.className = `flex flex-col items-center gap-1 py-1.5 transition ${on ? st.on : 'text-slate-500 dark:text-slate-400'}`;
    btn.querySelector('.pill').className = `pill px-5 py-1 rounded-full transition ${on ? st.pill : ''}`;
  });
  const nb = $('#netBanner');
  nb.innerHTML = navigator.onLine === false
    ? `<div class="mt-1 mb-1 rounded-2xl px-4 py-2.5 bg-slate-900 text-white dark:bg-white dark:text-slate-900 text-sm font-extrabold flex items-center gap-2">📡 Offline – es werden gespeicherte Daten angezeigt</div>` : '';
}

function emptyState() {
  return `<div class="${CARD} p-6 text-center fade-in">
    <div class="text-5xl mb-3">🗺️</div>
    <h2 class="text-xl font-black mb-2">Noch kein Ort gespeichert</h2>
    <p class="font-semibold text-slate-600 dark:text-slate-300 mb-5">Suche einen Ort oder stelle die Standard-Orte wieder her.</p>
    <div class="flex flex-col gap-2">
      <button data-act="open-sheet" class="px-6 py-3.5 rounded-2xl bg-sky-600 text-white font-extrabold">Ort suchen</button>
      <button data-act="restore" class="px-6 py-3.5 rounded-2xl bg-slate-200 dark:bg-slate-800 font-extrabold">Standard-Orte wiederherstellen</button>
    </div>
  </div>`;
}

function render() {
  const view = $('#view');
  const scrolls = {};
  if (!state.resetScroll) $$('[data-scroll]', view).forEach(el => { scrolls[el.dataset.scroll] = el.scrollLeft; });
  state.resetScroll = false;
  let html;
  try {
    if (!currentLoc()) html = emptyState();
    else if (state.tab === 'rad') html = renderBike();
    else if (state.tab === 'ski') html = renderSki();
    else html = renderWeather();
  } catch (e) {
    console.error(e);
    html = errorCard({ kind: 'render', message: e.message });
  }
  view.innerHTML = html;
  $$('[data-scroll]', view).forEach(el => { if (scrolls[el.dataset.scroll] != null) el.scrollLeft = scrolls[el.dataset.scroll]; });
  renderChrome();
}

/* =====================================================================
   Orte: Sheet, Suche, Favoriten
   ===================================================================== */
const flag = cc => (cc && /^[A-Za-z]{2}$/.test(cc)) ? String.fromCodePoint(...cc.toUpperCase().split('').map(ch => 127397 + ch.charCodeAt(0))) : '📍';
const PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>';
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';

function renderSheet() {
  const cur = currentLoc();
  const s = state.search;
  let results = '';
  if (s.q.length >= 2) {
    if (s.status === 'loading') results = `<div class="flex items-center gap-2 font-bold text-slate-600 dark:text-slate-300 px-1 py-2">${SPINNER} Suche „${esc(s.q)}“ …</div>`;
    else if (s.status === 'error') results = `<div class="rounded-2xl p-4 bg-red-50 dark:bg-red-950/50 text-red-800 dark:text-red-200 font-bold">${describeError(s.error).icon} ${describeError(s.error).title}<div class="text-sm font-semibold mt-1">${describeError(s.error).msg}</div></div>`;
    else if (s.status === 'done' && !s.results.length) results = `<div class="rounded-2xl p-4 bg-slate-100 dark:bg-slate-900 font-bold">Kein Ort gefunden für „${esc(s.q)}“.</div>`;
    else if (s.results.length) {
      results = `<div class="${LABEL} px-1">Suchergebnisse</div><ul class="space-y-2">${s.results.map((r, i) => `
        <li><button data-act="pick-result" data-i="${i}" class="w-full flex items-center gap-3 text-left rounded-2xl px-4 py-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 active:scale-[.98]">
          <span class="text-2xl">${flag(r.country_code)}</span>
          <span class="min-w-0 flex-1"><span class="block font-extrabold truncate">${esc(r.name)}</span>
          <span class="block text-sm font-semibold text-slate-600 dark:text-slate-300 truncate">${esc([r.admin2, r.admin1, r.country].filter(Boolean).join(', '))}${isNum(r.elevation) ? ` · ${fmt(r.elevation)} m` : ''}</span></span>
          <span class="text-sky-600 dark:text-sky-400 font-black text-xl">＋</span>
        </button></li>`).join('')}</ul>`;
    }
  }
  const tempItem = state.tempLoc && cur === state.tempLoc ? `
    <div class="${LABEL} px-1">Aktuell angezeigt</div>
    <div class="flex items-center gap-2 rounded-2xl border-2 border-sky-500 bg-sky-50 dark:bg-sky-950/40 px-4 py-3">
      <div class="min-w-0 flex-1"><div class="font-extrabold truncate">${esc(state.tempLoc.name)}</div><div class="text-sm font-semibold text-slate-600 dark:text-slate-300 truncate">${esc(state.tempLoc.region || '')} · nicht gespeichert</div></div>
      <button data-act="save-temp" class="px-3 py-2 rounded-xl bg-sky-600 text-white font-extrabold text-sm">★ Speichern</button>
    </div>` : '';
  const favs = state.locations.map(l => {
    const on = cur && cur.id === l.id;
    const e = isNum(l.elevation) ? `<span class="ml-1 px-1.5 py-0.5 rounded-md bg-indigo-100 text-indigo-800 dark:bg-indigo-900/70 dark:text-indigo-200 text-xs font-extrabold">⛰ ${fmt(l.elevation)} m</span>` : (isNum(l.valley) ? `<span class="ml-1 text-xs font-bold">· ${fmt(l.valley)} m</span>` : '');
    return `<li class="flex items-center gap-1 rounded-2xl border-2 ${on ? 'border-sky-500 bg-sky-50 dark:bg-sky-950/40' : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900'}">
      <button data-act="select" data-id="${esc(l.id)}" class="flex-1 min-w-0 text-left pl-4 py-3">
        <div class="font-extrabold truncate">${on ? '✓ ' : ''}${esc(l.name)}</div>
        <div class="text-sm font-semibold text-slate-600 dark:text-slate-300 truncate">${esc(l.region || '')}${e}</div>
      </button>
      <button data-act="edit" data-id="${esc(l.id)}" class="w-11 h-11 grid place-items-center rounded-xl text-slate-600 dark:text-slate-300 active:bg-slate-200 dark:active:bg-slate-800" aria-label="${esc(l.name)} bearbeiten">${PENCIL}</button>
      <button data-act="del" data-id="${esc(l.id)}" class="w-11 h-11 mr-1 grid place-items-center rounded-xl text-red-600 dark:text-red-400 active:bg-red-100 dark:active:bg-red-950" aria-label="${esc(l.name)} löschen">${TRASH}</button>
    </li>`;
  }).join('');
  $('#sheetBody').innerHTML = `
    ${results ? `<div class="space-y-2">${results}</div>` : ''}
    <button data-act="geo" class="w-full flex items-center justify-center gap-2 rounded-2xl px-4 py-3 bg-sky-600 text-white font-extrabold active:scale-[.98]">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" class="w-5 h-5"><path d="M2 12h3M19 12h3M12 2v3M12 19v3"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg>
      Aktuellen Standort verwenden</button>
    ${tempItem ? `<div class="space-y-2">${tempItem}</div>` : ''}
    <div class="space-y-2">
      <div class="${LABEL} px-1">★ Favoriten</div>
      ${favs ? `<ul class="space-y-2">${favs}</ul>` : `<p class="font-semibold text-slate-600 dark:text-slate-300 px-1">Noch keine Favoriten – suche oben nach einem Ort.</p>`}
      <button data-act="restore" class="w-full text-center text-sm font-extrabold text-slate-600 dark:text-slate-300 underline py-2">Standard-Orte wiederherstellen</button>
    </div>`;
}

let sheetOpen = false;
function openSheet() {
  const el = $('#sheet');
  el.classList.remove('hidden'); el.setAttribute('aria-hidden', 'false');
  renderSheet();
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $('.sheet-panel', el).classList.remove('translate-y-full');
    $('.sheet-overlay', el).classList.remove('opacity-0');
  }));
  sheetOpen = true;
}
function closeSheet() {
  const el = $('#sheet');
  $('.sheet-panel', el).classList.add('translate-y-full');
  $('.sheet-overlay', el).classList.add('opacity-0');
  document.body.style.overflow = '';
  $('#searchInput').blur();
  sheetOpen = false;
  setTimeout(() => { if (!sheetOpen) { el.classList.add('hidden'); el.setAttribute('aria-hidden', 'true'); } }, 300);
}

let searchTimer = null, searchSeq = 0;
async function doSearch(q) {
  const seq = ++searchSeq;
  state.search = { q, status: 'loading', results: [], error: null };
  renderSheet();
  try {
    const url = `${GEO_API}?${new URLSearchParams({ name: q, count: '8', language: 'de', format: 'json' })}`;
    const data = await fetchJSON(url, 10000);
    if (seq !== searchSeq) return;
    state.search = { q, status: 'done', results: Array.isArray(data.results) ? data.results : [], error: null };
  } catch (e) {
    if (seq !== searchSeq) return;
    state.search = { q, status: 'error', results: [], error: e };
  }
  if (sheetOpen) renderSheet();
}

/* --- Dialog speichern/bearbeiten --- */
let dlgCtx = null;
function openDlg(ctx) {
  dlgCtx = ctx;
  const f = $('#dlgForm'), loc = ctx.loc;
  $('#dlgTitle').textContent = ctx.mode === 'edit' ? 'Ort bearbeiten' : 'Ort hinzufügen';
  $('#dlgInfo').textContent = `${loc.region || ''} · ${(+loc.lat).toFixed(3)}, ${(+loc.lon).toFixed(3)}`;
  f.elements.name.value = loc.name || '';
  f.elements.elevation.value = isNum(loc.elevation) ? loc.elevation : '';
  f.elements.elevation.placeholder = isNum(loc.valley) ? `leer = Talhöhe ${fmt(loc.valley)} m` : 'leer = Geländehöhe';
  $('#dlgElevHint').textContent = 'Für Berg-Orte die Höhe der Bergstation / des Gipfels eintragen (z. B. 3250). Ohne Angabe gilt die Höhe des Ortes (Tal).';
  $('#dlgError').classList.add('hidden');
  $('[data-act="dlg-delete"]').classList.toggle('hidden', ctx.mode !== 'edit');
  $('[data-act="dlg-view"]').classList.toggle('hidden', ctx.mode !== 'add');
  const el = $('#dlg'); el.classList.remove('hidden'); el.setAttribute('aria-hidden', 'false');
}
function closeDlg() { const el = $('#dlg'); el.classList.add('hidden'); el.setAttribute('aria-hidden', 'true'); dlgCtx = null; }
function readDlg() {
  const f = $('#dlgForm');
  const name = f.elements.name.value.trim();
  const raw = String(f.elements.elevation.value).trim().replace(',', '.');
  const err = m => { const e = $('#dlgError'); e.textContent = m; e.classList.remove('hidden'); return null; };
  if (!name) return err('Bitte einen Namen eingeben.');
  let elevation = null;
  if (raw !== '') {
    elevation = Number(raw);
    if (!Number.isFinite(elevation) || elevation < -400 || elevation > 8848) return err('Die Höhe muss zwischen −400 und 8848 m liegen.');
    elevation = Math.round(elevation);
  }
  return { name, elevation };
}

function selectLoc(id) {
  state.selectedId = id;
  LS.set('aw_selected', id);
  state.rideStart = 0; state.skiDay = null; state.resetScroll = true;
  if (sheetOpen) closeSheet();
  window.scrollTo({ top: 0 });
  render();
  loadAll();
}
function locFromResult(r) {
  return {
    id: 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: r.name, region: [r.admin1, r.country].filter(Boolean).join(', '),
    lat: r.latitude, lon: r.longitude, elevation: null,
    valley: isNum(r.elevation) ? Math.round(r.elevation) : null, cc: r.country_code || ''
  };
}

/* =====================================================================
   Toast, Theme
   ===================================================================== */
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.remove('opacity-0');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('opacity-0'), 3200);
}
function applyTheme() {
  const dark = state.theme === 'dark';
  document.documentElement.classList.toggle('dark', dark);
  $('#themeColor').setAttribute('content', dark ? '#020617' : '#f1f5f9');
}

/* =====================================================================
   Events
   ===================================================================== */
let bergTimer = null;
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) {
    const t = tabBtn.dataset.tab;
    if (t !== state.tab) {
      state.tab = t; LS.set('aw_tab', t); state.resetScroll = true;
      window.scrollTo({ top: 0 });
      render();
      if (t === 'ski') load('ski');
    }
    return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  const loc = currentLoc();
  switch (act) {
    case 'open-sheet': openSheet(); break;
    case 'close-sheet': closeSheet(); break;
    case 'refresh': case 'retry':
      if (navigator.onLine === false) toast('Keine Internetverbindung');
      loadAll(true); break;
    case 'theme':
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      LS.set('aw_theme', state.theme); applyTheme(); renderChrome(); break;
    case 'ridestart': state.rideStart = Number(v) || 0; render(); break;
    case 'ridedur': state.rideDur = Number(v) || 3; LS.set('aw_ridedur', state.rideDur); render(); break;
    case 'skimode':
      if (v !== state.skiMode) { state.skiMode = v; LS.set('aw_skimode', v); render(); load('ski'); }
      break;
    case 'berg-step':
    case 'berg-edit': {
      if (!loc) break;
      let next = bergElev(loc);
      if (act === 'berg-step') next += Number(v);
      else {
        const inp = window.prompt('Höhe der Gipfellage in Metern:', String(next));
        if (inp == null) break;
        next = Number(String(inp).replace(',', '.'));
        if (!Number.isFinite(next)) { toast('Bitte eine Zahl eingeben'); break; }
      }
      loc.skiBerg = clamp(Math.round(next), 0, 8848);
      persistLocs(); render();
      clearTimeout(bergTimer);
      bergTimer = setTimeout(() => load('ski'), 500);
      break;
    }
    case 'snowtype': state.snowType = v; LS.set('aw_snowtype', v); render(); break;
    case 'skiday': state.skiDay = Number(v) || 0; render(); break;
    case 'select': selectLoc(el.dataset.id); break;
    case 'edit': {
      const l = state.locations.find(x => x.id === el.dataset.id);
      if (l) openDlg({ mode: 'edit', loc: l });
      break;
    }
    case 'del': {
      const l = state.locations.find(x => x.id === el.dataset.id);
      if (l && window.confirm(`„${l.name}“ aus den Favoriten löschen?`)) {
        state.locations = state.locations.filter(x => x.id !== l.id);
        persistLocs();
        if (state.selectedId === l.id) { const nx = state.locations[0]; state.selectedId = nx ? nx.id : '__temp'; LS.set('aw_selected', state.selectedId); render(); loadAll(); }
        renderSheet(); renderChrome();
      }
      break;
    }
    case 'pick-result': {
      const r = state.search.results[Number(el.dataset.i)];
      if (r) openDlg({ mode: 'add', loc: locFromResult(r) });
      break;
    }
    case 'save-temp': if (state.tempLoc) openDlg({ mode: 'add', loc: { ...state.tempLoc, id: 'l' + Date.now().toString(36) } }); break;
    case 'restore': {
      const ids = new Set(state.locations.map(l => l.id));
      DEFAULT_LOCATIONS.forEach(d => { if (!ids.has(d.id)) state.locations.push(JSON.parse(JSON.stringify(d))); });
      persistLocs();
      toast('Standard-Orte wiederhergestellt');
      if (sheetOpen) renderSheet();
      if (!currentLoc() || state.selectedId === '__temp' && !state.tempLoc) selectLoc(state.locations[0].id); else render();
      break;
    }
    case 'geo': {
      if (!('geolocation' in navigator)) { toast('Standortbestimmung wird nicht unterstützt'); break; }
      toast('Standort wird ermittelt …');
      navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;
        state.tempLoc = { id: '__temp', name: 'Mein Standort', region: `${latitude.toFixed(3)}, ${longitude.toFixed(3)}`, lat: latitude, lon: longitude, elevation: null, valley: null };
        persistLocs(); selectLoc('__temp');
      }, err => toast(err.code === 1 ? 'Standortzugriff wurde verweigert' : 'Standort nicht verfügbar'), { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 });
      break;
    }
    case 'close-dlg': closeDlg(); break;
    case 'dlg-view': {
      if (!dlgCtx) break;
      const vals = readDlg(); if (!vals) break;
      state.tempLoc = { ...dlgCtx.loc, ...vals, id: '__temp' };
      persistLocs(); closeDlg(); selectLoc('__temp');
      break;
    }
    case 'dlg-delete': {
      if (!dlgCtx) break;
      const id = dlgCtx.loc.id; closeDlg();
      const btn = document.createElement('button'); btn.dataset.act = 'del'; btn.dataset.id = id;
      document.body.appendChild(btn); btn.click(); btn.remove();
      break;
    }
  }
});

$('#dlgForm').addEventListener('submit', e => {
  e.preventDefault();
  if (!dlgCtx) return;
  const vals = readDlg(); if (!vals) return;
  if (dlgCtx.mode === 'edit') {
    const l = dlgCtx.loc;
    if (l.elevation !== vals.elevation) l.skiBerg = null;
    l.name = vals.name; l.elevation = vals.elevation;
    persistLocs(); closeDlg();
    if (sheetOpen) renderSheet();
    if (currentLoc() === l) { render(); loadAll(); }
    toast('Gespeichert');
  } else {
    const l = { ...dlgCtx.loc, ...vals };
    if (state.tempLoc && state.selectedId === '__temp' && Math.abs(state.tempLoc.lat - l.lat) < 1e-6 && Math.abs(state.tempLoc.lon - l.lon) < 1e-6) state.tempLoc = null;
    state.locations.push(l);
    persistLocs(); closeDlg();
    state.search = { q: '', status: 'idle', results: [], error: null };
    $('#searchInput').value = '';
    toast(`„${l.name}“ gespeichert`);
    selectLoc(l.id);
  }
});

$('#searchInput').addEventListener('input', e => {
  const q = e.target.value.trim();
  clearTimeout(searchTimer);
  if (q.length < 2) { searchSeq++; state.search = { q, status: 'idle', results: [], error: null }; renderSheet(); return; }
  searchTimer = setTimeout(() => doSearch(q), 350);
});
$('#searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); const q = e.target.value.trim(); clearTimeout(searchTimer); if (q.length >= 2) doSearch(q); e.target.blur(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (dlgCtx) closeDlg(); else if (sheetOpen) closeSheet();
});

window.addEventListener('online', () => { toast('Wieder online – lade aktuelle Daten'); renderChrome(); loadAll(true); });
window.addEventListener('offline', () => { toast('Keine Internetverbindung'); render(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (Date.now() - state.main.ts > TTL) loadAll(); else render();
  }
});
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onChange = ev => { if (!LS.get('aw_theme', null)) { state.theme = ev.matches ? 'dark' : 'light'; applyTheme(); renderChrome(); } };
  if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
}
let lastHour = new Date().getHours();
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - state.main.ts > TTL && !state.main.loading && navigator.onLine !== false) loadAll();
  else if (new Date().getHours() !== lastHour) { lastHour = new Date().getHours(); render(); }
}, 60 * 1000);

/* =====================================================================
   Start
   ===================================================================== */
applyTheme();
render();
loadAll();

/* Service Worker: App startet auch offline */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
})();
</script>
</body>
</html>
