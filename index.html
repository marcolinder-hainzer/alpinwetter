<script>
/* Theme so früh wie möglich setzen (kein Aufblitzen) */
(function () {
  try {
    var t = localStorage.getItem('aw_theme');
    t = t ? JSON.parse(t) : null;
    var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.classList.add('dark');
    document.getElementById('themeColor').setAttribute('content', dark ? '#020617' : '#f1f5f9');
  } catch (e) {}
})();

</script>

/** Zahl formatieren: deutsches Komma, echtes Minuszeichen, "–" bei fehlenden Werten */
function fmt(v, unit = '', dec = 0) {
  if (!isNum(v)) return '–';

  if (Number(n) === 0) n = n.replace('-', '');
  return n.replace('.', ',').replace('-', '−') + unit;
}

const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const WDL = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
function dateObj(s) { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = dateObj(s); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function dayLabel(s, today, long = false) {

  const d = dateObj(s);
  return long ? `${WDL[d.getDay()]}, ${d.getDate()}.${d.getMonth() + 1}.` : WD[d.getDay()];
}
function clock(ts) { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }

const WIND_DIRS = ['N', 'NNO', 'NO', 'ONO', 'O', 'OSO', 'SO', 'SSO', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
const dirName = deg => isNum(deg) ? WIND_DIRS[Math.round((((deg % 360) + 360) % 360) / 22.5) % 16] : '–';

function tempColor(t) {
  const stops = [[-15, [79, 70, 229]], [-5, [14, 165, 233]], [5, [34, 197, 94]], [15, [234, 179, 8]], [25, [249, 115, 22]], [35, [220, 38, 38]]];
  if (!isNum(t)) return 'rgb(148,163,184)';
  if (t <= stops[0][0]) return `rgb(${stops[0][1]})`;
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const [t0, c0] = stops[i - 1], [t1, c1] = stops[i], f = (t - t0) / (t1 - t0);
      return `rgb(${c0.map((c, j) => Math.round(c + (c1[j] - c) * f)).join(',')})`;
    }
  }
  return `rgb(${stops[stops.length - 1][1]})`;
}

/* Höhen: Wetter/Rad = Höhenangabe des Favoriten, sonst Talhöhe (Geocoding) bzw. Geländemodell */
const mainElev = loc => isNum(loc.elevation) ? loc.elevation : (isNum(loc.valley) ? loc.valley : null);
const talElev = loc => isNum(loc.valley) ? loc.valley : null;
function bergElev(loc) {

/* =====================================================================
   Datenabruf (Open-Meteo) mit Cache, Timeout & Offline-Fallback
   ===================================================================== */
const memCache = new Map(Object.entries(LS.get(CACHE_KEY, {}) || {}));
function saveCache() {
  const entries = Array.from(memCache.entries()).sort((a, b) => b[1].ts - a[1].ts).slice(0, 8);
  LS.set(CACHE_KEY, Object.fromEntries(entries));
}
const cacheKey = (loc, elev) => `${(+loc.lat).toFixed(3)},${(+loc.lon).toFixed(3)},${isNum(elev) ? Math.round(elev) : 'dem'}`;

async function fetchJSON(url, timeout = 12000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    let body = null;
    try { body = await res.json(); } catch (e) { /* kein JSON */ }
    if (!res.ok || (body && body.error)) {
      const err = new Error((body && body.reason) || `HTTP ${res.status}`);
      err.kind = 'http'; err.status = res.status; throw err;
    }
    if (!body) { const err = new Error('Leere Antwort'); err.kind = 'data'; throw err; }
    return body;
  } catch (e) {
    if (e.kind) throw e;
    const err = new Error(e.name === 'AbortError' ? 'Zeitüberschreitung' : 'Netzwerkfehler');
    err.kind = e.name === 'AbortError' ? 'timeout' : (navigator.onLine === false ? 'offline' : 'network');
    throw err;
  } finally { clearTimeout(timer); }
}

function forecastUrl(loc, elev, lite) {
  const p = new URLSearchParams({
    latitude: String(loc.lat), longitude: String(loc.lon),
    timezone: 'auto', past_days: '2', forecast_days: '7',
    current: CURRENT.join(','),
    hourly: (lite ? HOURLY_CORE : HOURLY_CORE.concat(HOURLY_EXTRA)).join(','),
    daily: DAILY.join(','),
    wind_speed_unit: 'kmh'
  });
  if (isNum(elev)) p.set('elevation', String(Math.round(elev)));
  return `${API}?${p}`;
}

const inflight = new Map();
function getForecast(loc, elev, force = false) {
  const key = cacheKey(loc, elev);
  const cached = memCache.get(key);
  if (!force && cached && Date.now() - cached.ts < TTL) return Promise.resolve({ ...cached, stale: false });
  if (inflight.has(key)) return inflight.get(key);
  const p = (async () => {
    try {
      let data;
      try { data = await fetchJSON(forecastUrl(loc, elev, false)); }
      catch (e) {
        // Falls ein Zusatzparameter nicht unterstützt wird → mit Basis-Variablen erneut versuchen
        if (e.kind === 'http' && e.status === 400) data = await fetchJSON(forecastUrl(loc, elev, true));
        else throw e;
      }
      if (!data.hourly || !Array.isArray(data.hourly.time) || !data.hourly.time.length || !data.daily || !Array.isArray(data.daily.time)) {
        const err = new Error('Unvollständige Wetterdaten'); err.kind = 'data'; throw err;
      }
      const entry = { ts: Date.now(), data };
      memCache.set(key, entry); saveCache();
      return { ...entry, stale: false };
    } catch (e) {
      if (cached) return { ...cached, stale: true, error: e };
      throw e;
    } finally { inflight.delete(key); }
  })();
  inflight.set(key, p);
  return p;
}

async function load(slot, force = false) {
  const loc = currentLoc();
  if (!loc) { render(); return; }
  const elev = slot === 'main' ? mainElev(loc) : skiElev(loc);
  const key = cacheKey(loc, elev);
  const S = state[slot];
  if (S.key !== key) {
    const c = memCache.get(key);
    Object.assign(S, { key, data: c ? c.data : null, ts: c ? c.ts : 0, stale: false, error: null });
  }
  S.loading = true; S.error = null;
  renderChrome();
  try {
    const r = await getForecast(loc, elev, force);
    if (S.key !== key) return;
    Object.assign(S, { data: r.data, ts: r.ts, stale: !!r.stale, error: r.error || null });
    if (r.stale && force) toast(describeError(r.error).title + ' – zeige gespeicherte Daten');
  } catch (e) {
    if (S.key !== key) return;
    S.error = e;
    if (S.data) S.stale = true;
  } finally {
    if (S.key === key) { S.loading = false; render(); }
  }
}
function loadAll(force = false) {
  const p = load('main', force);
  if (state.tab === 'ski') load('ski', force);
  else p.then(() => load('ski', force && state.tab === 'ski'));
  loadStations(force);
  return p;
}

/* =====================================================================
   Wetterstationen (echte Messwerte) – beide Dienste kostenlos, ohne Key, CORS erlaubt
   · Lawinenwarndienste Tirol · Südtirol · Trentino (avalanche.report): viele Bergstationen,
     u. a. Schneehöhe und Schnee-Oberflächentemperatur
   · GeoSphere Austria (TAWES, 10-Minuten-Werte): offizielle Stationen in ganz Österreich
   ===================================================================== */
const LWD_URL = 'https://static.avalanche.report/weather_stations/stations.geojson';
const GS_API = 'https://dataset.api.hub.geosphere.at/v1/station/current/tawes-v1-10min';
const ST_RADIUS = 30;                   // km Umkreis
const ST_TTL = 10 * 60 * 1000;
const ST_CACHE_KEY = 'aw_st_v1';

function distKm(lat1, lon1, lat2, lon2) {
  const r = Math.PI / 180, dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.min(1, Math.sqrt(x)));
}
/* GeoSphere liefert Namen in GROSSBUCHSTABEN ohne Umlaute („SCHMITTENHOEHE“) → „Schmittenhöhe“ */
function niceName(s) {
  const UML = { AE: 'Ä', OE: 'Ö', UE: 'Ü' };
  return String(s || '')
    .replace(/(^|.)(AE|OE|UE)/g, (m, pre, pair) => (/[AEIOUQ]/.test(pre) || /MICHAEL/.test(s)) ? m : pre + UML[pair])
    .toLowerCase()
    .replace(/(^|[\s/(\-.])(\S)/g, (m, pre, ch) => pre + ch.toUpperCase());
}
const stKey = s => `${s.src}:${s.id}`;
const stCache = { lwd: null, lwdTs: 0, gsMeta: LS.get('aw_gsmeta_v1', null) };

async function loadLwd(force) {
  if (!force && stCache.lwd && Date.now() - stCache.lwdTs < ST_TTL) return stCache.lwd;
  let data;
  try { data = await fetchJSON(LWD_URL, 20000); }
  catch (e) {
    try { data = await fetchJSON(LWD_URL, 20000); }          // zweiter Versuch (Funkloch)
    catch (e2) { if (stCache.lwd) return stCache.lwd; throw e2; }
  }
  const n = v => isNum(v) ? v : null;
  stCache.lwd = (data.features || []).map(f => {
    const p = f.properties || {}, g = (f.geometry && f.geometry.coordinates) || [];
    return {
      src: 'lwd', id: String(f.id || p.name), name: p.name || 'Station', op: p.operator || 'Lawinenwarndienst',
      lat: g[1], lon: g[0], alt: n(g[2]), time: p.date ? Date.parse(p.date) : null,
      t: n(p.LT), rh: n(p.RH), td: n(p.TD), ws: n(p.WG), wg: n(p.WG_BOE), wd: n(p.WR),
      hs: n(p.HS), hs24: n(p.HSD24), hs72: n(p.HSD72), oft: n(p.OFT), n24: n(p.N24), p: n(p.LD),
      link: typeof p.operatorLink === 'string' && /^https:\/\//.test(p.operatorLink) ? p.operatorLink : null
    };
  }).filter(s => isNum(s.lat) && isNum(s.lon));
  stCache.lwdTs = Date.now();
  return stCache.lwd;
}
async function loadGsMeta() {
  const m = stCache.gsMeta;
  if (m && Array.isArray(m.list) && Date.now() - m.ts < 7 * 864e5) return m.list;
  const data = await fetchJSON(`${GS_API}/metadata`, 20000);
  const list = (data.stations || []).filter(s => s.is_active !== false && isNum(s.lat) && isNum(s.lon))
    .map(s => ({ id: String(s.id), name: niceName(s.name), lat: s.lat, lon: s.lon, alt: isNum(s.altitude) ? s.altitude : null }));
  stCache.gsMeta = { ts: Date.now(), list };
  LS.set('aw_gsmeta_v1', stCache.gsMeta);
  return list;
}
async function loadGsCurrent(ids) {
  const url = `${GS_API}?${new URLSearchParams({ parameters: 'TL,RF,TP,FF,FFX,DD,SCHNEE,RR,P', station_ids: ids.join(',') })}`;
  const data = await fetchJSON(url, 15000);
  const ts = (data.timestamps || []).map(t => Date.parse(t));
  const out = new Map();
  (data.features || []).forEach(f => {
    const pr = (f.properties && f.properties.parameters) || {};
    const tl = (pr.TL && pr.TL.data) || [];
    let k = tl.length - 1;
    while (k > 0 && !isNum(tl[k])) k--;          // letzter Zeitpunkt mit Temperatur
    const v = key => { const a = pr[key] && pr[key].data; return a && isNum(a[k]) ? a[k] : null; };
    const kmh = x => isNum(x) ? x * 3.6 : null;  // GeoSphere: m/s
    out.set(String(f.properties.station), { time: ts[k] || null, t: v('TL'), rh: v('RF'), td: v('TP'), ws: kmh(v('FF')), wg: kmh(v('FFX')), wd: v('DD'), hs: v('SCHNEE'), rr: v('RR'), p: v('P') });
  });
  return out;
}

/* Stationen im Umkreis des Ortes, nach Entfernung sortiert (Duplikate beider Dienste entfernt) */
async function nearbyStations(loc, force) {
  const [lwd, gsm] = await Promise.allSettled([loadLwd(force), loadGsMeta()]);
  const withDist = s => ({ ...s, dist: distKm(loc.lat, loc.lon, s.lat, s.lon) });
  let list = lwd.status === 'fulfilled' ? lwd.value.map(withDist).filter(s => s.dist <= ST_RADIUS) : [];
  let gs = gsm.status === 'fulfilled'
    ? gsm.value.map(withDist).filter(s => s.dist <= ST_RADIUS).sort((a, b) => a.dist - b.dist).slice(0, 15).map(s => ({ ...s, src: 'gs', op: 'GeoSphere Austria' }))
    : [];
  let partial = lwd.status === 'rejected' || gsm.status === 'rejected';
  if (gs.length) {
    try { const cur = await loadGsCurrent(gs.map(s => s.id)); gs = gs.map(s => ({ ...s, ...(cur.get(s.id) || {}) })); }
    catch (e) { gs = []; partial = true; }
  }
  gs = gs.filter(g => !list.some(l => distKm(l.lat, l.lon, g.lat, g.lon) < 0.4 && Math.abs((l.alt || 0) - (g.alt || 0)) < 80));
  const maxAge = 12 * 3600 * 1000;
  list = list.concat(gs)
    .filter(s => (isNum(s.t) || isNum(s.hs)) && (!s.time || Date.now() - s.time < maxAge))
    .sort((a, b) => a.dist - b.dist).slice(0, 30);
  if (!list.length && lwd.status === 'rejected' && gsm.status === 'rejected') throw lwd.reason;
  return { list, partial };
}

/* Automatische Wahl: Wetter/Rad = nah & ähnliche Höhe, Ski = Höhe passt am besten */
function pickStation(list, elev, mode) {
  if (!list || !list.length) return null;
  const fresh = list.filter(s => isNum(s.t) && (!s.time || Date.now() - s.time < 3 * 3600 * 1000));
  const pool = fresh.length ? fresh : list;
  const dh = s => isNum(elev) && isNum(s.alt) ? Math.abs(s.alt - elev) / 100 : 0;
  const score = s => mode === 'ski' ? dh(s) + s.dist * 0.35 : s.dist + dh(s) * 1.5;
  return pool.slice().sort((a, b) => score(a) - score(b))[0];
}
function stationFor(loc, mode) {
  const L = state.st.list;
  if (!loc || !L || !L.length) return null;
  const want = mode === 'ski' ? loc.stSki : loc.stMain;
  if (want) { const s = L.find(x => stKey(x) === want); if (s) return { s, auto: false }; }
  const elev = mode === 'ski'
    ? (isNum(state.ski.data && state.ski.data.elevation) ? state.ski.data.elevation : skiElev(loc))
    : (isNum(state.main.data && state.main.data.elevation) ? state.main.data.elevation : mainElev(loc));
  const s = pickStation(L, elev, mode);
  return s ? { s, auto: true } : null;
}
const findStation = key => (state.st.list || []).find(s => stKey(s) === key) || null;

function restoreStCache(key) {
  const c = LS.get(ST_CACHE_KEY, null);
  return c && c.key === key && Array.isArray(c.list) ? c : null;
}
async function loadStations(force = false) {
  const loc = currentLoc();
  if (!loc) return;
  const key = `${(+loc.lat).toFixed(3)},${(+loc.lon).toFixed(3)}`;
  const S = state.st;
  if (S.key !== key) {
    const c = restoreStCache(key);
    Object.assign(S, { key, list: c ? c.list : null, ts: c ? c.ts : 0, error: null });
  }
  if (!force && S.list && Date.now() - S.ts < ST_TTL) return;
  if (S.loadingKey === key) return;
  S.loadingKey = key; S.loading = true;
  try {
    const { list, partial } = await nearbyStations(loc, force);
    if (S.key !== key) return;
    const retrySoon = Date.now() - ST_TTL + 60 * 1000;      // ein Dienst fehlte → in ~1 Min. erneut versuchen
    if (partial && S.list && S.list.length > list.length) {
      S.ts = retrySoon; S.error = null;                      // bisherige (vollständigere) Liste behalten
    } else {
      Object.assign(S, { list, ts: partial ? retrySoon : Date.now(), error: null });
      LS.set(ST_CACHE_KEY, { key, ts: S.ts, list });
    }
  } catch (e) {
    if (S.key === key) S.error = e;
  } finally {
    if (S.loadingKey === key) { S.loadingKey = null; S.loading = false; }
    if (S.key === key) render();
  }
}

/* Aufbereitung: aktueller Stundenindex in Ortszeit */
function prep(data) {
  const h = data.hourly, dl = data.daily;
  const nowStr = new Date(Date.now() + (data.utc_offset_seconds || 0) * 1000).toISOString().slice(0, 16);
  let nowIdx = 0;
  for (let i = 0; i < h.time.length; i++) { if (h.time[i] <= nowStr) nowIdx = i; else break; }
  const today = nowStr.slice(0, 10);
  let todayD = dl.time.indexOf(today);
  if (todayD < 0) { todayD = dl.time.findIndex(t => t >= today); if (todayD < 0) todayD = dl.time.length - 1; }
  return { h, dl, nowIdx, nowStr, today, todayD, n: h.time.length, hour: Number(nowStr.slice(11, 13)) };
}
function currentVals(data, P, ts) {
  const o = {};
  for (const k of Object.keys(P.h)) if (k !== 'time') o[k] = P.h[k][P.nowIdx];
  if (data.current && Date.now() - ts < 90 * 60 * 1000) {
    for (const [k, v] of Object.entries(data.current)) if (isNum(v) && k !== 'interval') o[k] = v;
  }
  return o;
}

function windowStats(h, a, b) {
  const I = range(a, b), g = k => I.map(i => hv(h, k, i));
  const ws = g('wind_speed_10m'), wd = g('wind_direction_10m');
  let x = 0, y = 0;
  ws.forEach((v, j) => { if (isNum(v) && isNum(wd[j])) { const r = wd[j] * Math.PI / 180; x += Math.sin(r) * v; y += Math.cos(r) * v; } });
  const dir = (x || y) ? (Math.atan2(x, y) * 180 / Math.PI + 360) % 360 : avg(wd);

  return {
    a, b, tMin: minOf(t), tMax: maxOf(t), tAvg: avg(t), appMin: minOf(g('apparent_temperature')),

function rateBike(W) {
  const f = [];
  let l = 0;
  if (W.gustMax > 55 || W.windMax > 40) l = 2; else if (W.gustMax > 38 || W.windMax > 25) l = 1;
  f.push({ icon: '💨', name: 'Wind', level: l, text: `Böen bis ${fmt(W.gustMax)} km/h` });

  const storm = W.codes.some(c => c >= 95), ice = W.codes.some(c => [56, 57, 66, 67].includes(c));
  let r = 0;
  if (storm || ice || W.popMax >= 60 || W.precip >= 2) r = 2; else if (W.popMax >= 30 || W.precip >= 0.3) r = 1;
  f.push({ icon: '🌧️', name: 'Regen', level: r, text: storm ? 'Gewittergefahr!' : ice ? 'Gefrierender Regen!' : `Risiko ${fmt(W.popMax)} %` });

  let t = 0;
  if (W.tMin < 2 || W.tMax > 36) t = 2; else if (W.tMin < 7 || W.tMax > 31) t = 1;
  f.push({ icon: '🌡️', name: 'Temperatur', level: t, text: W.tMin < 2 ? `${fmt(W.tMin, ' °C')} – Glätte!` : W.tMax > 31 ? `${fmt(W.tMax, ' °C')} – Hitze` : `${fmt(W.tMin)} bis ${fmt(W.tMax, ' °C')}` });

  const level = Math.max(l, r, t);
  const worst = f.filter(x => x.level === level && level > 0).map(x => x.name);
  const summary = level === 0 ? 'Wenig Wind, trocken und angenehme Temperaturen.' : `${level === 2 ? 'Kritisch' : 'Achtung'}: ${worst.join(' & ')}`;
  return { level, factors: f, summary };
}

/* Fahrt-Windchill: JAG/TI-Formel (≤ 10 °C), darüber lineare Näherung */
function rideChill(T, v) {
  if (!isNum(T)) return null;
  if (T <= 10 && v >= 4.8) { const p = Math.pow(v, 0.16); return 13.12 + 0.6215 * T - 11.37 * p + 0.3965 * T * p; }
  return T - 0.11 * v;
}

function clothing(W) {
  const vEff = 25 + 0.5 * (W.windAvg || 0);        // ~25 km/h Fahrtwind + halber Umgebungswind
  const eff = rideChill(W.tMin, vEff), effMax = rideChill(W.tMax, vEff);
  const items = [];
  let head;

function skiDayStats(P, date, fromIdx) {

      ${[[-16, 'PS5'], [-9.5, 'PS6'], [-5, 'PS7'], [-0.5, 'PS8'], [5, 'PS10']].map(([t, l]) => tick(t, l)).join('')}
    </div>
  </div>`;
}
function structIcon(lvl) {
  const gap = lvl === 1 ? 4 : lvl === 2 ? 7 : 11, sw = lvl === 1 ? 1.2 : lvl === 2 ? 2 : 3.2;
  let lines = range(0, Math.ceil(64 / gap)).map(k => `<line x1="${2 + k * gap}" y1="3" x2="${2 + k * gap}" y2="37" stroke-width="${sw}"/>`).join('');
  if (lvl === 3) lines += range(0, 8).map(k => `<line x1="${k * 12 - 20}" y1="37" x2="${k * 12 + 4}" y2="3" stroke-width="2"/>`).join('');
  return `<svg viewBox="0 0 60 40" class="w-16 h-11 shrink-0 rounded-xl bg-slate-200 dark:bg-slate-700 stroke-slate-800 dark:stroke-slate-100" aria-hidden="true"><clipPath id="sc${lvl}"><rect width="60" height="40" rx="6"/></clipPath><g clip-path="url(#sc${lvl})">${lines}</g></svg>`;
}

function skiToggle(loc) {
  const t = talElev(loc), bE = bergElev(loc), m = state.skiMode;
  const btn = (v, icon, name, sub) => `<button data-act="skimode" data-v="${v}" aria-pressed="${m === v}" class="py-2.5 rounded-xl font-black text-lg leading-tight transition ${m === v ? 'bg-white dark:bg-slate-950 shadow text-slate-900 dark:text-white ring-2 ring-indigo-600' : 'text-slate-600 dark:text-slate-300'}">${icon} ${name}<span class="block text-xs font-extrabold opacity-90">${sub}</span></button>`;
  return `<section class="${CARD} p-2">
    <div class="grid grid-cols-2 gap-1 p-1 rounded-2xl bg-slate-100 dark:bg-slate-800">
      ${btn('tal', '🏘️', 'Tal', isNum(t) ? `${fmt(t)} m` : 'Geländehöhe')}
      ${btn('berg', '🏔️', 'Berg', `${fmt(bE)} m`)}
    </div>
    ${m === 'berg' ? `<div class="flex items-center gap-2 px-2 pt-2.5 pb-1">
      <span class="${LABEL} flex-1">Höhe Gipfellage</span>
      <button data-act="berg-step" data-v="-100" class="w-11 h-11 rounded-xl bg-slate-200 dark:bg-slate-800 font-black text-xl active:scale-95" aria-label="100 m tiefer">−</button>
      <button data-act="berg-edit" class="min-w-[5.5rem] h-11 rounded-xl border-2 border-slate-300 dark:border-slate-700 font-black text-lg tabular active:scale-95" aria-label="Höhe eingeben">${fmt(bE)} m</button>
      <button data-act="berg-step" data-v="100" class="w-11 h-11 rounded-xl bg-slate-200 dark:bg-slate-800 font-black text-xl active:scale-95" aria-label="100 m höher">+</button>
    </div>` : ''}
  </section>`;
}

function renderSki() {
  const loc = currentLoc();
  const S = state.ski;
  const toggle = skiToggle(loc);
  lastWax = null;
  if (!S.data) return toggle + (S.error ? errorCard(S.error) : skeleton('Lade Bergwetter …'));
  const d = S.data, P = prep(d), h = P.h, i0 = P.nowIdx, n = P.n;
  const c = currentVals(d, P, S.ts);
  const elevUsed = isNum(d.elevation) ? d.elevation : skiElev(loc);

  /* --- Jetzt-Werte --- */
  const snowPast = sum(range(Math.max(0, i0 - 23), i0 + 1).map(i => hv(h, 'snowfall', i)));
  const snowNext = sum(range(i0 + 1, Math.min(n, i0 + 25)).map(i => hv(h, 'snowfall', i)));
  const fzl = hv(h, 'freezing_level_height', i0);
  const fz24 = range(i0, Math.min(n, i0 + 24)).map(i => hv(h, 'freezing_level_height', i));
  const fzMin = minOf(fz24), fzMax = maxOf(fz24);
  let fzTxt = 'keine Daten';
  if (isNum(fzl)) {
    const diff = fzl - elevUsed;
    fzTxt = fzl < 150 ? 'Frost bis in die Täler'
      : diff > 300 ? `<b class="text-red-600 dark:text-red-400">${fmt(diff)} m über dir</b> – Tauwetter auf deiner Höhe`
      : diff >= -300 ? '<b class="text-amber-600 dark:text-amber-400">nahe deiner Höhe</b> – Schnee um 0 °C'
      : `<b class="text-emerald-700 dark:text-emerald-400">${fmt(-diff)} m unter dir</b> – Schnee bleibt kalt`;
  }
  const cloud = c.cloud_cover, low = hv(h, 'cloud_cover_low', i0), vis = hv(h, 'visibility', i0);
  let sight;
  if (c.weather_code === 45 || c.weather_code === 48 || (isNum(vis) && vis < 1000)) sight = { lvl: 2, icon: '🌫️', text: 'Nebel – Whiteout-Gefahr' };
  else if ((hv(h, 'snowfall', i0) || 0) >= 0.5 || (isNum(vis) && vis < 4000)) sight = { lvl: 2, icon: '🌨️', text: 'Schneefall – schlechte Sicht' };
  else if (isNum(cloud) && cloud >= 85) sight = { lvl: 1, icon: '☁️', text: 'Diffuses Licht (Flat Light)' };
  else if (isNum(cloud) && cloud >= 50) sight = { lvl: 1, icon: '⛅', text: 'Wechselnd bewölkt' };
  else sight = { lvl: 0, icon: '😎', text: 'Gute Sicht' };
  const sightCls = ['text-emerald-700 dark:text-emerald-400', 'text-amber-600 dark:text-amber-400', 'text-red-600 dark:text-red-400'][sight.lvl];
  const visTxt = isNum(vis) ? (vis >= 20000 ? '> 20 km' : vis >= 1000 ? fmt(vis / 1000, ' km', vis < 10000 ? 1 : 0) : fmt(vis, ' m')) : '–';
  const hochnebel = state.skiMode === 'tal' && isNum(low) && low >= 70 ? '<div class="mt-1 text-sm font-bold text-sky-700 dark:text-sky-300">Tiefe Wolken – oben oft Sonne über dem Nebel!</div>' : '';

  const gust = c.wind_gusts_10m, w700 = hv(h, 'wind_speed_700hPa', i0), d700 = hv(h, 'wind_direction_700hPa', i0);
  const lift = !isNum(gust) ? null
    : gust >= 80 ? { cls: 'bg-red-600 text-white', t: '🚫 Sturm – Liftsperren wahrscheinlich' }
    : gust >= 60 ? { cls: 'bg-red-600 text-white', t: '⚠️ Exponierte Lifte evtl. geschlossen' }
    : gust >= 40 ? { cls: 'bg-amber-400 text-slate-950', t: '🌬️ Windig – Windchill beachten' }
    : { cls: 'bg-emerald-600 text-white', t: '✅ Ruhige Verhältnisse' };
  const depth = hv(h, 'snow_depth', i0);

  /* --- Skitags-Planer --- */
  const dates = range(0, 5).map(k => addDays(P.today, k));
  const stats = dates.map((dt, k) => skiDayStats(P, dt, k === 0 ? i0 : null));
  let sel = state.skiDay != null ? state.skiDay : (P.hour >= 16 ? 1 : 0);
  if (!stats[sel]) sel = Math.max(0, stats.findIndex(Boolean));
  const SD = stats[sel];
  const days = stats.map((s, k) => {
    if (!s) return '';
    const di = P.dl.time.indexOf(s.date), ww = wmo(hv(P.dl, 'weather_code', di), 1), sc = skiScore(s), on = k === sel;
    return `<button data-act="skiday" data-v="${k}" aria-pressed="${on}" class="snap-start shrink-0 w-[5.6rem] rounded-2xl p-2.5 text-center border-2 transition ${on ? 'border-indigo-600 bg-indigo-50 dark:bg-indigo-950/60 shadow-md' : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900'}">
      <div class="text-sm font-extrabold">${dayLabel(s.date, P.today)}</div>
      <div class="text-3xl my-1 leading-none">${ww.icon}</div>
      <div class="text-amber-500 text-sm leading-none tracking-tighter" aria-label="${sc} von 5">${'★'.repeat(sc)}<span class="text-slate-300 dark:text-slate-700">${'★'.repeat(5 - sc)}</span></div>
      <div class="text-sm font-black tabular mt-1">${fmt(s.tMin)}/${fmtT(s.tMax)}</div>
      <div class="text-xs font-extrabold text-sky-700 dark:text-sky-300 tabular">${s.snowNew >= 0.5 ? `❄️ ${fmt(s.snowNew)} cm` : '❄️ 0 cm'}</div>
    </button>`;
  }).join('');

  /* --- Skiwachs-Berater --- */
  let waxHtml = '';
  if (SD) {
    const det = detectSnow(P, SD.a, SD.b);
    const st = state.snowType === 'auto' ? det.type : state.snowType;
    const A = waxAdvice(SD, st);
    /* Echte Messung der gewählten Station (nur für heute sinnvoll) */
    let measHtml = '', meas = null;
    const stc = stationFor(loc, 'ski');
    if (sel === 0 && stc && isNum(stc.s.t)) {
      const s = stc.s;
      let hint = '';
      if (isNum(s.alt) && Math.abs(s.alt - elevUsed) <= 400 && isNum(c.temperature_2m)) {
        const diff = s.t + (s.alt - elevUsed) * 0.0065 - c.temperature_2m;   // auf gleiche Höhe umgerechnet (−0,65 °C/100 m)
        if (diff >= 2 && A.idx < 4) hint = ` Gemessen ist es <b>${fmt(diff)} °C wärmer</b> als vorhergesagt – im Zweifel eine Stufe wärmer: <b>${waxName(WAX[A.idx + 1])}</b>.`;
        else if (diff <= -2 && A.idx > 0) hint = ` Gemessen ist es <b>${fmt(-diff)} °C kälter</b> als vorhergesagt – im Zweifel eine Stufe kälter: <b>${waxName(WAX[A.idx - 1])}</b>.`;
        else hint = ' Messung und Vorhersage passen gut zusammen.';
      }
      meas = { s, hint };
      measHtml = `<button data-info="station" data-sid="${esc(stKey(s))}" data-mode="ski" class="block w-full text-left rounded-2xl border-2 border-emerald-300 dark:border-emerald-800 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-950 dark:text-emerald-50 p-3.5 active:scale-[.99] transition">
        <div class="flex items-center gap-1 font-black">📡 Gemessen: ${esc(s.name)} · ${fmt(s.alt)} m${CHEVRON}</div>
        <div class="text-sm font-semibold mt-1 leading-snug">Luft <b>${fmt(s.t, ' °C', 1)}</b>${isNum(s.oft) ? ` · Schnee-Oberfläche <b>${fmt(s.oft, ' °C', 1)}</b>` : ''}${isNum(s.hs) ? ` · Schnee <b>${fmt(s.hs, ' cm')}</b>` : ''} (${ago(s.time)}).${hint}</div>
      </button>`;
    }
    lastWax = { A, SD, st, det, elevUsed, meas, day: dayLabel(SD.date, P.today, true) };
    const typeBtns = SNOW_TYPES.map(([v, l]) => `<button data-act="snowtype" data-v="${v}" aria-pressed="${state.snowType === v}" class="shrink-0 px-3.5 py-2 rounded-xl font-extrabold text-sm border-2 ${state.snowType === v ? 'bg-slate-900 text-white border-slate-900 dark:bg-white dark:text-slate-900 dark:border-white' : 'border-slate-300 dark:border-slate-700'}">${l}</button>`).join('');
    waxHtml = `
    ${sectionTitle('Skiwachs-Berater · Swix')}
    <section class="rounded-3xl overflow-hidden border border-slate-200 dark:border-slate-800 shadow-sm">
      <button data-info="wax" class="block w-full text-left ${A.cat.card} p-5 active:opacity-90" aria-label="Wachs-Details anzeigen">
        <div class="text-xs font-extrabold uppercase tracking-widest opacity-90">Empfehlung · ${dayLabel(SD.date, P.today, true)} · ${fmt(elevUsed)} m</div>
        <div class="flex items-center justify-between gap-3 mt-1">
          <div>
            <div class="text-sm font-extrabold opacity-90">Swix Performance Speed</div>
            <div class="text-5xl font-black leading-none">PS${A.cat.code}</div>
            <div class="text-xl font-extrabold mt-1">${A.cat.color} · ${A.cat.range}</div>
          </div>
          <div class="text-6xl" aria-hidden="true">🎿</div>
        </div>
        <p class="mt-2 font-bold">${A.cat.desc}</p>
        <div class="mt-3 flex flex-wrap gap-1.5 text-xs font-extrabold">
          <span class="px-2 py-1 rounded-lg bg-black/20">Schneller: HS${A.cat.code}</span>
          <span class="px-2 py-1 rounded-lg bg-black/20">Rennen: TS${A.cat.code}</span>
          <span class="px-2 py-1 rounded-lg bg-black/20">Unterwegs: F4</span>
          <span class="px-2 py-1 rounded-lg bg-white/90 text-slate-900">Details ›</span>
        </div>
      </button>
      <div class="p-4 space-y-4 bg-white dark:bg-slate-900">
        ${measHtml}
        <button data-info="waxchart" class="block w-full text-left" aria-label="Swix-Farbtabelle anzeigen">${waxScale(SD.tMin, SD.tMax, A.tRef)}</button>
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="rounded-2xl bg-slate-100 dark:bg-slate-800 p-2.5"><div class="text-[11px] font-extrabold uppercase text-slate-600 dark:text-slate-300">${sel === 0 ? 'Aktuell' : 'Ø Skitag'}</div><div class="text-xl font-black tabular">${fmt(sel === 0 ? c.temperature_2m : SD.tAvg, ' °C')}</div></div>
          <div class="rounded-2xl bg-slate-100 dark:bg-slate-800 p-2.5"><div class="text-[11px] font-extrabold uppercase text-slate-600 dark:text-slate-300">${sel === 0 && SD.a > P.h.time.indexOf(`${SD.date}T09:00`) ? 'Bis 16 Uhr' : '9–16 Uhr'}</div><div class="text-xl font-black tabular whitespace-nowrap">${fmt(SD.tMin)}/${fmt(SD.tMax, '°')}</div></div>
          <div class="rounded-2xl bg-slate-100 dark:bg-slate-800 p-2.5"><div class="text-[11px] font-extrabold uppercase text-slate-600 dark:text-slate-300">Wachs-Ref.</div><div class="text-xl font-black tabular">${fmt(A.tRef, ' °C')}</div></div>
        </div>

        <div>
          <div class="${LABEL} mb-2">Schneebeschaffenheit</div>
          <div class="flex flex-wrap gap-2">${typeBtns}</div>
          <div class="${SUB} mt-2">${state.snowType === 'auto' ? `Automatisch erkannt: <b>${SNOW_NAMES[det.type]}</b> (${det.why})` : `Manuell gewählt: <b>${SNOW_NAMES[st]}</b> · Auto hätte „${SNOW_NAMES[det.type]}“ erkannt`}</div>
        </div>

        ${A.mix ? `<div class="rounded-2xl border-2 border-indigo-300 dark:border-indigo-700 bg-indigo-50 dark:bg-indigo-950/50 p-3.5"><div class="font-black">🔀 Wachs-Mix empfohlen</div><div class="text-sm font-semibold mt-1 leading-snug">${A.mix}</div></div>` : ''}

        <div class="rounded-2xl border-2 p-3.5 ${A.hum.cls}">
          <div class="font-black">${A.hum.icon} ${A.hum.title}</div>
          <div class="text-sm font-semibold mt-1 leading-snug">${A.hum.text}</div>
        </div>

        <div class="flex gap-3 items-start rounded-2xl bg-slate-100 dark:bg-slate-800 p-3.5">
          ${structIcon(A.struct.lvl)}
          <div><div class="font-black">Struktur: ${A.struct.name}</div><div class="text-sm font-semibold mt-1 leading-snug">${A.struct.text}</div></div>
        </div>

        <ul class="space-y-2">
          ${A.notes.map(([ic, t]) => `<li class="flex gap-3 items-start text-sm font-semibold leading-snug"><span class="text-lg leading-5">${ic}</span><span>${t}</span></li>`).join('')}
          <li class="flex gap-3 items-start text-sm font-semibold leading-snug"><span class="text-lg leading-5">♨️</span><span>Bügeleisen ca. <b>${A.cat.iron}</b> (Herstellerangabe beachten, Wachs darf nicht rauchen). 20–30 Min. abkühlen lassen, abziehen, bürsten: Messing → Nylon → Rosshaar.</span></li>
        </ul>
      </div>
    </section>`;
  }

  return `${staleBanner(S)}${toggle}
  ${sectionTitle(`Jetzt auf ${fmt(elevUsed)} m`)}
  <div class="grid grid-cols-2 gap-3 fade-in">
    <div class="col-span-2">${stationCard(loc, 'ski', c.temperature_2m, elevUsed)}</div>
    ${tile({ icon: '🌡️', label: 'Temperatur', value: fmt(c.temperature_2m, ' °C'), sub: `Gefühlt ${fmt(c.apparent_temperature, ' °C')} · ${fmt(c.relative_humidity_2m, ' %')} rF`, info: 'now', data: 'data-slot="ski"' })}
    ${tile({ icon: '❄️', label: 'Neuschnee', value: `${fmt(snowPast, '', snowPast > 0 && snowPast < 10 ? 1 : 0)}<span class="text-base"> cm</span>`, sub: `letzte 24 h · <b>+${fmt(snowNext, ' cm', snowNext > 0 && snowNext < 10 ? 1 : 0)}</b> nächste 24 h${isNum(depth) ? ` · Schneehöhe ${fmt(depth * 100, ' cm')}` : ''}`, accent: snowPast >= 10 ? 'text-sky-600 dark:text-sky-400' : '', info: 'snow' })}
    <button data-info="fzl" class="block w-full text-left ${CARD} p-3.5 col-span-2 active:scale-[.99] transition">
      <div class="flex items-center ${LABEL}">🧊 Nullgradgrenze${CHEVRON}</div>
      <div class="flex items-baseline gap-3 mt-1.5">
        <div class="text-[30px] leading-none font-black tabular">${fmt(fzl, ' m')}</div>
        <div class="text-sm font-bold text-slate-600 dark:text-slate-300 tabular">24 h: ${fmt(fzMin)}–${fmt(fzMax, ' m')}</div>
      </div>
      <div class="${SUB} mt-1.5">${fzTxt}</div>
    </button>
    <button data-info="clouds" data-slot="ski" class="block w-full text-left ${CARD} p-3.5 col-span-2 active:scale-[.99] transition">
      <div class="flex items-center ${LABEL}">👁️ Bewölkung & Sicht${CHEVRON}</div>
      <div class="flex items-center gap-3 mt-1.5">
        <div class="text-4xl">${sight.icon}</div>
        <div class="min-w-0">
          <div class="text-xl font-black ${sightCls}">${sight.text}</div>
          <div class="${SUB}">Wolken ${fmt(cloud, ' %')} · tief ${fmt(low, ' %')} · Sicht ${visTxt}</div>
          ${hochnebel}
        </div>
      </div>
    </button>
    <button data-info="wind" data-slot="ski" class="block w-full text-left ${CARD} p-3.5 col-span-2 active:scale-[.99] transition">
      <div class="flex items-center ${LABEL}">🌬️ Wind in Gipfellage${CHEVRON}</div>
      <div class="flex items-center gap-4 mt-1.5">
        ${compass(c.wind_direction_10m, 96)}
        <div class="min-w-0 flex-1">
          <div class="text-[28px] leading-none font-black tabular">${fmt(c.wind_speed_10m)}<span class="text-base"> km/h</span></div>
          <div class="${SUB} mt-1">Böen <b>${fmt(gust)} km/h</b> · aus ${dirName(c.wind_direction_10m)}</div>
          ${isNum(w700) ? `<div class="${SUB}">Höhenwind ~3000 m: <b>${fmt(w700)} km/h</b> aus ${dirName(d700)}</div>` : ''}
        </div>
      </div>
      ${lift ? `<div class="mt-3 rounded-xl px-3 py-2 font-extrabold text-sm ${lift.cls}">${lift.t}</div>` : ''}
    </button>
  </div>

  ${sectionTitle('Skitags-Planer', `<span class="text-xs font-bold text-slate-500 dark:text-slate-400">9–16 Uhr</span>`)}
  <div data-scroll="skidays" class="no-scrollbar flex gap-2 overflow-x-auto snap-x -mx-4 px-4 pb-1">${days}</div>
  ${SD ? (() => {
    const sc = skiScore(SD);
    return `<section class="${CARD} p-4">
      <div class="flex items-center justify-between">
        <div><div class="${LABEL}">${dayLabel(SD.date, P.today, true)}</div><div class="text-2xl font-black">${SCORE_TXT[sc]} ${SD.snowNew >= 15 && (SD.cloudAvg ?? 100) < 60 ? '· Powder! 🤩' : ''}</div></div>
        <div class="text-amber-500 text-2xl tracking-tighter">${'★'.repeat(sc)}<span class="text-slate-300 dark:text-slate-700">${'★'.repeat(5 - sc)}</span></div>
      </div>
      <div class="grid grid-cols-2 gap-2 mt-3 text-sm font-bold">
        <div class="rounded-xl bg-slate-100 dark:bg-slate-800 px-3 py-2">☁️ Wolken Ø <b class="tabular">${fmt(SD.cloudAvg, ' %')}</b></div>
        <div class="rounded-xl bg-slate-100 dark:bg-slate-800 px-3 py-2">🌬️ Böen bis <b class="tabular">${fmt(SD.gustMax, ' km/h')}</b></div>
        <div class="rounded-xl bg-slate-100 dark:bg-slate-800 px-3 py-2">❄️ Neuschnee <b class="tabular">${fmt(SD.snowNew, ' cm')}</b></div>
        <div class="rounded-xl bg-slate-100 dark:bg-slate-800 px-3 py-2">🧊 0°-Grenze Ø <b class="tabular">${fmt(SD.fzlAvg, ' m')}</b></div>
      </div>
    </section>`;
  })() : ''}
  ${waxHtml}
  ${footer(S)}`;
}

/* =====================================================================
   Messstation-Karte (Wetter- und Ski-Tab)
   ===================================================================== */
const SRC_NAME = { lwd: 'Lawinenwarndienst', gs: 'GeoSphere Austria' };
function ago(ts) {
  if (!ts) return 'Zeit unbekannt';
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'gerade eben';
  if (m < 60) return `vor ${m} Min.`;
  if (m < 36 * 60) return `vor ${Math.round(m / 60)} Std.`;
  return dateTime(ts);
}
const signed = (v, unit = '', dec = 0) => isNum(v) ? (v > 0 ? '+' : '') + fmt(v, unit, dec) : '–';

function stationCard(loc, mode, fcT, fcElev) {
  const S = state.st;
  const head = right => `<div class="flex items-center justify-between gap-2"><div class="${LABEL}">📡 Messstation · live</div>${right || ''}</div>`;
  const ch = stationFor(loc, mode);
  if (!ch) {
    if (!S.list && !S.error) return `<section class="${CARD} p-4">${head()}<div class="h-14 mt-2 rounded-2xl shimmer"></div></section>`;
    return `<section class="${CARD} p-4">${head(S.error ? `<button data-act="st-retry" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm font-extrabold active:scale-95">Neu laden</button>` : '')}
      <p class="${SUB} mt-2">${S.error ? 'Die Stationsdaten sind gerade nicht erreichbar.' : `Keine Messstation im Umkreis von ${ST_RADIUS} km (Messnetze: Tirol, Südtirol, Trentino und ganz Österreich).`}</p></section>`;
  }
  const s = ch.s;
  const chips = [
    (isNum(s.ws) || isNum(s.wg)) ? ['🌬️', 'Wind', `${fmt(s.ws)}${isNum(s.wg) ? `<span class="text-xs">/${fmt(s.wg)}</span>` : ''}`, 'km/h'] : null,
    isNum(s.hs) ? ['❄️', 'Schnee', fmt(s.hs), `cm${isNum(s.hs24) && Math.abs(s.hs24) >= 1 ? ` (${signed(s.hs24)})` : ''}`] : null,
    isNum(s.oft) ? ['🧊', 'Oberfläche', fmt(s.oft, '°', 1), 'Schnee'] : (isNum(s.rh) ? ['💧', 'Feuchte', fmt(s.rh), '%'] : null)
  ].filter(Boolean);
  let cmp = '';
  if (isNum(s.t) && isNum(fcT)) {
    const near = isNum(s.alt) && isNum(fcElev) && Math.abs(s.alt - fcElev) <= 250;
    const diff = near ? s.t - fcT : null;
    cmp = `<div class="mt-3 text-sm font-semibold text-slate-600 dark:text-slate-300 leading-snug">Vorhersage für ${fmt(fcElev)} m: <b class="tabular">${fmt(fcT, ' °C', 1)}</b>${isNum(diff) && Math.abs(diff) >= 1.5 ? ` · Station <b>${fmt(Math.abs(diff), ' °C', 1)} ${diff > 0 ? 'wärmer' : 'kälter'}</b>` : ''}</div>`;
  }
  return `<section class="${CARD} p-4 fade-in">
    ${head(`<button data-info="stations" data-mode="${mode}" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm font-extrabold active:scale-95">Station wählen</button>`)}
    <button data-info="station" data-sid="${esc(stKey(s))}" data-mode="${mode}" class="w-full text-left mt-2 flex items-center gap-3 active:opacity-80" aria-label="Details zur Station ${esc(s.name)}">
      <div class="text-[40px] leading-none font-black tabular shrink-0">${fmtT(s.t)}</div>
      <div class="min-w-0 flex-1">
        <div class="font-extrabold truncate">${esc(s.name)}</div>
        <div class="${SUB} truncate">${fmt(s.alt)} m · ${fmt(s.dist, ' km', s.dist < 10 ? 1 : 0)} entfernt · ${ago(s.time)}</div>
        <div class="text-xs font-bold text-slate-500 dark:text-slate-400 truncate">${ch.auto ? 'automatisch gewählt' : '★ von dir gewählt'} · ${SRC_NAME[s.src]}</div>
      </div>
      <span class="text-2xl text-slate-400 dark:text-slate-500" aria-hidden="true">›</span>
    </button>
    ${chips.length ? `<div class="grid grid-cols-3 gap-2 mt-3">${chips.map(([ic, l, v, u]) => `<div class="rounded-2xl bg-slate-100 dark:bg-slate-800 px-2 py-2 text-center">
      <div class="text-[11px] font-extrabold uppercase text-slate-600 dark:text-slate-300">${ic} ${l}</div>
      <div class="text-lg font-black tabular leading-tight">${v}</div>
      <div class="text-[11px] font-bold text-slate-500 dark:text-slate-400">${u}</div></div>`).join('')}</div>` : ''}
    ${cmp}
  </section>`;
}

const note = (icon, html) => `<div class="flex gap-3 items-start rounded-2xl bg-slate-100 dark:bg-slate-800 p-3.5"><span class="text-xl leading-6 shrink-0">${icon}</span><div class="text-sm font-semibold leading-snug">${html}</div></div>`;

const chartCard = (svg, caption = '') => svg ? `<div class="${CARD} p-3">${svg}${caption ? `<p class="text-xs font-semibold text-slate-500 dark:text-slate-400 mt-1">${caption}</p>` : ''}</div>` : '';
function navBtns(prev, next) {
  const b = (x, txt) => x ? `<button ${x.attrs} class="py-3 rounded-2xl bg-slate-200 dark:bg-slate-800 font-extrabold active:scale-95">${txt}</button>` : '<span></span>';
  return `<div class="grid grid-cols-2 gap-2 pt-1">${b(prev, prev ? `‹ ${prev.label}` : '')}${b(next, next ? `${next.label} ›` : '')}</div>`;
}

/* Kleines Liniendiagramm (SVG) mit optionalen Balken (z. B. Niederschlag) */
function lineChart(labels, vals, { cls = 'stroke-orange-500', unit = '°', dec = 0, bars = null, barCls = 'fill-sky-500' } = {}) {
  const n = vals.length, v = nums(vals);
  if (n < 2 || v.length < 2) return '';
  const W = 320, H = 136, L = 16, R = 16, T = 20, B = 24;
  const vMax = Math.max(...v), vMin = Math.min(...v);
  let lo = vMin, hi = vMax;
  if (hi - lo < 1) { hi += 0.5; lo -= 0.5; }
  const x = i => L + i * (W - L - R) / (n - 1), y = t => T + (hi - t) / (hi - lo) * (H - T - B);
  const segs = []; let cur = [];
  vals.forEach((t, i) => { if (isNum(t)) cur.push(`${x(i).toFixed(1)},${y(t).toFixed(1)}`); else if (cur.length) { segs.push(cur); cur = []; } });
  if (cur.length) segs.push(cur);
  let barSvg = '';
  if (bars) {
    const bm = Math.max(0.5, ...nums(bars)), bw = Math.max(2, (W - L - R) / n - 2);
    barSvg = bars.map((b, i) => isNum(b) && b > 0 ? `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${(H - B - b / bm * 36).toFixed(1)}" width="${bw.toFixed(1)}" height="${(b / bm * 36).toFixed(1)}" rx="1.5" class="${barCls}" opacity=".6"/>` : '').join('');
  }
  const step = Math.max(1, Math.ceil(n / 8));
  const lab = labels.map((l, i) => i % step === 0 ? `<text x="${x(i).toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="10" font-weight="700" class="fill-slate-500 dark:fill-slate-400">${esc(l)}</text>` : '').join('');
  const iHi = vals.indexOf(vMax), iLo = vals.indexOf(vMin);
  const mark = (i, above) => `<text x="${clamp(x(i), 18, W - 18).toFixed(1)}" y="${(y(vals[i]) + (above || y(vals[i]) + 15 > H - B - 2 ? -7 : 15)).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="900" class="fill-slate-800 dark:fill-slate-100">${fmt(vals[i], unit, dec)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="Verlauf">
    ${barSvg}${segs.map(sg => `<polyline points="${sg.join(' ')}" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="${cls}"/>`).join('')}
    ${mark(iHi, true)}${iLo !== iHi ? mark(iLo, false) : ''}${lab}</svg>`;
}

const slotOf = p => (p.slot === 'ski' ? state.ski : state.main);
const hourRange = (P, a, b) => range(Math.max(0, a), Math.min(P.n, b));
const hh = t => t.slice(11, 13);

function beaufort(v) {
  if (!isNum(v)) return '–';
  const B = [[2, 'Windstille'], [6, 'leiser Zug'], [12, 'leichte Brise'], [20, 'schwache Brise'], [29, 'mäßige Brise'], [39, 'frische Brise'], [50, 'starker Wind'], [62, 'steifer Wind'], [75, 'stürmischer Wind'], [89, 'Sturm'], [103, 'schwerer Sturm'], [118, 'orkanartiger Sturm']];
  for (let i = 0; i < B.length; i++) if (v < B[i][0]) return `Bft ${i} · ${B[i][1]}`;
  return 'Bft 12 · Orkan';
}

const INFO = {

      ${rowsCard([

        ['💦 Taupunkt', fmt(c.dew_point_2m, ' °C')],

        ['☁️ Bewölkung', fmt(c.cloud_cover, ' %')],
        ['🌬️ Wind', `${fmt(c.wind_speed_10m)} km/h aus ${dirName(c.wind_direction_10m)}`],
        ['💨 Böen', fmt(c.wind_gusts_10m, ' km/h')],
        ['😎 UV-Index', fmt(hv(h, 'uv_index', i0), '', 1)],

        isNum(fzl) ? ['🧊 Nullgradgrenze', fmt(fzl, ' m')] : null
      ])}
      ${h3('Nächste 12 Stunden')}
      ${chartCard(lineChart(I.map(i => hh(h.time[i])), I.map(i => hv(h, 'temperature_2m', i)), { bars: I.map(i => hv(h, 'precipitation', i)) }), 'Linie = Temperatur, Balken = Niederschlag')}`
    };

      title: `${dayLabel(t.slice(0, 10), P.today, true)} · ${t.slice(11, 16)} Uhr`, sub: esc(currentLoc().name),

        <div><div class="text-5xl font-black tabular leading-none">${fmtT(g('temperature_2m'))}</div><div class="font-extrabold text-lg mt-1">${esc(w.text)}</div>
        <div class="${SUB}">Gefühlt ${fmt(g('apparent_temperature'), ' °C')}</div></div></div>

  },
  day(p) {

    let di = dl.time.indexOf(p.d); if (di < 0) di = P.todayD;
    const d = dl.time[di], g = k => hv(dl, k, di), w = wmo(g('weather_code'), 1);
    const I = range(0, P.n).filter(i => h.time[i].startsWith(d));

        <span class="w-20 text-sm font-bold tabular text-right text-slate-600 dark:text-slate-300">💨${fmt(hv(h, 'wind_speed_10m', i))}/${fmt(hv(h, 'wind_gusts_10m', i))}</span></button>`;
    }).join('');
    return {

        ['🌡️ Tiefst / Höchst', `${fmt(g('temperature_2m_min'), '°')} / ${fmt(g('temperature_2m_max'), '°')}`],
        ['☔ Regenrisiko max', fmt(g('precipitation_probability_max'), ' %')],
        ['🌧️ Niederschlag', fmt(g('precipitation_sum'), ' mm', 1)],
        isNum(g('snowfall_sum')) && g('snowfall_sum') > 0 ? ['❄️ Neuschnee', fmt(g('snowfall_sum'), ' cm', 1)] : null,
        ['🌬️ Wind max / Böen', `${fmt(g('wind_speed_10m_max'))} / ${fmt(g('wind_gusts_10m_max'), ' km/h')}`],
        ['😎 UV-Index max', fmt(g('uv_index_max'), '', 1)],
        ['🌅 Sonne', sr && ss ? `${sr.slice(11, 16)} – ${ss.slice(11, 16)}` : '–'],
        isNum(len) ? ['⏱️ Tageslänge', `${Math.floor(len / 60)} h ${pad(len % 60)} min`] : null
      ])}
      ${h3('Temperatur & Niederschlag')}
      ${chartCard(lineChart(I.map(i => hh(h.time[i])), I.map(i => hv(h, 'temperature_2m', i)), { bars: I.map(i => hv(h, 'precipitation', i)) }), 'Linie = Temperatur, Balken = Niederschlag')}
      ${h3('Stunde für Stunde')}
      <div class="${CARD} px-3 py-1">${rows}</div>
      ${navBtns(link(di - 1), link(di + 1))}`
    };
  },
  precip(p) {
    const S = state.main; if (!S.data) return null;
    const P = prep(S.data), h = P.h, I = hourRange(P, P.nowIdx, P.nowIdx + 24);
    const pops = I.map(i => hv(h, 'precipitation_probability', i)), mm = I.map(i => hv(h, 'precipitation', i));
    const first = I.find(i => (hv(h, 'precipitation', i) || 0) >= 0.2);
    return {
      title: '☔ Niederschlag', sub: `${esc(currentLoc().name)} · nächste 24 Stunden`,
      body: `${rowsCard([
        ['Summe 24 h', fmt(sum(mm), ' mm', 1)],
        ['Höchstes Regenrisiko', fmt(maxOf(pops), ' %')],

      ${chartCard(lineChart(I.map(i => hh(h.time[i])), pops, { cls: 'stroke-sky-500', unit: '%', bars: mm }), 'Linie = Regenrisiko in %, Balken = Menge in mm')}
      ${note('💡', '<b>Regenrisiko</b> = Wahrscheinlichkeit, dass es in dieser Stunde mindestens 0,1 mm regnet. 40 % heißt nicht „40 % der Zeit“, sondern: an 4 von 10 vergleichbaren Tagen regnet es.')}`
    };
  },
  uv(p) {
    const S = state.main; if (!S.data) return null;
    const P = prep(S.data), h = P.h, today = range(0, P.n).filter(i => h.time[i].startsWith(P.today) && Number(hh(h.time[i])) >= 6 && Number(hh(h.time[i])) <= 20);
    const lv = [['0–2', 'niedrig', 'Kein Schutz nötig.'], ['3–5', 'mäßig', 'Mittags Schatten, Sonnenbrille, LSF 30.'], ['6–7', 'hoch', 'LSF 50, Kopfbedeckung, 11–15 Uhr meiden.'], ['8–10', 'sehr hoch', 'Möglichst nicht in die Sonne, LSF 50+.'], ['11+', 'extrem', 'Ungeschützte Haut verbrennt in Minuten.']];
    return {
      title: '😎 UV-Index', sub: `${esc(currentLoc().name)} · heute max ${fmt(hv(P.dl, 'uv_index_max', P.todayD), '', 1)}`,
      body: `${chartCard(lineChart(today.map(i => hh(h.time[i])), today.map(i => hv(h, 'uv_index', i)), { cls: 'stroke-amber-500', unit: '', dec: 1 }), 'UV-Index im Tagesverlauf')}
      ${rowsCard(lv.map(([r, l, t]) => [`${r} · ${l}`, `<span class="text-sm font-bold">${t}</span>`]))}
      ${note('🏔️', 'Pro 1000 Höhenmeter steigt die UV-Strahlung um rund 10 %, Schnee reflektiert bis zu 90 % – am Berg also deutlich mehr Schutz einplanen.')}`
    };
  },
  wind(p) {
    const S = slotOf(p); if (!S.data) return null;
    const P = prep(S.data), h = P.h, i0 = P.nowIdx, I = hourRange(P, i0, i0 + 24);
    const c = currentVals(S.data, P, S.ts);
    return {
      title: '🌬️ Wind', sub: `${esc(currentLoc().name)} · ${fmt(S.data.elevation)} m`,
      body: `<div class="${CARD} p-4 flex items-center gap-4">${compass(c.wind_direction_10m, 104)}
        <div><div class="text-4xl font-black tabular">${fmt(c.wind_speed_10m)}<span class="text-lg"> km/h</span></div>
        <div class="font-extrabold">aus ${dirName(c.wind_direction_10m)} · Böen ${fmt(c.wind_gusts_10m, ' km/h')}</div>
        <div class="${SUB}">${beaufort(c.wind_speed_10m)}</div></div></div>
      ${h3('Nächste 24 Stunden')}
      ${chartCard(lineChart(I.map(i => hh(h.time[i])), I.map(i => hv(h, 'wind_gusts_10m', i)), { cls: 'stroke-indigo-500', unit: '' }), 'Böen in km/h')}

  },
  sun(p) {
    const S = state.main; if (!S.data) return null;

  },
  clouds(p) {
    const S = slotOf(p); if (!S.data) return null;

      title: '☁️ Bewölkung & Sicht', sub: `${esc(currentLoc().name)} · ${fmt(S.data.elevation)} m`,
      body: `${rowsCard([['Bewölkung gesamt', fmt(g('cloud_cover'), ' %')], isNum(g('cloud_cover_low')) ? ['davon tiefe Wolken', fmt(g('cloud_cover_low'), ' %')] : null, isNum(vis) ? ['Sicht', vis >= 20000 ? '> 20 km' : fmt(vis / 1000, ' km', 1)] : null])}
      ${chartCard(lineChart(I.map(i => hh(h.time[i])), I.map(i => hv(h, 'cloud_cover', i)), { cls: 'stroke-slate-500', unit: '%' }), 'Bewölkung nächste 24 h in %')}
      ${note('🌫️', 'Viele <b>tiefe Wolken</b> im Tal bei klarer Höhe = Hochnebel: Oben scheint dann oft die Sonne. Unter ca. 1 km Sicht herrscht im Gelände Whiteout-Gefahr.')}`
    };
  },

  /* --- Rennrad --- */
  bike() {
    if (!lastBike || !state.main.data) return null;
    const { W, R, windowTxt, a, b } = lastBike, h = state.main.data.hourly;
    const rows = range(a, b).map(i => {
      const Wi = windowStats(h, i, i + 1), lv = rateBike(Wi).level;
      return `<div class="flex items-center gap-2 py-2 border-t border-slate-200 dark:border-slate-800 first:border-0">
        <span class="w-11 font-extrabold tabular">${h.time[i].slice(11, 16)}</span><span class="w-3.5 h-3.5 rounded-full ${LEVEL[lv].dot}"></span>
        <span class="w-12 font-black tabular text-right">${fmtT(Wi.tMin)}</span>
        <span class="flex-1 text-sm font-bold tabular text-right">💨 ${fmt(Wi.windAvg)}/${fmt(Wi.gustMax)}</span>
        <span class="w-14 text-sm font-bold tabular text-right text-blue-700 dark:text-sky-300">💧${fmt(Wi.popMax)}%</span></div>`;
    }).join('');
    const rule = (icon, name, lv, go, cond, no) => `<div class="${CARD} p-3.5"><div class="font-black">${icon} ${name}: ${LEVEL[lv].icon} ${LEVEL[lv].label}</div>
      <div class="text-sm font-semibold mt-1 leading-snug"><span class="${LEVEL[0].txt} font-extrabold">GO</span> ${go}<br><span class="${LEVEL[1].txt} font-extrabold">BEDINGT</span> ${cond}<br><span class="${LEVEL[2].txt} font-extrabold">NEIN</span> ${no}</div></div>`;
    return {
      title: `🚴 Rennrad-Ampel: ${LEVEL[R.level].label}`, sub: windowTxt,
      body: `${rule('💨', 'Wind', R.factors[0].level, 'Böen bis 38 km/h und Mittelwind bis 25 km/h', 'Böen bis 55 km/h oder Mittelwind bis 40 km/h', 'darüber – Seitenwind wird gefährlich')}
      ${rule('🌧️', 'Regen', R.factors[1].level, 'Regenrisiko unter 30 % und unter 0,3 mm', 'Regenrisiko bis 60 % oder bis 2 mm', 'ab 60 % bzw. 2 mm, bei Gewitter oder gefrierendem Regen')}
      ${rule('🌡️', 'Temperatur', R.factors[2].level, '7 bis 31 °C', '2 bis 7 °C oder 31 bis 36 °C', 'unter 2 °C (Glätte) oder über 36 °C')}
      ${h3('Stunde für Stunde')}
      <div class="${CARD} px-3 py-1">${rows}</div>
      ${note('🧮', `Im Zeitfenster: ${fmt(W.tMin)}–${fmt(W.tMax, ' °C')}, Wind Ø ${fmt(W.windAvg)} km/h, Böen bis ${fmt(W.gustMax)} km/h, Regenrisiko bis ${fmt(W.popMax)} %. Der schlechteste der drei Faktoren bestimmt die Ampel.`)}`
    };
  },
  clothing() {
    if (!lastBike) return null;
    const { W, C } = lastBike;
    const steps = [['ab 21 °C', 'Kurz/Kurz'], ['16–21 °C', 'Kurz/Kurz + Weste'], ['12–16 °C', 'Kurz/Kurz + Armlinge'], ['8–12 °C', 'Langarm + Knielinge'], ['3–8 °C', 'Lang/Lang + Windjacke'], ['−3–3 °C', 'Winter-Outfit'], ['unter −3 °C', 'Volle Winterausrüstung']];
    return {
      title: `👕 ${esc(C.head)}`, sub: lastBike.windowTxt,
      body: `${note('🌬️', `Beim Fahren kühlt der Fahrtwind (≈ 25 km/h) plus der halbe Umgebungswind (${fmt(W.windAvg)} km/h). So fühlen sich <b>${fmt(W.tMin, ' °C')}</b> Luft an wie <b>${fmt(C.eff, ' °C')}</b>. Nach diesem „Fahrt-Windchill“ richtet sich die Empfehlung.`)}
      ${rowsCard(steps.map(([t, l]) => [`<span class="${l === C.head.split(' + Regenjacke')[0] ? 'text-slate-900 dark:text-white font-black' : ''}">${t}</span>`, l]))}
      <ul class="space-y-2">${C.items.map(([ic, t]) => `<li class="flex items-start gap-3 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 px-3 py-2.5"><span class="text-xl leading-6">${ic}</span><span class="font-bold leading-6">${t}</span></li>`).join('')}</ul>`
    };
  },

  /* --- Ski & Wachs --- */
  wax() {
    if (!lastWax) return null;
    const { A, SD, st, det, elevUsed, meas, day } = lastWax, w = A.cat;
    const steps = [
      'Belag mit der Messingbürste von vorne nach hinten ausbürsten (alte Wachsreste und Schmutz raus).',
      `Bügeleisen auf <b>${w.iron}</b> einstellen. Swix PS${w.code} ans Eisen halten und auf den Belag tropfen lassen oder einreiben.`,
      'In 2–3 langsamen Zügen von vorne nach hinten einbügeln – Eisen immer in Bewegung halten, Wachs darf nicht rauchen.',
      'Mindestens 20–30 Minuten abkühlen lassen (über Nacht hält es länger).',
      'Mit der Plexi-Abziehklinge von vorne nach hinten abziehen, Kanten und Rillen freikratzen.',
      'Bürsten: Messing → Nylon → Rosshaar, zum Schluss mit Fibertex/Polierpad auspolieren.'
    ];
    return {
      title: `🎿 Swix PS${w.code} ${w.color}`, sub: `${day} · ${fmt(elevUsed)} m · ${w.range}`,
      body: `<div class="rounded-3xl ${w.card} p-4"><div class="text-sm font-extrabold opacity-90">Warum dieses Wachs?</div>
        <div class="font-bold mt-1 leading-snug">Skitag ${fmt(SD.tMin)} bis ${fmt(SD.tMax, ' °C')}, Ø ${fmt(SD.tAvg, ' °C', 1)}. Schneeart: ${SNOW_NAMES[st]}${state.snowType === 'auto' ? ` (${det.why})` : ' (von dir gewählt)'}. Daraus ergibt sich eine Wachs-Referenz von <b>${fmt(A.tRef, ' °C', 1)}</b> → ${w.label}.</div></div>
      ${meas ? note('📡', `<b>${esc(meas.s.name)}</b> (${fmt(meas.s.alt)} m) misst ${fmt(meas.s.t, ' °C', 1)}${isNum(meas.s.oft) ? `, die Schnee-Oberfläche hat ${fmt(meas.s.oft, ' °C', 1)}` : ''}.${meas.hint}${isNum(meas.s.oft) && isNum(meas.s.t) && meas.s.oft < meas.s.t - 4 ? ' Der Schnee ist deutlich kälter als die Luft (klare Nacht) – vormittags läuft eher das härtere Wachs.' : ''}`) : ''}
      ${h3('Swix-Produkte für diese Bedingungen')}
      <ul class="space-y-2">${A.products.map(([ic, tier, name, txt], k) => `<li class="flex gap-3 items-start rounded-2xl ${k ? 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800' : 'bg-sky-50 dark:bg-sky-950/50 border-2 border-sky-400 dark:border-sky-700'} p-3">
        <span class="text-2xl leading-7">${ic}</span><div><div class="text-xs font-extrabold uppercase tracking-wide text-slate-600 dark:text-slate-300">${tier}</div><div class="font-black text-lg leading-tight">${name}</div><div class="text-sm font-semibold mt-0.5 leading-snug">${txt}</div></div></li>`).join('')}</ul>
      ${A.mix ? note('🔀', A.mix) : ''}
      ${note(A.hum.icon, `<b>${A.hum.title}.</b> ${A.hum.text}`)}
      ${note('〰️', `<b>Struktur: ${A.struct.name}.</b> ${A.struct.text}`)}
      ${h3('So wachst du richtig')}
      <ol class="space-y-2">${steps.map((t, k) => `<li class="flex gap-3 items-start ${CARD} p-3"><span class="w-7 h-7 shrink-0 grid place-items-center rounded-full bg-slate-900 text-white dark:bg-white dark:text-slate-900 font-black">${k + 1}</span><span class="text-sm font-semibold leading-snug pt-0.5">${t}</span></li>`).join('')}</ol>
      <button data-info="waxchart" class="w-full py-3 rounded-2xl bg-slate-200 dark:bg-slate-800 font-extrabold active:scale-95">Alle Swix-Farben & Temperaturen</button>
      <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 px-1">Temperaturbereiche und Bügeltemperaturen laut Swix-Packungsangaben (ca.) – im Zweifel gilt die Angabe auf deiner Packung.</p>`
    };
  },
  waxchart() {
    const cur = lastWax ? lastWax.A.idx : -1;
    return {
      title: '🎨 Swix-Farbtabelle', sub: 'Fluorfreie Gleitwachse · gleiche Nummer = gleicher Bereich',
      body: `<ul class="space-y-2">${WAX.slice().reverse().map(w => { const k = WAX.indexOf(w); return `<li class="flex items-center gap-3 rounded-2xl ${k === cur ? 'ring-4 ring-sky-500' : ''} ${CARD} p-3">
        <span class="w-12 h-12 shrink-0 rounded-xl ${w.swatch} grid place-items-center font-black ${w.code === '10' ? 'text-slate-950' : 'text-white'}">${w.code}</span>
        <div class="min-w-0 flex-1"><div class="font-black">PS${w.code} / HS${w.code} / TS${w.code} · ${w.color}</div><div class="text-sm font-semibold text-slate-600 dark:text-slate-300">${w.range} · Bügeleisen ${w.iron}</div></div>
        ${k === cur ? '<span class="text-xs font-black text-sky-700 dark:text-sky-300">EMPFOHLEN</span>' : ''}</li>`; }).join('')}
        <li class="flex items-center gap-3 ${CARD} p-3"><span class="w-12 h-12 shrink-0 rounded-xl bg-slate-200 dark:bg-slate-700 grid place-items-center text-2xl">🥶</span><div><div class="font-black">PS Polar</div><div class="text-sm font-semibold text-slate-600 dark:text-slate-300">ca. −14 bis −32 °C · für extreme Kälte</div></div></li>
        <li class="flex items-center gap-3 ${CARD} p-3"><span class="w-12 h-12 shrink-0 rounded-xl bg-slate-200 dark:bg-slate-700 grid place-items-center text-2xl">⚡</span><div><div class="font-black">F4 Glidewax</div><div class="text-sm font-semibold text-slate-600 dark:text-slate-300">alle Temperaturen · Flüssig/Paste ohne Bügeleisen</div></div></li></ul>
      ${note('📈', '<b>PS</b> = Performance Speed (Training, Alltag) · <b>HS</b> = High Speed (schneller) · <b>TS</b> = Top Speed (Rennen). Niedrige Nummern sind härter und robuster, hohe Nummern weicher und wasserabweisender.')}
      ${note('🔀', 'Liegt der Tag zwischen zwei Farben: das härtere (kältere) Wachs als Basis einbügeln, das wärmere dünn darüber – oder beide 50/50 mischen.')}`
    };
  },
  snow() {
    const S = state.ski; if (!S.data) return null;
    const P = prep(S.data), h = P.h, i0 = P.nowIdx;
    const I = hourRange(P, i0 - 23, i0 + 49);
    const depth = hv(h, 'snow_depth', i0), stc = stationFor(currentLoc(), 'ski');
    const s = stc && stc.s;
    return {
      title: '❄️ Neuschnee', sub: `${esc(currentLoc().name)} · ${fmt(S.data.elevation)} m`,
      body: `${rowsCard([
        ['Letzte 24 h', fmt(sum(hourRange(P, i0 - 23, i0 + 1).map(i => hv(h, 'snowfall', i))), ' cm', 1)],
        ['Nächste 24 h', fmt(sum(hourRange(P, i0 + 1, i0 + 25).map(i => hv(h, 'snowfall', i))), ' cm', 1)],
        ['Nächste 48 h', fmt(sum(hourRange(P, i0 + 1, i0 + 49).map(i => hv(h, 'snowfall', i))), ' cm', 1)],
        isNum(depth) ? ['Schneehöhe (Modell)', fmt(depth * 100, ' cm')] : null,
        s && isNum(s.hs) ? [`Schneehöhe gemessen<br><span class="text-xs">${esc(s.name)}, ${fmt(s.alt)} m</span>`, `${fmt(s.hs, ' cm')}${isNum(s.hs24) ? ` <span class="text-sm">(24 h: ${signed(s.hs24, ' cm')})</span>` : ''}`] : null
      ])}
      ${chartCard(lineChart(I.map(i => hh(h.time[i])), I.map(i => hv(h, 'temperature_2m', i)), { bars: I.map(i => hv(h, 'snowfall', i)), barCls: 'fill-indigo-500' }), 'Gestern bis übermorgen: Linie = Temperatur, Balken = Neuschnee pro Stunde')}
      ${note('📏', 'Die gemessene Schneehöhe der Station ist meist genauer als das Wettermodell. Wind verfrachtet Neuschnee – an Graten liegt oft viel weniger, in Mulden viel mehr.')}`
    };
  },
  fzl() {
    const S = state.ski; if (!S.data) return null;
    const P = prep(S.data), h = P.h, I = hourRange(P, P.nowIdx, P.nowIdx + 48);
    return {
      title: '🧊 Nullgradgrenze', sub: `${esc(currentLoc().name)} · du bist auf ${fmt(S.data.elevation)} m`,
      body: `${chartCard(lineChart(I.map(i => hh(h.time[i])), I.map(i => hv(h, 'freezing_level_height', i)), { cls: 'stroke-sky-500', unit: ' m' }), 'Höhe der 0-°C-Grenze in den nächsten 48 Stunden')}
      ${note('💡', 'Liegt die Nullgradgrenze <b>über</b> deiner Höhe, wird der Schnee weich und nass (wärmeres Wachs, grobe Struktur). Liegt sie deutlich <b>darunter</b>, bleibt er kalt und griffig. Bei Inversion kann es oben wärmer sein als im Tal.')}`
    };
  },

  /* --- Stationen --- */
  stations(p) {
    const loc = currentLoc(), S = state.st, mode = p.mode === 'ski' ? 'ski' : 'main';
    if (!loc) return null;
    if (!S.list) return S.error ? { title: '📡 Messstationen', body: errorCard(S.error) } : null;
    const f = p.f || 'all', ch = stationFor(loc, mode), curKey = ch ? stKey(ch.s) : null;
    const manual = mode === 'ski' ? loc.stSki : loc.stMain;
    const list = S.list.filter(s => f === 'berg' ? s.alt >= 1500 : f === 'tal' ? !(s.alt >= 1500) : true);
    const chip = (v, l) => `<button data-info="stations" data-mode="${mode}" data-f="${v}" class="shrink-0 px-3.5 py-2 rounded-xl font-extrabold text-sm border-2 ${f === v ? 'bg-slate-900 text-white border-slate-900 dark:bg-white dark:text-slate-900 dark:border-white' : 'border-slate-300 dark:border-slate-700'}">${l}</button>`;
    const vals = s => [isNum(s.t) ? `🌡️ ${fmt(s.t, '°', 1)}` : '', isNum(s.hs) ? `❄️ ${fmt(s.hs)} cm` : '', isNum(s.wg) ? `💨 ${fmt(s.wg)} km/h` : (isNum(s.ws) ? `💨 ${fmt(s.ws)} km/h` : '')].filter(Boolean).join(' · ');
    const rows = list.map(s => {
      const k = stKey(s), on = k === curKey;
      return `<li class="flex items-stretch rounded-2xl border-2 ${on ? 'border-sky-500 bg-sky-50 dark:bg-sky-950/40' : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900'}">
        <button data-act="st-choose" data-v="${esc(k)}" data-mode="${mode}" class="flex-1 min-w-0 text-left pl-4 py-3">
          <div class="font-extrabold truncate">${on ? '✓ ' : ''}${esc(s.name)}</div>
          <div class="text-sm font-semibold text-slate-600 dark:text-slate-300 truncate">⛰️ ${fmt(s.alt)} m · ${fmt(s.dist, ' km', s.dist < 10 ? 1 : 0)} · ${s.src === 'lwd' ? 'LWD' : 'GeoSphere'} · ${ago(s.time)}</div>
          <div class="text-sm font-bold tabular mt-0.5">${vals(s) || '–'}</div>
        </button>
        <button data-info="station" data-sid="${esc(k)}" data-mode="${mode}" class="w-12 shrink-0 grid place-items-center text-xl text-slate-500 dark:text-slate-400 active:scale-90" aria-label="Details zu ${esc(s.name)}">ⓘ</button>
      </li>`;
    }).join('');
    return {
      title: '📡 Messstationen', sub: `${mode === 'ski' ? 'Für Ski & Wachs' : 'Für Wetter'} · ${ST_RADIUS} km um ${esc(loc.name)}`,
      body: `<div class="no-scrollbar flex gap-2 overflow-x-auto -mx-4 px-4">${chip('all', 'Alle')}${chip('berg', '⛰️ Berg ab 1500 m')}${chip('tal', '🏘️ Tal')}</div>
        <button data-act="st-choose" data-v="" data-mode="${mode}" class="w-full text-left rounded-2xl border-2 px-4 py-3 ${!manual ? 'border-sky-500 bg-sky-50 dark:bg-sky-950/40' : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900'}">
          <div class="font-extrabold">${!manual ? '✓ ' : ''}Automatisch wählen</div>
          <div class="text-sm font-semibold text-slate-600 dark:text-slate-300">${mode === 'ski' ? 'Station, deren Höhe am besten zur Gipfellage passt' : 'Nächste Station mit ähnlicher Höhe'}</div></button>
        ${rows ? `<ul class="space-y-2">${rows}</ul>` : `<p class="${SUB} px-1">Keine Station in dieser Auswahl.</p>`}
        <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 px-1 leading-relaxed">Messwerte: Lawinenwarndienste Tirol · Südtirol · Trentino (avalanche.report) und GeoSphere Austria (CC BY 4.0). Ungeprüfte Rohdaten, Stand ${S.ts ? clock(S.ts) : '–'} Uhr.</p>`
    };
  },
  station(p) {
    const s = findStation(p.sid);
    if (!s) return state.st.list ? { title: '📡 Station', body: `<p class="${SUB}">Diese Station liefert gerade keine Daten.</p>` } : null;
    const mode = p.mode === 'ski' ? 'ski' : 'main', loc = currentLoc(), k = stKey(s);
    const isMain = loc && loc.stMain === k, isSki = loc && loc.stSki === k;
    const hints = [];
    if (isNum(s.oft) && isNum(s.t) && s.oft < s.t - 4) hints.push(['🌌', `Die Schnee-Oberfläche ist ${fmt(s.t - s.oft)} °C kälter als die Luft – typisch nach einer klaren Nacht. Der Schnee bleibt länger hart und griffig.`]);
    if (isNum(s.hs24) && s.hs24 >= 5) hints.push(['❄️', `In den letzten 24 Stunden sind rund ${fmt(s.hs24, ' cm')} Schnee dazugekommen.`]);
    if (isNum(s.wg) && s.wg >= 60) hints.push(['🚩', 'Sturmböen – exponierte Lifte stehen oft still, Triebschnee möglich.']);
    if (isNum(s.t) && s.t > 0 && isNum(s.hs) && s.hs > 0) hints.push(['💧', 'Plusgrade auf Schnee: Er wird nass und schwer – warmes Wachs und grobe Struktur.']);
    const btn = (attrs, txt, on) => `<button ${attrs} class="w-full py-3 rounded-2xl font-extrabold active:scale-95 ${on ? 'bg-emerald-600 text-white' : 'bg-sky-600 text-white'}">${on ? '✓ ' : ''}${txt}</button>`;
    return {
      title: `📡 ${esc(s.name)}`, sub: `${fmt(s.alt)} m · ${fmt(s.dist, ' km', 1)} entfernt · ${SRC_NAME[s.src]}`,
      body: `<div class="${CARD} p-4 flex items-center gap-4">${isNum(s.wd) ? compass(s.wd, 96) : '<div class="text-6xl">🌡️</div>'}
          <div><div class="text-5xl font-black tabular leading-none">${fmt(s.t, '°', 1)}</div><div class="font-extrabold mt-1">Lufttemperatur</div><div class="${SUB}">Messung ${ago(s.time)}${s.time ? ` (${clock(s.time)} Uhr)` : ''}</div></div></div>
        ${rowsCard([
          isNum(s.td) ? ['💦 Taupunkt', fmt(s.td, ' °C', 1)] : null,
          isNum(s.rh) ? ['💧 Luftfeuchte', fmt(s.rh, ' %')] : null,
          isNum(s.ws) ? ['🌬️ Wind', `${fmt(s.ws)} km/h${isNum(s.wd) ? ` aus ${dirName(s.wd)}` : ''}`] : null,
          isNum(s.wg) ? ['💨 Böen', fmt(s.wg, ' km/h')] : null,
          isNum(s.hs) ? ['❄️ Schneehöhe', fmt(s.hs, ' cm')] : null,
          isNum(s.hs24) ? ['📈 Schnee 24 h', signed(s.hs24, ' cm')] : null,
          isNum(s.hs72) ? ['📈 Schnee 72 h', signed(s.hs72, ' cm')] : null,
          isNum(s.oft) ? ['🧊 Schnee-Oberfläche', fmt(s.oft, ' °C', 1)] : null,
          isNum(s.n24) ? ['🌧️ Niederschlag 24 h', fmt(s.n24, ' mm', 1)] : null,
          isNum(s.rr) ? ['🌧️ Niederschlag 10 Min.', fmt(s.rr, ' mm', 1)] : null,
          isNum(s.p) ? ['🎈 Luftdruck', fmt(s.p, ' hPa')] : null,
          ['🏢 Betreiber', `<span class="text-sm">${esc(s.op || SRC_NAME[s.src])}</span>`]
        ])}
        ${hints.map(([ic, t]) => note(ic, t)).join('')}
        <div class="space-y-2">
          ${btn(`data-act="st-choose" data-v="${esc(k)}" data-mode="main"`, 'Für Wetter verwenden', isMain)}
          ${btn(`data-act="st-choose" data-v="${esc(k)}" data-mode="ski"`, 'Für Ski & Wachs verwenden', isSki)}
          <button data-act="st-save" data-sid="${esc(k)}" class="w-full py-3 rounded-2xl bg-slate-200 dark:bg-slate-800 font-extrabold active:scale-95">★ Als eigenen Ort speichern (${fmt(s.alt)} m)</button>
          ${s.link ? `<a href="${esc(s.link)}" target="_blank" rel="noopener" class="block text-center py-2 text-sm font-extrabold underline text-slate-600 dark:text-slate-300">Messdiagramme beim Betreiber ↗</a>` : ''}
        </div>
        <button data-info="stations" data-mode="${mode}" class="w-full py-2 text-sm font-extrabold text-slate-600 dark:text-slate-300 underline">‹ Alle Stationen in der Nähe</button>`
    };
  },

  /* --- Schnellzugriffe auf dem Startbildschirm (Manifest-Shortcuts) --- */
  shortcuts() {
    const android = /Android/i.test(navigator.userAgent);
    const step = (n, html) => `<li class="flex gap-3 items-start ${CARD} p-3"><span class="w-7 h-7 shrink-0 grid place-items-center rounded-full bg-sky-600 text-white font-black">${n}</span><div class="text-sm font-semibold leading-snug pt-0.5">${html}</div></li>`;
    const sc = [['🌤️', 'Wetter', 'aktuelles Wetter & 7 Tage'], ['🚴', 'Rennrad', 'Ampel mit Grenzwerten'], ['🎿', 'Skiwachs', 'Swix-Empfehlung für heute'], ['📡', 'Stationen', 'Messwerte in deiner Nähe']];
    return {
      title: '📱 Schnellzugriffe', sub: 'Direkt vom Startbildschirm zu den Details',

/* --- Info-Sheet öffnen / schließen (mit Zurück-Geste) --- */
let info = null, navDepth = 0, ignorePop = 0;
function navPush() { try { history.pushState({ aw: ++navDepth }, ''); } catch (e) { navDepth = Math.max(0, navDepth - 1); } }
function navPop(n = 1) {
  n = Math.min(n, navDepth);
  if (n <= 0) return;
  navDepth -= n; ignorePop++;
  history.go(-n);
}
function renderInfo(keepScroll) {
  if (!info) return;
  let r = null;
  try { r = INFO[info.key](info.p || {}); }
  catch (e) { console.error(e); r = { title: 'Fehler', body: errorCard({ kind: 'render', message: e.message }) }; }
  const body = $('#infoBody'), top = body.scrollTop;
  $('#infoTitle').innerHTML = r ? r.title : 'Lade …';
  $('#infoSub').innerHTML = r && r.sub ? r.sub : '';
  body.innerHTML = r ? r.body : `<div class="flex items-center justify-center gap-2 py-12 font-bold text-slate-600 dark:text-slate-300">${SPINNER} Lade Daten …</div>`;
  body.scrollTop = keepScroll ? top : 0;
}
function openInfo(key, p = {}) {
  if (!INFO[key]) return;
  const el = $('#info'), was = !!info;
  info = { key, p };
  renderInfo(false);
  if (!was) {
    el.classList.remove('hidden'); el.setAttribute('aria-hidden', 'false');
    $('#infoBody').scrollTop = 0;
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      $('.sheet-panel', el).classList.remove('translate-y-full');
      $('.sheet-overlay', el).classList.remove('opacity-0');
    }));
    navPush();
  }
  if (key === 'stations' || key === 'station' || key === 'snow') loadStations();
}
function closeInfo(fromNav) {
  if (!info) return;
  info = null;
  const el = $('#info');
  $('.sheet-panel', el).classList.add('translate-y-full');
  $('.sheet-overlay', el).classList.add('opacity-0');
  if (!sheetOpen) document.body.style.overflow = '';
  setTimeout(() => { if (!info) { el.classList.add('hidden'); el.setAttribute('aria-hidden', 'true'); } }, 300);
  if (!fromNav) navPop(1);
}

/* --- Links (Schnellzugriffe, Lesezeichen): ?tab=ski&info=wax&loc=<id>&lat=..&lon=..&name=..&elev=.. --- */
let pendingInfo = null;
function applyDeepLink() {
  let q;
  try { q = new URLSearchParams(location.search); } catch (e) { return; }
  if (!Array.from(q.keys()).length) return;
  const tab = q.get('tab');
  if (['wetter', 'rad', 'ski'].includes(tab)) { state.tab = tab; LS.set('aw_tab', tab); }
  const id = q.get('loc'), lat = parseFloat(q.get('lat')), lon = parseFloat(q.get('lon'));
  let target = id ? state.locations.find(l => l.id === id) : null;
  if (!target && isNum(lat) && isNum(lon)) target = state.locations.find(l => Math.abs(l.lat - lat) < 0.005 && Math.abs(l.lon - lon) < 0.005);
  if (target) { state.selectedId = target.id; LS.set('aw_selected', target.id); }
  else if (isNum(lat) && isNum(lon)) {
    const ev = parseFloat(q.get('elev'));
    state.tempLoc = { id: '__temp', name: (q.get('name') || 'Ort aus Link').slice(0, 60), region: 'per Link geöffnet', lat, lon, elevation: isNum(ev) ? Math.round(ev) : null, valley: null };
    state.selectedId = '__temp'; persistLocs(); LS.set('aw_selected', '__temp');
  }
  const key = q.get('info');
  if (key && INFO[key]) pendingInfo = { key, p: { d: q.get('d') || '', t: q.get('t') || '', mode: q.get('mode') || '', slot: q.get('slot') || '' } };
  try { history.replaceState(null, '', location.pathname); } catch (e) { /* egal */ }
}

  requestAnimationFrame(() => requestAnimationFrame(() => {

    $('.sheet-overlay', el).classList.remove('opacity-0');
  }));
  if (!sheetOpen) navPush();

function closeSheet(fromNav) {

  $('.sheet-panel', el).classList.add('translate-y-full');

let searchTimer = null, searchSeq = 0;
async function doSearch(q) {
  const seq = ++searchSeq;
  state.search = { q, status: 'loading', results: [], error: null };
  renderSheet();
  try {
    const url = `${GEO_API}?${new URLSearchParams({ name: q, count: '8', language: 'de', format: 'json' })}`;
    const data = await fetchJSON(url, 10000);
    if (seq !== searchSeq) return;
    state.search = { q, status: 'done', results: Array.isArray(data.results) ? data.results : [], error: null };
  } catch (e) {
    if (seq !== searchSeq) return;
    state.search = { q, status: 'error', results: [], error: e };
  }
  if (sheetOpen) renderSheet();
}

function closeDlg() { const el = $('#dlg'); el.classList.add('hidden'); el.setAttribute('aria-hidden', 'true'); dlgCtx = null; }
function readDlg() {
  const f = $('#dlgForm');
  const name = f.elements.name.value.trim();
  const raw = String(f.elements.elevation.value).trim().replace(',', '.');
  const err = m => { const e = $('#dlgError'); e.textContent = m; e.classList.remove('hidden'); return null; };
  if (!name) return err('Bitte einen Namen eingeben.');
  let elevation = null;
  if (raw !== '') {
    elevation = Number(raw);
    if (!Number.isFinite(elevation) || elevation < -400 || elevation > 8848) return err('Die Höhe muss zwischen −400 und 8848 m liegen.');
    elevation = Math.round(elevation);
  }
  return { name, elevation };
}
