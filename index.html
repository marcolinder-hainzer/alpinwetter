<script>
/* Theme so früh wie möglich setzen (kein Aufblitzen) */
(function () {
  try {
    var t = localStorage.getItem('aw_theme');
    t = t ? JSON.parse(t) : null;
    var dark = (t === 'dark' || t === 'light') ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.classList.add('dark');
    document.getElementById('themeColor').setAttribute('content', dark ? '#09090b' : '#f4f4f5');
  } catch (e) {}
})();

</script>

<style>
  html, body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
  body { background: #f4f4f5; color: #18181b; overflow-x: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  html.dark body { background: #09090b; color: #fafafa; }
  #app { overflow-x: clip; }
  .tabular { font-variant-numeric: tabular-nums; }
  .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .pt-safe { padding-top: env(safe-area-inset-top); }
  .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
  .pb-tabbar { padding-bottom: calc(5.5rem + env(safe-area-inset-bottom)); }
  .sheet-pb { padding-bottom: env(safe-area-inset-bottom); }
  .shimmer {
    background: linear-gradient(90deg, rgba(161,161,170,.18) 25%, rgba(161,161,170,.36) 37%, rgba(161,161,170,.18) 63%);
    background-size: 400% 100%; animation: shimmer 1.4s ease infinite;
  }
  @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  .fade-in { animation: fadeIn .25s ease-out both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .spin { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadbar .bar { height: 100%; width: 35%; background: #0284c7; transform: translateX(-120%); opacity: 0; }
  #loadbar.on .bar { opacity: 1; animation: loadbar 1s ease-in-out infinite; }
  @keyframes loadbar { 0% { transform: translateX(-120%); } 100% { transform: translateX(300%); } }
  .sheet-panel { transition: transform .26s cubic-bezier(.2,.8,.2,1); will-change: transform; }
  .sheet-overlay { transition: opacity .26s ease; }
  #view { will-change: transform; }
  #ptr { transition: transform .2s ease, opacity .2s ease; }
  button { touch-action: manipulation; }
  [data-fav] button { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  input[type=number]::-webkit-inner-spin-button { opacity: 1; }

<script>

const DEFAULT_LOCATIONS = [
  { id: 'jenbach', name: 'Jenbach', region: 'Tal · Tirol', lat: 47.3893, lon: 11.7808, elevation: null, valley: 563, cc: 'AT' },
  { id: 'hintertux', name: 'Hintertuxer Gletscher', region: 'Gletscher · Zillertal', lat: 47.0742, lon: 11.6773, elevation: 3250, valley: 1500, cc: 'AT' },

const memCache = new Map(Object.entries(LS.get(CACHE_KEY, {}) || {}));
function saveCache() {
  const entries = Array.from(memCache.entries()).sort((a, b) => b[1].ts - a[1].ts).slice(0, 8);
  LS.set(CACHE_KEY, Object.fromEntries(entries));
}
const cacheKey = (loc, elev) => `${(+loc.lat).toFixed(3)},${(+loc.lon).toFixed(3)},${isNum(elev) ? Math.round(elev) : 'dem'}`;

async function fetchJSON(url, timeout = 12000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    let body = null;
    try { body = await res.json(); } catch (e) { /* kein JSON */ }
    if (!res.ok || (body && body.error)) {
      const err = new Error((body && body.reason) || `HTTP ${res.status}`);
      err.kind = 'http'; err.status = res.status; throw err;
    }
    if (!body) { const err = new Error('Leere Antwort'); err.kind = 'data'; throw err; }
    return body;
  } catch (e) {
    if (e.kind) throw e;
    const err = new Error(e.name === 'AbortError' ? 'Zeitüberschreitung' : 'Netzwerkfehler');
    err.kind = e.name === 'AbortError' ? 'timeout' : (navigator.onLine === false ? 'offline' : 'network');
    throw err;
  } finally { clearTimeout(timer); }
}

function forecastUrl(loc, elev, lite) {
  const p = new URLSearchParams({
    latitude: String(loc.lat), longitude: String(loc.lon),
    timezone: 'auto', past_days: '2', forecast_days: '7',
    current: CURRENT.join(','),
    hourly: (lite ? HOURLY_CORE : HOURLY_CORE.concat(HOURLY_EXTRA)).join(','),
    daily: DAILY.join(','),
    wind_speed_unit: 'kmh'
  });
  if (isNum(elev)) p.set('elevation', String(Math.round(elev)));
  return `${API}?${p}`;
}

const inflight = new Map();
function getForecast(loc, elev, force = false) {
  const key = cacheKey(loc, elev);
  const cached = memCache.get(key);
  if (!force && cached && Date.now() - cached.ts < TTL) return Promise.resolve({ ...cached, stale: false });
  if (inflight.has(key)) return inflight.get(key);
  const p = (async () => {
    try {
      let data;
      try { data = await fetchJSON(forecastUrl(loc, elev, false)); }
      catch (e) {
        // Falls ein Zusatzparameter nicht unterstützt wird → mit Basis-Variablen erneut versuchen
        if (e.kind === 'http' && e.status === 400) data = await fetchJSON(forecastUrl(loc, elev, true));
        else throw e;
      }
      if (!data.hourly || !Array.isArray(data.hourly.time) || !data.hourly.time.length || !data.daily || !Array.isArray(data.daily.time)) {
        const err = new Error('Unvollständige Wetterdaten'); err.kind = 'data'; throw err;
      }
      const entry = { ts: Date.now(), data };
      memCache.set(key, entry); saveCache();
      return { ...entry, stale: false };
    } catch (e) {
      if (cached) return { ...cached, stale: true, error: e };
      throw e;
    } finally { inflight.delete(key); }
  })();
  inflight.set(key, p);
  return p;
}

async function load(slot, force = false) {
  const loc = currentLoc();
  if (!loc) { render(); return; }
  const elev = slot === 'main' ? mainElev(loc) : skiElev(loc);
  const key = cacheKey(loc, elev);
  const S = state[slot];
  if (S.key !== key) {
    const c = memCache.get(key);
    Object.assign(S, { key, data: c ? c.data : null, ts: c ? c.ts : 0, stale: false, error: null });
  }
  S.loading = true; S.error = null;
  renderChrome();
  try {
    const r = await getForecast(loc, elev, force);
    if (S.key !== key) return;
    Object.assign(S, { data: r.data, ts: r.ts, stale: !!r.stale, error: r.error || null });
    if (r.stale && force) toast(describeError(r.error).title + ' – zeige gespeicherte Daten');
  } catch (e) {
    if (S.key !== key) return;
    S.error = e;
    if (S.data) S.stale = true;
  } finally {
    if (S.key === key) { S.loading = false; render(); }
    if (slot === 'main') gestureHint();
  }
}
function loadAll(force = false) {
  const p = load('main', force);
  if (state.tab === 'ski') load('ski', force);
  else p.then(() => load('ski', force && state.tab === 'ski'));
  loadStations(force);
  return p;
}

/* =====================================================================
   Wetterstationen (echte Messwerte) – beide Dienste kostenlos, ohne Key, CORS erlaubt
   · Lawinenwarndienste Tirol · Südtirol · Trentino (avalanche.report): viele Bergstationen,
     u. a. Schneehöhe und Schnee-Oberflächentemperatur
   · GeoSphere Austria (TAWES, 10-Minuten-Werte): offizielle Stationen in ganz Österreich
   ===================================================================== */
const LWD_URL = 'https://static.avalanche.report/weather_stations/stations.geojson';
const GS_API = 'https://dataset.api.hub.geosphere.at/v1/station/current/tawes-v1-10min';
const ST_RADIUS = 30;                   // km Umkreis
const ST_TTL = 10 * 60 * 1000;
const ST_CACHE_KEY = 'aw_st_v1';

function distKm(lat1, lon1, lat2, lon2) {
  const r = Math.PI / 180, dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.min(1, Math.sqrt(x)));
}
/* GeoSphere liefert Namen in GROSSBUCHSTABEN ohne Umlaute („SCHMITTENHOEHE“) → „Schmittenhöhe“ */
function niceName(s) {
  const UML = { AE: 'Ä', OE: 'Ö', UE: 'Ü' };
  return String(s || '')
    .replace(/(^|.)(AE|OE|UE)/g, (m, pre, pair) => (/[AEIOUQ]/.test(pre) || /MICHAEL/.test(s)) ? m : pre + UML[pair])
    .toLowerCase()
    .replace(/(^|[\s/(\-.])(\S)/g, (m, pre, ch) => pre + ch.toUpperCase());
}
const stKey = s => `${s.src}:${s.id}`;
const stCache = { lwd: null, lwdTs: 0, gsMeta: LS.get('aw_gsmeta_v1', null) };

async function loadLwd(force) {
  if (!force && stCache.lwd && Date.now() - stCache.lwdTs < ST_TTL) return stCache.lwd;
  let data;
  try { data = await fetchJSON(LWD_URL, 20000); }
  catch (e) {
    try { data = await fetchJSON(LWD_URL, 20000); }          // zweiter Versuch (Funkloch)
    catch (e2) { if (stCache.lwd) return stCache.lwd; throw e2; }
  }
  const n = v => isNum(v) ? v : null;
  stCache.lwd = (data.features || []).map(f => {
    const p = f.properties || {}, g = (f.geometry && f.geometry.coordinates) || [];
    return {
      src: 'lwd', id: String(f.id || p.name), name: p.name || 'Station', op: p.operator || 'Lawinenwarndienst',
      lat: g[1], lon: g[0], alt: n(g[2]), time: p.date ? Date.parse(p.date) : null,
      t: n(p.LT), rh: n(p.RH), td: n(p.TD), ws: n(p.WG), wg: n(p.WG_BOE), wd: n(p.WR),
      hs: n(p.HS), hs24: n(p.HSD24), hs72: n(p.HSD72), oft: n(p.OFT), n24: n(p.N24), p: n(p.LD),
      link: typeof p.operatorLink === 'string' && /^https:\/\//.test(p.operatorLink) ? p.operatorLink : null
    };
  }).filter(s => isNum(s.lat) && isNum(s.lon));
  stCache.lwdTs = Date.now();
  return stCache.lwd;
}
async function loadGsMeta() {
  const m = stCache.gsMeta;
  if (m && Array.isArray(m.list) && Date.now() - m.ts < 7 * 864e5) return m.list;
  const data = await fetchJSON(`${GS_API}/metadata`, 20000);
  const list = (data.stations || []).filter(s => s.is_active !== false && isNum(s.lat) && isNum(s.lon))
    .map(s => ({ id: String(s.id), name: niceName(s.name), lat: s.lat, lon: s.lon, alt: isNum(s.altitude) ? s.altitude : null }));
  stCache.gsMeta = { ts: Date.now(), list };
  LS.set('aw_gsmeta_v1', stCache.gsMeta);
  return list;
}
async function loadGsCurrent(ids) {
  const url = `${GS_API}?${new URLSearchParams({ parameters: 'TL,RF,TP,FF,FFX,DD,SCHNEE,RR,P', station_ids: ids.join(',') })}`;
  const data = await fetchJSON(url, 15000);
  const ts = (data.timestamps || []).map(t => Date.parse(t));
  const out = new Map();
  (data.features || []).forEach(f => {
    const pr = (f.properties && f.properties.parameters) || {};
    const tl = (pr.TL && pr.TL.data) || [];
    let k = tl.length - 1;
    while (k > 0 && !isNum(tl[k])) k--;          // letzter Zeitpunkt mit Temperatur
    const v = key => { const a = pr[key] && pr[key].data; return a && isNum(a[k]) ? a[k] : null; };
    const kmh = x => isNum(x) ? x * 3.6 : null;  // GeoSphere: m/s
    out.set(String(f.properties.station), { time: ts[k] || null, t: v('TL'), rh: v('RF'), td: v('TP'), ws: kmh(v('FF')), wg: kmh(v('FFX')), wd: v('DD'), hs: v('SCHNEE'), rr: v('RR'), p: v('P') });
  });
  return out;
}

/* Stationen im Umkreis des Ortes, nach Entfernung sortiert (Duplikate beider Dienste entfernt) */
async function nearbyStations(loc, force) {
  const [lwd, gsm] = await Promise.allSettled([loadLwd(force), loadGsMeta()]);
  const withDist = s => ({ ...s, dist: distKm(loc.lat, loc.lon, s.lat, s.lon) });
  let list = lwd.status === 'fulfilled' ? lwd.value.map(withDist).filter(s => s.dist <= ST_RADIUS) : [];
  let gs = gsm.status === 'fulfilled'
    ? gsm.value.map(withDist).filter(s => s.dist <= ST_RADIUS).sort((a, b) => a.dist - b.dist).slice(0, 15).map(s => ({ ...s, src: 'gs', op: 'GeoSphere Austria' }))
    : [];
  let partial = lwd.status === 'rejected' || gsm.status === 'rejected';
  if (gs.length) {
    try { const cur = await loadGsCurrent(gs.map(s => s.id)); gs = gs.map(s => ({ ...s, ...(cur.get(s.id) || {}) })); }
    catch (e) { gs = []; partial = true; }
  }
  gs = gs.filter(g => !list.some(l => distKm(l.lat, l.lon, g.lat, g.lon) < 0.4 && Math.abs((l.alt || 0) - (g.alt || 0)) < 80));
  const maxAge = 12 * 3600 * 1000;
  list = list.concat(gs)
    .filter(s => (isNum(s.t) || isNum(s.hs)) && (!s.time || Date.now() - s.time < maxAge))
    .sort((a, b) => a.dist - b.dist).slice(0, 30);
  if (!list.length && lwd.status === 'rejected' && gsm.status === 'rejected') throw lwd.reason;
  return { list, partial };
}

/* Automatische Wahl: Wetter/Rad = nah & ähnliche Höhe, Ski = Höhe passt am besten */
function pickStation(list, elev, mode) {
  if (!list || !list.length) return null;
  const fresh = list.filter(s => isNum(s.t) && (!s.time || Date.now() - s.time < 3 * 3600 * 1000));
  const pool = fresh.length ? fresh : list;
  const dh = s => isNum(elev) && isNum(s.alt) ? Math.abs(s.alt - elev) / 100 : 0;
  const score = s => mode === 'ski' ? dh(s) + s.dist * 0.35 : s.dist + dh(s) * 1.5;
  return pool.slice().sort((a, b) => score(a) - score(b))[0];
}
function stationFor(loc, mode) {
  const L = state.st.list;
  if (!loc || !L || !L.length) return null;
  const want = mode === 'ski' ? loc.stSki : loc.stMain;
  if (want) { const s = L.find(x => stKey(x) === want); if (s) return { s, auto: false }; }
  const elev = mode === 'ski'
    ? (isNum(state.ski.data && state.ski.data.elevation) ? state.ski.data.elevation : skiElev(loc))
    : (isNum(state.main.data && state.main.data.elevation) ? state.main.data.elevation : mainElev(loc));
  const s = pickStation(L, elev, mode);
  return s ? { s, auto: true } : null;
}
const findStation = key => (state.st.list || []).find(s => stKey(s) === key) || null;

function restoreStCache(key) {
  const c = LS.get(ST_CACHE_KEY, null);
  return c && c.key === key && Array.isArray(c.list) ? c : null;
}
async function loadStations(force = false) {
  const loc = currentLoc();
  if (!loc) return;
  const key = `${(+loc.lat).toFixed(3)},${(+loc.lon).toFixed(3)}`;
  const S = state.st;
  if (S.key !== key) {
    const c = restoreStCache(key);
    Object.assign(S, { key, list: c ? c.list : null, ts: c ? c.ts : 0, error: null });
  }
  if (!force && S.list && Date.now() - S.ts < ST_TTL) return;
  if (S.loadingKey === key) return;
  S.loadingKey = key; S.loading = true;
  try {
    const { list, partial } = await nearbyStations(loc, force);
    if (S.key !== key) return;
    const retrySoon = Date.now() - ST_TTL + 60 * 1000;      // ein Dienst fehlte → in ~1 Min. erneut versuchen
    if (partial && S.list && S.list.length > list.length) {
      S.ts = retrySoon; S.error = null;                      // bisherige (vollständigere) Liste behalten
    } else {
      Object.assign(S, { list, ts: partial ? retrySoon : Date.now(), error: null });
      LS.set(ST_CACHE_KEY, { key, ts: S.ts, list });
    }
  } catch (e) {
    if (S.key === key) S.error = e;
  } finally {
    if (S.loadingKey === key) { S.loadingKey = null; S.loading = false; }
    if (S.key === key) render();
  }
}

/* Aufbereitung: aktueller Stundenindex in Ortszeit */
function prep(data) {
  const h = data.hourly, dl = data.daily;
  const nowStr = new Date(Date.now() + (data.utc_offset_seconds || 0) * 1000).toISOString().slice(0, 16);
  let nowIdx = 0;
  for (let i = 0; i < h.time.length; i++) { if (h.time[i] <= nowStr) nowIdx = i; else break; }
  const today = nowStr.slice(0, 10);
  let todayD = dl.time.indexOf(today);
  if (todayD < 0) { todayD = dl.time.findIndex(t => t >= today); if (todayD < 0) todayD = dl.time.length - 1; }
  return { h, dl, nowIdx, nowStr, today, todayD, n: h.time.length, hour: Number(nowStr.slice(11, 13)) };
}
function currentVals(data, P, ts) {
  const o = {};
  for (const k of Object.keys(P.h)) if (k !== 'time') o[k] = P.h[k][P.nowIdx];
  if (data.current && Date.now() - ts < 90 * 60 * 1000) {
    for (const [k, v] of Object.entries(data.current)) if (isNum(v) && k !== 'interval') o[k] = v;
  }
  return o;
}

/* =====================================================================
   UI-Bausteine
   ===================================================================== */
/* Designsprache: flach, klare Kanten, Haarlinien statt Schatten. Hauptansicht randlos (PANEL),
   in Sheets umrandete Kästen (CARD). */
const CARD = 'bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800';
const PANEL = '-mx-4 bg-white dark:bg-zinc-900 border-y border-zinc-200 dark:border-zinc-800';
const GRID = '-mx-4 grid gap-px bg-zinc-200 dark:bg-zinc-800 border-y border-zinc-200 dark:border-zinc-800';
const CELL = 'bg-white dark:bg-zinc-900';
const PRESS = 'active:bg-zinc-100 dark:active:bg-zinc-800 transition-colors';
const LABEL = 'text-[11px] font-bold uppercase tracking-[.14em] text-zinc-500 dark:text-zinc-400';
const SUB = 'text-sm font-medium text-zinc-600 dark:text-zinc-400 leading-snug';
const SPINNER = '<svg class="w-5 h-5 spin" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".25" stroke-width="3"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3"/></svg>';
const CHEVRON = '<span class="ml-auto pl-1 text-base leading-none text-zinc-400 dark:text-zinc-600" aria-hidden="true">›</span>';
const ACCENT = { wetter: 'bg-sky-600', rad: 'bg-emerald-600', ski: 'bg-indigo-600' };

const sectionTitle = (t, extra = '') => `<div class="flex items-center justify-between pt-3">
  <h2 class="flex items-center gap-2 ${LABEL}"><span class="w-3 h-[3px] ${ACCENT[state.tab] || ACCENT.wetter}" aria-hidden="true"></span>${t}</h2>${extra}</div>`;
const hint = t => `<span class="text-[11px] font-semibold text-zinc-400 dark:text-zinc-500">${t}</span>`;

/** Zelle im Haarlinien-Raster; mit info = antippbar (öffnet Detail-Sheet) */
function cell({ label, value, sub = '', accent = '', span = '', info = '', data = '' }) {
  const tag = info ? 'button' : 'div';
  return `<${tag} ${info ? `data-info="${info}" ${data}` : ''} class="${CELL} ${span} px-4 py-3 text-left ${info ? `block w-full ${PRESS}` : ''}">
    <div class="flex items-center ${LABEL}"><span class="truncate">${label}</span>${info ? CHEVRON : ''}</div>
    <div class="mt-1 text-[26px] leading-tight font-black tracking-tight tabular ${accent}">${value}</div>
    ${sub ? `<div class="mt-0.5 text-xs font-medium text-zinc-500 dark:text-zinc-400 leading-snug">${sub}</div>` : ''}
  </${tag}>`;
}
function skeleton(text = 'Lade Wetterdaten …') {
  return `<div class="space-y-3 fade-in" aria-busy="true">
    <div class="-mx-4 h-72 shimmer"></div>
    <div class="-mx-4 h-28 shimmer"></div>
    <div class="-mx-4 h-56 shimmer"></div>
    <p class="flex items-center justify-center gap-2 text-sm font-semibold text-zinc-500 dark:text-zinc-400 pt-2">${SPINNER}${text}</p>
  </div>`;
}
function describeError(e) {
  if (navigator.onLine === false || (e && e.kind === 'offline'))
    return { icon: '📡', title: 'Keine Internetverbindung', msg: 'Bitte WLAN oder mobile Daten prüfen. Sobald du wieder online bist, wird automatisch neu geladen.' };
  if (e && e.kind === 'timeout')
    return { icon: '⏱️', title: 'Zeitüberschreitung', msg: 'Der Wetterdienst Open-Meteo antwortet gerade nicht. Bitte in einem Moment erneut versuchen.' };
  if (e && e.kind === 'http')
    return { icon: '⚠️', title: 'Fehler vom Wetterdienst', msg: `Open-Meteo meldet: ${esc(e.message)}` };
  if (e && e.kind === 'data')
    return { icon: '🧩', title: 'Unvollständige Daten', msg: 'Die Antwort des Wetterdienstes war unvollständig. Bitte erneut versuchen.' };
  if (e && e.kind === 'render')
    return { icon: '🛠️', title: 'Darstellungsfehler', msg: `Die Daten konnten nicht angezeigt werden (${esc(e.message)}).` };
  return { icon: '⚠️', title: 'Verbindung fehlgeschlagen', msg: 'Der Wetterdienst ist nicht erreichbar (Netzwerk, Werbeblocker oder Firewall?). Bitte erneut versuchen.' };
}
function errorCard(e) {
  const d = describeError(e);
  return `<div class="fade-in ${PANEL} border-l-4 !border-l-red-600 px-5 py-6 mt-3">
    <div class="text-4xl mb-2">${d.icon}</div>
    <h2 class="text-xl font-black tracking-tight mb-1">${d.title}</h2>
    <p class="${SUB} mb-4">${d.msg}</p>
    <button data-act="retry" class="px-5 py-3 bg-sky-600 text-white font-bold active:bg-sky-700">Erneut versuchen</button>
    <p class="text-xs font-medium text-zinc-400 mt-3">oder oben nach unten ziehen</p>
  </div>`;
}
function staleBanner(S) {
  if (!S.data) return '';
  const age = Date.now() - S.ts;
  if (S.stale) {
    const d = describeError(S.error);
    return `<div class="fade-in -mx-4 flex items-center gap-3 px-4 py-2.5 bg-amber-100 text-amber-950 dark:bg-amber-950/60 dark:text-amber-100 border-b border-amber-300 dark:border-amber-800">
      <span class="text-xl">${d.icon}</span>
      <div class="flex-1 text-sm font-semibold leading-snug"><b>${d.title}.</b> Daten vom ${dateTime(S.ts)}.</div>
      <button data-act="retry" class="px-3 py-2 text-xs font-black uppercase tracking-wider bg-amber-950 text-amber-50 dark:bg-amber-100 dark:text-amber-950">Neu laden</button>
    </div>`;
  }
  if (age > 3 * 3600 * 1000) return `<div class="-mx-4 px-4 py-2.5 bg-zinc-200 dark:bg-zinc-800 text-sm font-semibold">⏳ Daten vom ${dateTime(S.ts)} – zum Aktualisieren nach unten ziehen.</div>`;
  return '';
}
const footer = S => `<p class="text-center text-[11px] font-medium text-zinc-400 dark:text-zinc-500 pt-4 leading-relaxed">
  Stand ${S.ts ? clock(S.ts) : '–'} · Wetter: <a href="https://open-meteo.com/" target="_blank" rel="noopener" class="underline">Open-Meteo.com</a> (CC BY 4.0)<br>
  Messwerte: <a href="https://avalanche.report/" target="_blank" rel="noopener" class="underline">Lawinenwarndienste Tirol · Südtirol · Trentino</a>, <a href="https://www.geosphere.at/" target="_blank" rel="noopener" class="underline">GeoSphere Austria</a> (CC BY 4.0)<br>
  Alle Empfehlungen ohne Gewähr – Verhältnisse vor Ort prüfen.<br>
  <button data-info="shortcuts" class="mt-1 underline font-semibold">Schnellzugriffe für den Startbildschirm</button></p>`;

function compass(deg, size = 112) {
  const to = isNum(deg) ? (deg + 180) % 360 : 0;
  const ticks = range(0, 16).map(i => {
    const a = i * 22.5 * Math.PI / 180, r1 = i % 4 === 0 ? 37 : 40, r2 = 44;
    return `<line x1="${50 + Math.sin(a) * r1}" y1="${50 - Math.cos(a) * r1}" x2="${50 + Math.sin(a) * r2}" y2="${50 - Math.cos(a) * r2}" stroke-width="${i % 4 === 0 ? 2.5 : 1.2}"/>`;
  }).join('');
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" class="shrink-0" role="img" aria-label="Windrichtung ${dirName(deg)}">
    <circle cx="50" cy="50" r="47" class="fill-zinc-50 dark:fill-zinc-950 stroke-zinc-300 dark:stroke-zinc-700" stroke-width="1.5"/>
    <g class="stroke-zinc-400 dark:stroke-zinc-600">${ticks}</g>
    <text x="50" y="27" text-anchor="middle" font-size="11" font-weight="900" class="fill-red-600 dark:fill-red-400">N</text>
    <text x="76" y="54" text-anchor="middle" font-size="10" font-weight="800" class="fill-zinc-500 dark:fill-zinc-400">O</text>
    <text x="50" y="81" text-anchor="middle" font-size="10" font-weight="800" class="fill-zinc-500 dark:fill-zinc-400">S</text>
    <text x="24" y="54" text-anchor="middle" font-size="10" font-weight="800" class="fill-zinc-500 dark:fill-zinc-400">W</text>
    ${isNum(deg) ? `<g transform="rotate(${to.toFixed(1)} 50 50)">

/* Flache Farbfläche je nach Wetterlage */
function heroColor(code, isDay) {
  if (!isDay) return 'bg-indigo-950';

  if ([71, 73, 75, 77, 85, 86].includes(code)) return 'bg-sky-700';

const HERO_LABEL = 'text-[10px] font-bold uppercase tracking-[.16em] text-white/70';

function renderWeather() {

  const days = range(di, Math.min(di + 7, dl.time.length));

    const left = isNum(tn) ? (tn - wMin) / span * 100 : 0;

    return `<button data-info="day" data-d="${dl.time[i]}" class="w-full text-left flex items-center gap-2.5 px-4 py-3 ${PRESS}" aria-label="${dayLabel(dl.time[i], P.today, true)}: Stundenverlauf">
      <span class="w-[3.6rem] font-bold">${dayLabel(dl.time[i], P.today)}</span>

      <span class="w-8 text-right font-semibold text-zinc-500 dark:text-zinc-400 tabular">${fmtT(tn)}</span>
      <span class="flex-1 h-1.5 bg-zinc-200 dark:bg-zinc-800 relative overflow-hidden">
        <span class="absolute inset-y-0" style="left:${left.toFixed(1)}%;width:${Math.min(100 - left, width).toFixed(1)}%;background:linear-gradient(90deg,${tempColor(tn)},${tempColor(tx)})"></span>
      </span>

  const sunrise = hv(dl, 'sunrise', di), sunset = hv(dl, 'sunset', di);

  return `${staleBanner(S)}

      </div>

    ${cell({ label: 'Bewölkung', value: fmt(c.cloud_cover, ' %'), sub: c.cloud_cover >= 85 ? 'stark bewölkt' : c.cloud_cover >= 40 ? 'wechselnd' : 'meist sonnig', info: 'clouds' })}

}

/* =====================================================================
   TAB 2: RENNRAD
   ===================================================================== */
const LEVEL = [
  { label: 'GO', title: 'Ab aufs Rad!', card: 'bg-emerald-600 text-white', icon: '✅', dot: 'bg-emerald-500', txt: 'text-emerald-700 dark:text-emerald-400' },
  { label: 'BEDINGT', title: 'Fahrbar – mit Einschränkungen', card: 'bg-amber-400 text-zinc-950', icon: '⚠️', dot: 'bg-amber-400', txt: 'text-amber-700 dark:text-amber-400' },
  { label: 'NEIN', title: 'Heute besser Rolle oder Pause', card: 'bg-red-600 text-white', icon: '⛔', dot: 'bg-red-600', txt: 'text-red-700 dark:text-red-400' }
];
const LIGHT_ON = { 2: 'bg-red-500 shadow-[0_0_18px_4px_rgba(239,68,68,.75)]', 1: 'bg-amber-400 shadow-[0_0_18px_4px_rgba(251,191,36,.75)]', 0: 'bg-emerald-400 shadow-[0_0_18px_4px_rgba(52,211,153,.75)]' };
const LIGHT_OFF = { 2: 'bg-red-950', 1: 'bg-amber-950', 0: 'bg-emerald-950' };

function windowStats(h, a, b) {
  const I = range(a, b), g = k => I.map(i => hv(h, k, i));
  const ws = g('wind_speed_10m'), wd = g('wind_direction_10m');
  let x = 0, y = 0;
  ws.forEach((v, j) => { if (isNum(v) && isNum(wd[j])) { const r = wd[j] * Math.PI / 180; x += Math.sin(r) * v; y += Math.cos(r) * v; } });
  const dir = (x || y) ? (Math.atan2(x, y) * 180 / Math.PI + 360) % 360 : avg(wd);
  const t = g('temperature_2m');
  return {
    a, b, tMin: minOf(t), tMax: maxOf(t), tAvg: avg(t), appMin: minOf(g('apparent_temperature')),
    windAvg: avg(ws) ?? 0, windMax: maxOf(ws) ?? 0, gustMax: maxOf(g('wind_gusts_10m')) ?? 0, dir,
    popMax: maxOf(g('precipitation_probability')) ?? 0, precip: sum(g('precipitation')),
    dewAvg: avg(g('dew_point_2m')), rhAvg: avg(g('relative_humidity_2m')), uvMax: maxOf(g('uv_index')),
    cloudAvg: avg(g('cloud_cover')), codes: nums(g('weather_code'))
  };
}

function rateBike(W) {
  const f = [];
  let l = 0;
  if (W.gustMax > 55 || W.windMax > 40) l = 2; else if (W.gustMax > 38 || W.windMax > 25) l = 1;
  f.push({ icon: '💨', name: 'Wind', level: l, text: `Böen bis ${fmt(W.gustMax)} km/h` });

  const storm = W.codes.some(c => c >= 95), ice = W.codes.some(c => [56, 57, 66, 67].includes(c));
  let r = 0;
  if (storm || ice || W.popMax >= 60 || W.precip >= 2) r = 2; else if (W.popMax >= 30 || W.precip >= 0.3) r = 1;
  f.push({ icon: '🌧️', name: 'Regen', level: r, text: storm ? 'Gewittergefahr!' : ice ? 'Gefrierender Regen!' : `Risiko ${fmt(W.popMax)} %` });

  let t = 0;
  if (W.tMin < 2 || W.tMax > 36) t = 2; else if (W.tMin < 7 || W.tMax > 31) t = 1;
  f.push({ icon: '🌡️', name: 'Temperatur', level: t, text: W.tMin < 2 ? `${fmt(W.tMin, ' °C')} – Glätte!` : W.tMax > 31 ? `${fmt(W.tMax, ' °C')} – Hitze` : `${fmt(W.tMin)} bis ${fmt(W.tMax, ' °C')}` });

  const level = Math.max(l, r, t);
  const worst = f.filter(x => x.level === level && level > 0).map(x => x.name);
  const summary = level === 0 ? 'Wenig Wind, trocken und angenehme Temperaturen.' : `${level === 2 ? 'Kritisch' : 'Achtung'}: ${worst.join(' & ')}`;
  return { level, factors: f, summary };
}

/* Fahrt-Windchill: JAG/TI-Formel (≤ 10 °C), darüber lineare Näherung */
function rideChill(T, v) {
  if (!isNum(T)) return null;
  if (T <= 10 && v >= 4.8) { const p = Math.pow(v, 0.16); return 13.12 + 0.6215 * T - 11.37 * p + 0.3965 * T * p; }
  return T - 0.11 * v;
}

function clothing(W) {
  const vEff = 25 + 0.5 * (W.windAvg || 0);        // ~25 km/h Fahrtwind + halber Umgebungswind
  const eff = rideChill(W.tMin, vEff), effMax = rideChill(W.tMax, vEff);
  const items = [];
  let head;
  if (!isNum(eff)) { head = 'Keine Temperaturdaten'; }
  else if (eff >= 21) { head = 'Kurz/Kurz'; items.push(['👕', 'Kurzarmtrikot & kurze Trägerhose']); }
  else if (eff >= 16) { head = 'Kurz/Kurz + Weste'; items.push(['👕', 'Kurzarmtrikot & kurze Trägerhose'], ['🦺', 'Windweste für Abfahrten in die Trikottasche']); }
  else if (eff >= 12) { head = 'Kurz/Kurz + Armlinge'; items.push(['👕', 'Kurzarmtrikot & kurze Trägerhose'], ['💪', 'Armlinge & Windweste mitnehmen'], ['🦵', 'Knielinge optional']); }
  else if (eff >= 8) { head = 'Langarm + Knielinge'; items.push(['🧥', 'Langarmtrikot (oder Kurzarm + Armlinge)'], ['🦵', 'Knielinge oder ¾-Hose'], ['🦺', 'Windweste'], ['🧤', 'Dünne Langfinger-Handschuhe']); }
  else if (eff >= 3) { head = 'Lang/Lang + Windjacke'; items.push(['🎽', 'Funktionsunterhemd + Thermo-Langarmtrikot'], ['👖', 'Lange Thermo-Trägerhose'], ['🧥', 'Winddichte Jacke (Softshell)'], ['🧤', 'Langfinger-Handschuhe'], ['👟', 'Überschuhe gegen Fahrtwind'], ['🧢', 'Stirnband / Unterhelmmütze']); }
  else if (eff >= -3) { head = 'Winter-Outfit'; items.push(['🧥', 'Winterjacke, winddicht + warmes Unterhemd'], ['👖', 'Thermo-Trägerhose lang'], ['🧤', 'Winterhandschuhe'], ['👟', 'Neopren-Überschuhe'], ['🧣', 'Mütze & Buff']); }
  else { head = 'Volle Winterausrüstung'; items.push(['🧥', 'Winterjacke, Thermo-Trägerhose, Neopren-Überschuhe, Lobster-Handschuhe'], ['🧊', 'Glättegefahr – besser Rolle, Gravel/MTB oder Indoor']); }

  if (W.popMax >= 50 || W.precip >= 0.5) { head += ' + Regenjacke'; items.unshift(['☔', 'Regenjacke & Überschuhe (wasserdicht)']); items.push(['🛡️', 'Schutzbleche und Rücklicht montieren']); }
  else if (W.popMax >= 25) items.push(['🎒', 'Packbare Regenjacke in die Trikottasche']);
  if (isNum(effMax) && isNum(eff) && effMax - eff >= 6) items.push(['🔄', `Es wird ${fmt(effMax - eff)} °C wärmer: Arm-/Beinlinge zum Ausziehen wählen`]);
  if (isNum(W.uvMax) && W.uvMax >= 5) items.push(['🧴', `UV bis ${fmt(W.uvMax)}: Sonnencreme LSF 50 & Sonnenbrille`]);
  if (isNum(W.tMax) && W.tMax >= 27) items.push(['🥤', 'Hitze: 2 große Flaschen + Elektrolyte, helle Kleidung']);
  if (W.gustMax >= 40) items.push(['🌬️', 'Starke Böen: keine Hochprofil-Felgen, Abfahrten vorsichtig']);
  return { head, eff, vEff, items };
}
function dewInfo(dp, t) {
  if (!isNum(dp)) return '';
  if (isNum(t) && t - dp < 2.5) return 'Taupunktnah: Nebel & nasse Straße möglich';
  return dp < 10 ? 'Trocken & angenehm' : dp < 16 ? 'Angenehm' : dp < 20 ? 'Schwül – mehr trinken' : 'Sehr schwül – Hitzestress';
}

  ${sectionTitle('Bekleidung')}

/* =====================================================================
   TAB 3: SKI & WACHS
   ===================================================================== */
/* Swix-Gleitwachse (fluorfrei, „Pro by Swix“). Gleiche Nummer = gleicher Temperaturbereich in allen Linien:
   PS = Performance Speed (Training/Alltag), HS = High Speed (schneller), TS = Top Speed (Rennen).
   Bereiche laut Swix-Packungsangaben, Bügeltemperaturen ca. – Angabe auf der Packung hat Vorrang. */
const WAX = [
  { code: '5', color: 'Türkis', label: 'Sehr kalt', range: '−10 bis −18 °C', card: 'bg-teal-600 text-white', swatch: 'bg-teal-600', iron: '150 °C', desc: 'Sehr hartes Wachs für kalten, trockenen und aggressiven Schnee.' },
  { code: '6', color: 'Blau', label: 'Kalt', range: '−6 bis −12 °C', card: 'bg-blue-600 text-white', swatch: 'bg-blue-600', iron: '145 °C', desc: 'Hartes Wachs für kalten Pulver- und Winterschnee.' },
  { code: '7', color: 'Violett', label: 'Winter-Allround', range: '−2 bis −8 °C', card: 'bg-violet-600 text-white', swatch: 'bg-violet-600', iron: 'ca. 140 °C', desc: 'Das Allround-Wachs für typische Wintertage mit leichtem Frost.' },
  { code: '8', color: 'Rot', label: 'Um 0 °C', range: '−4 bis +4 °C', card: 'bg-red-600 text-white', swatch: 'bg-red-600', iron: '130 °C', desc: 'Mittelweiches Wachs für Temperaturen rund um den Gefrierpunkt.' },
  { code: '10', color: 'Gelb', label: 'Nass & warm', range: '0 bis +10 °C', card: 'bg-yellow-400 text-zinc-950', swatch: 'bg-yellow-400', iron: '120 °C', desc: 'Weiches, stark wasserabweisendes Wachs für Nass-, Sulz- und Frühjahrsschnee.' }
];
const waxIdx = t => t < -12 ? 0 : t < -7 ? 1 : t < -3 ? 2 : t <= 2 ? 3 : 4;
const waxName = w => `PS${w.code} ${w.color}`;
/* Skala −20…+8 °C, Grenzen −12 / −7 / −3 / +2 °C */
const WAX_SCALE = [['bg-teal-600', 28.57], ['bg-blue-600', 17.86], ['bg-violet-600', 14.29], ['bg-red-600', 17.86], ['bg-yellow-400', 21.42]];
function waxProducts(w) {
  return [
    ['🏋️', 'Training & Alltag', `Swix PS${w.code} ${w.color}`, 'Performance Speed – fluorfreies Heißwachs, robust und günstig. Die Standardwahl.'],
    ['🚀', 'Mehr Gleiten', `Swix HS${w.code} ${w.color}`, 'High Speed – gleicher Temperaturbereich, schneller. Für ambitionierte Tage und Hobbyrennen.'],
    ['🏁', 'Rennen', `Swix TS${w.code}`, 'Top Speed – Rennwachs als Block („Black“), Liquid oder Turbo-Topping (TST).'],
    ['⚡', 'Schnell & universal', 'Swix F4 Glidewax', 'Flüssig oder Paste für alle Temperaturen – ohne Bügeleisen, ideal für unterwegs oder die Mittagspause.']
  ];
}
const SNOW_TYPES = [['auto', 'Auto'], ['new', 'Neuschnee'], ['old', 'Altschnee'], ['wet', 'Nass/Sulz'], ['man', 'Kunstschnee']];
const SNOW_NAMES = { new: 'Neuschnee', old: 'Altschnee', wet: 'Nass/Sulz', man: 'Kunstschnee' };

function skiDayStats(P, date, fromIdx) {
  const h = P.h;
  const i9 = h.time.indexOf(`${date}T09:00`), i16 = h.time.indexOf(`${date}T16:00`);
  if (i9 < 0 || i16 < 0) return null;
  let a = i9; const b = i16 + 1;
  if (isNum(fromIdx) && fromIdx > a && fromIdx < b) a = fromIdx;
  const I = range(a, b), g = k => I.map(i => hv(h, k, i));
  const eve = h.time.indexOf(`${addDays(date, -1)}T17:00`);
  const codes = nums(g('weather_code'));
  return {
    date, a, b,
    tMin: minOf(g('temperature_2m')), tMax: maxOf(g('temperature_2m')), tAvg: avg(g('temperature_2m')),
    rhAvg: avg(g('relative_humidity_2m')), cloudAvg: avg(g('cloud_cover')),
    gustMax: maxOf(g('wind_gusts_10m')), windAvg: avg(g('wind_speed_10m')),
    snowNew: sum(range(eve >= 0 ? eve : Math.max(0, i9 - 16), b).map(i => hv(h, 'snowfall', i))),
    rainSum: sum(g('rain')) + sum(g('showers')), fzlAvg: avg(g('freezing_level_height')),
    fog: codes.some(c => c === 45 || c === 48), snowing: codes.some(c => [73, 75, 86].includes(c))
  };
}
function skiScore(s) {
  let v = 3;
  if (s.snowNew >= 15) v += 1.5; else if (s.snowNew >= 5) v += 0.5;
  if (isNum(s.cloudAvg)) { if (s.cloudAvg <= 30) v += 1; else if (s.cloudAvg >= 85) v -= 1; }
  if (s.gustMax >= 75) v -= 2; else if (s.gustMax >= 60) v -= 1; else if (s.gustMax >= 45) v -= 0.5;
  if (s.rainSum >= 1) v -= 1.5;
  if (s.tMin <= -18) v -= 1;
  if (s.fog) v -= 1;
  if (s.snowing) v -= 0.5;
  return clamp(Math.round(v), 1, 5);
}
const SCORE_TXT = ['', 'Schlecht', 'Mäßig', 'Gut', 'Sehr gut', 'Traumtag'];

function detectSnow(P, a, b) {
  const h = P.h;
  const snow48 = sum(range(Math.max(0, a - 48), b).map(i => hv(h, 'snowfall', i)));
  const rain24 = sum(range(Math.max(0, a - 24), b).map(i => (hv(h, 'rain', i) || 0) + (hv(h, 'showers', i) || 0)));
  const tMax = maxOf(range(a, b).map(i => hv(h, 'temperature_2m', i)));
  if ((isNum(tMax) && tMax > 1.5) || rain24 >= 0.5) return { type: 'wet', why: rain24 >= 0.5 ? `Regen (${fmt(rain24, ' mm', 1)}) in 24 h` : `Plusgrade bis ${fmt(tMax, ' °C')}` };
  if (snow48 >= 3) return { type: 'new', why: `${fmt(snow48, ' cm')} Neuschnee in 48 h` };
  return { type: 'old', why: snow48 >= 0.5 ? `nur ${fmt(snow48, ' cm')} Neuschnee in 48 h` : 'kein Neuschnee in 48 h' };
}

function waxAdvice(W, snowType) {
  const notes = [];
  let tRef = W.tAvg;
  if (snowType === 'new') { tRef -= 2; notes.push(['❄️', 'Neuschnee: scharfkantige Kristalle sind abrasiv – Referenz 2 °C kälter, also eher härteres Wachs.']); }
  else if (snowType === 'man') { tRef -= 3; notes.push(['🏭', 'Kunstschnee ist sehr aggressiv: härteres Wachs wählen, Belag & Kanten öfter prüfen.']); }
  else if (snowType === 'old') { tRef += 1; notes.push(['🧊', 'Altschnee (umgewandelt, oft verschmutzt): Graphit-/Antistatik-Additiv hält Schmutz vom Belag fern.']); }
  else if (snowType === 'wet') { tRef = Math.max(tRef, isNum(W.tMax) ? W.tMax : tRef, -1); notes.push(['💧', 'Nasser Schnee: freies Wasser erzeugt Saugeffekt – weiches, wasserabweisendes Wachs.']); }
  let idx = waxIdx(tRef);
  if (snowType === 'wet' && idx < 3) idx = 3;
  const cat = WAX[idx];

  const iMin = waxIdx(W.tMin), iMax = waxIdx(W.tMax);
  const mix = iMin !== iMax
    ? `Temperaturspanne ${fmt(W.tMin)} bis ${fmt(W.tMax, ' °C')} deckt <b>${waxName(WAX[iMin])}</b> und <b>${waxName(WAX[iMax])}</b> ab: das härtere ${waxName(WAX[Math.min(iMin, idx)])} als Basis einbügeln, für den wärmeren Nachmittag dünn ${waxName(WAX[Math.max(iMax, idx)])} darüber (oder beide 50/50 mischen). Unterwegs: <b>Swix F4 Glidewax</b> als schnelles Topping.`
    : null;

  const rh = W.rhAvg;
  let hum;
  if (isNum(rh) && rh > 75) hum = { cls: 'bg-amber-100 text-amber-950 dark:bg-amber-900/40 dark:text-amber-50 border-amber-300 dark:border-amber-700', icon: '💦', title: `Hohe Luftfeuchtigkeit · ${fmt(rh, ' %')} rF`, text: `Feuchte Luft bremst: statt PS die schnellere <b>Swix HS${cat.code}</b> wählen, gründlich abziehen und auspolieren. Für Rennen <b>Top Speed (TS${cat.code})</b>. Alle aktuellen Swix-Wachse sind fluorfrei – alte HF-/LF-Wachse sind seit 2023/24 im Rennsport verboten.` };
  else if (isNum(rh) && rh >= 50) hum = { cls: 'bg-sky-50 text-sky-950 dark:bg-sky-950/50 dark:text-sky-50 border-sky-200 dark:border-sky-800', icon: '🌤️', title: `Normale Luftfeuchtigkeit · ${fmt(rh, ' %')} rF`, text: `Das Standard-Heißwachs <b>Swix PS${cat.code}</b> reicht völlig aus.` };
  else hum = { cls: 'bg-zinc-100 text-zinc-900 dark:bg-zinc-800 dark:text-zinc-50 border-zinc-300 dark:border-zinc-600', icon: '🏜️', title: `Trockene Luft · ${fmt(rh, ' %')} rF`, text: `Hartes Heißwachs <b>Swix PS${cat.code}</b> ohne Topping. Kalter Trockenschnee lädt den Belag statisch auf – gut ausbürsten (Messing → Nylon → Rosshaar).` };

  const wetish = snowType === 'wet' || tRef > 2 || (isNum(rh) && rh > 85 && isNum(W.tMax) && W.tMax > 0);
  let struct;
  if (wetish) struct = { name: 'Grob', lvl: 3, text: 'Grobe, gebrochene oder Kreuzstruktur (≥ 1 mm) – bricht den Wasserfilm und verhindert den Saugeffekt bei Nassschnee. Tipp: Struktur mit Rillwalze nachziehen.' };
  else if (tRef < -8) struct = { name: 'Fein', lvl: 1, text: 'Feine, lineare Struktur (≈ 0,25–0,5 mm) – minimale Reibung auf kaltem, trockenem Schnee mit scharfen Kristallen.' };
  else if (tRef <= 0) struct = { name: 'Fein bis mittel', lvl: 2, text: 'Feine bis mittlere lineare Struktur (≈ 0,5 mm) – universell für normalen Winterschnee.' };
  else struct = { name: 'Mittel', lvl: 2, text: 'Mittlere Struktur (≈ 0,75 mm). Wird der Schnee nachmittags nass, zusätzlich grob nachstrukturieren.' };

  if (isNum(W.cloudAvg) && W.cloudAvg < 35 && isNum(W.tMax) && W.tMax > -3 && idx < 4) notes.push(['☀️', `Sonne: Der Schnee wird ab Mittag weich – Swix F4 Glidewax (Paste) oder PS${WAX[Math.min(4, idx + 1)].code}-Liquid als Topping in die Jackentasche.`]);
  if (snowType === 'new' && isNum(rh) && rh > 80) notes.push(['🧽', 'Feuchter Neuschnee bremst stark – Wachs sehr gründlich abziehen & auspolieren.']);
  if (isNum(tRef) && tRef < -18) notes.push(['🥶', 'Extreme Kälte unter −18 °C: <b>Swix PS Polar</b> (ca. −14 bis −32 °C) ist noch härter als PS5.']);
  return { cat, idx, tRef, mix, hum, struct, notes, products: waxProducts(cat) };
}

function waxScale(tMin, tMax, tRef) {
  const lo = -20, hi = 8, pct = t => (clamp(t, lo, hi) - lo) / (hi - lo) * 100;
  const band = isNum(tMin) && isNum(tMax)
    ? `<div class="absolute -top-1 -bottom-1 border-[3px] border-zinc-900 dark:border-white" style="left:${pct(tMin).toFixed(1)}%;width:${Math.max(1.5, pct(tMax) - pct(tMin)).toFixed(1)}%"></div>` : '';
  const marker = isNum(tRef)
    ? `<div class="absolute -top-4 -translate-x-1/2 text-zinc-900 dark:text-white text-xs leading-none" style="left:${pct(tRef).toFixed(1)}%">▼</div>` : '';
  const tick = (t, l) => `<span class="absolute -translate-x-1/2" style="left:${pct(t).toFixed(1)}%">${l}</span>`;
  return `<div class="pt-4">
    <div class="relative h-4">
      <div class="absolute inset-0 flex">${WAX_SCALE.map(([cls, w]) => `<div class="${cls}" style="width:${w}%"></div>`).join('')}</div>${band}${marker}
    </div>
    <div class="relative h-4 mt-1.5 text-[11px] font-bold text-zinc-500 dark:text-zinc-400 tabular">
      ${tick(-20, '−20°')}${tick(-12, '−12°')}${tick(-7, '−7°')}${tick(-3, '−3°')}${tick(2, '+2°')}${tick(8, '+8°')}
    </div>
    <div class="relative h-4 text-[10px] font-black text-zinc-400 dark:text-zinc-500">
      ${[[-16, 'PS5'], [-9.5, 'PS6'], [-5, 'PS7'], [-0.5, 'PS8'], [5, 'PS10']].map(([t, l]) => tick(t, l)).join('')}
    </div>
  </div>`;
}

/* Tal/Berg-Umschalter; Gipfelhöhe per Schieberegler (statt Plus/Minus-Knöpfen) */

function skiToggle(loc) {

      <div class="flex justify-between text-[10px] font-bold text-zinc-400 dark:text-zinc-500 tabular -mt-1"><span>${fmt(BERG_MIN)} m</span><span>${fmt(BERG_MAX)} m</span></div>
    </div>` : ''}
  </section>`;
}

function renderSki() {
  const loc = currentLoc();
  const S = state.ski;
  const toggle = skiToggle(loc);
  lastWax = null;
  if (!S.data) return toggle + (S.error ? errorCard(S.error) : skeleton('Lade Bergwetter …'));
  const d = S.data, P = prep(d), h = P.h, i0 = P.nowIdx, n = P.n;
  const c = currentVals(d, P, S.ts);
  const elevUsed = isNum(d.elevation) ? d.elevation : skiElev(loc);
  const stc = stationFor(loc, 'ski');

  /* --- Jetzt-Werte --- */
  const snowPast = sum(range(Math.max(0, i0 - 23), i0 + 1).map(i => hv(h, 'snowfall', i)));
  const snowNext = sum(range(i0 + 1, Math.min(n, i0 + 25)).map(i => hv(h, 'snowfall', i)));
  const fzl = hv(h, 'freezing_level_height', i0);
  let fzSub = 'keine Daten', fzCls = '';
  if (isNum(fzl)) {
    const diff = fzl - elevUsed;
    if (fzl < 150) fzSub = 'Frost bis ins Tal';
    else if (diff > 300) { fzSub = `${fmt(diff)} m über dir – Tauwetter`; fzCls = 'text-red-600 dark:text-red-400'; }
    else if (diff >= -300) { fzSub = 'nahe deiner Höhe – um 0 °C'; fzCls = 'text-amber-600 dark:text-amber-400'; }
    else { fzSub = `${fmt(-diff)} m unter dir – Schnee bleibt kalt`; fzCls = 'text-emerald-700 dark:text-emerald-400'; }
  }
  const cloud = c.cloud_cover, low = hv(h, 'cloud_cover_low', i0), vis = hv(h, 'visibility', i0);
  let sight;
  if (c.weather_code === 45 || c.weather_code === 48 || (isNum(vis) && vis < 1000)) sight = { lvl: 2, icon: '🌫️', text: 'Nebel', sub: 'Whiteout-Gefahr' };
  else if ((hv(h, 'snowfall', i0) || 0) >= 0.5 || (isNum(vis) && vis < 4000)) sight = { lvl: 2, icon: '🌨️', text: 'Schlecht', sub: 'Schneefall' };
  else if (isNum(cloud) && cloud >= 85) sight = { lvl: 1, icon: '☁️', text: 'Diffus', sub: 'Flat Light' };
  else if (isNum(cloud) && cloud >= 50) sight = { lvl: 1, icon: '⛅', text: 'Wechselnd', sub: `Wolken ${fmt(cloud, ' %')}` };
  else sight = { lvl: 0, icon: '😎', text: 'Gut', sub: `Wolken ${fmt(cloud, ' %')}` };
  const sightCls = ['text-emerald-700 dark:text-emerald-400', 'text-amber-600 dark:text-amber-400', 'text-red-600 dark:text-red-400'][sight.lvl];
  const hochnebel = state.skiMode === 'tal' && isNum(low) && low >= 70;

  const gust = c.wind_gusts_10m;
  const lift = !isNum(gust) ? null
    : gust >= 80 ? { cls: 'bg-red-600 text-white', t: '🚫 Sturm – Liftsperren wahrscheinlich' }
    : gust >= 60 ? { cls: 'bg-red-600 text-white', t: '⚠️ Exponierte Lifte evtl. geschlossen' }
    : gust >= 40 ? { cls: 'bg-amber-400 text-zinc-950', t: '🌬️ Windig – Windchill beachten' }
    : { cls: 'bg-emerald-600 text-white', t: '✅ Ruhige Verhältnisse am Lift' };
  const depth = hv(h, 'snow_depth', i0);
  const hs = stc && isNum(stc.s.hs) ? { v: stc.s.hs, sub: `gemessen · ${esc(stc.s.name)}` } : (isNum(depth) ? { v: depth * 100, sub: 'Modell (Schätzung)' } : null);

  /* --- Skitags-Planer --- */
  const dates = range(0, 5).map(k => addDays(P.today, k));
  const stats = dates.map((dt, k) => skiDayStats(P, dt, k === 0 ? i0 : null));
  let sel = state.skiDay != null ? state.skiDay : (P.hour >= 16 ? 1 : 0);
  if (!stats[sel]) sel = Math.max(0, stats.findIndex(Boolean));
  const SD = stats[sel];
  const stars = sc => `<span class="text-amber-500" aria-label="${sc} von 5">${'★'.repeat(sc)}<span class="text-zinc-300 dark:text-zinc-700">${'★'.repeat(5 - sc)}</span></span>`;
  const days = stats.map((s, k) => {
    if (!s) return '';
    const di = P.dl.time.indexOf(s.date), ww = wmo(hv(P.dl, 'weather_code', di), 1), sc = skiScore(s), on = k === sel;
    return `<button data-act="skiday" data-v="${k}" aria-pressed="${on}" class="relative snap-start shrink-0 w-[5.25rem] py-3 text-center ${on ? 'bg-indigo-50 dark:bg-indigo-950/50' : PRESS}">
      ${on ? '<span class="absolute inset-x-0 top-0 h-[3px] bg-indigo-600"></span>' : ''}
      <div class="text-xs font-black uppercase tracking-wider ${on ? '' : 'text-zinc-500 dark:text-zinc-400'}">${dayLabel(s.date, P.today)}</div>
      <div class="text-3xl my-1 leading-none">${ww.icon}</div>
      <div class="text-xs leading-none tracking-tighter">${stars(sc)}</div>
      <div class="text-sm font-black tabular mt-1.5">${fmt(s.tMin)}/${fmtT(s.tMax)}</div>
      <div class="text-[11px] font-bold text-sky-700 dark:text-sky-400 tabular">${fmt(s.snowNew)} cm</div>
    </button>`;
  }).join('');

  /* --- Skiwachs-Berater (Details im Info-Sheet) --- */
  let waxHtml = '';
  if (SD) {
    const det = detectSnow(P, SD.a, SD.b);
    const st = state.snowType === 'auto' ? det.type : state.snowType;
    const A = waxAdvice(SD, st);
    let measHtml = '', meas = null;
    if (sel === 0 && stc && isNum(stc.s.t)) {
      const s = stc.s;
      let hintTxt = '';
      if (isNum(s.alt) && Math.abs(s.alt - elevUsed) <= 400 && isNum(c.temperature_2m)) {
        const diff = s.t + (s.alt - elevUsed) * 0.0065 - c.temperature_2m;   // auf gleiche Höhe umgerechnet (−0,65 °C/100 m)
        if (diff >= 2 && A.idx < 4) hintTxt = ` Gemessen ist es <b>${fmt(diff)} °C wärmer</b> als vorhergesagt – im Zweifel eine Stufe wärmer: <b>${waxName(WAX[A.idx + 1])}</b>.`;
        else if (diff <= -2 && A.idx > 0) hintTxt = ` Gemessen ist es <b>${fmt(-diff)} °C kälter</b> als vorhergesagt – im Zweifel eine Stufe kälter: <b>${waxName(WAX[A.idx - 1])}</b>.`;
        else hintTxt = ' Messung und Vorhersage passen gut zusammen.';
      }
      meas = { s, hint: hintTxt };
      measHtml = `<button data-info="station" data-sid="${esc(stKey(s))}" data-mode="ski" class="block w-full text-left border-l-[3px] border-emerald-600 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-950 dark:text-emerald-50 px-3.5 py-3 active:bg-emerald-100 dark:active:bg-emerald-950">
        <div class="flex items-center text-[11px] font-bold uppercase tracking-[.14em] text-emerald-800 dark:text-emerald-300">Gemessen · ${esc(s.name)} · ${fmt(s.alt)} m${CHEVRON}</div>
        <div class="text-sm font-medium mt-1 leading-snug">Luft <b>${fmt(s.t, ' °C', 1)}</b>${isNum(s.oft) ? ` · Schnee-Oberfläche <b>${fmt(s.oft, ' °C', 1)}</b>` : ''} (${ago(s.time)}).${hintTxt}</div>
      </button>`;

const SRC_NAME = { lwd: 'Lawinenwarndienst', gs: 'GeoSphere Austria' };
function ago(ts) {
  if (!ts) return 'Zeit unbekannt';
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'gerade eben';
  if (m < 60) return `vor ${m} Min.`;
  if (m < 36 * 60) return `vor ${Math.round(m / 60)} Std.`;
  return dateTime(ts);
}
const signed = (v, unit = '', dec = 0) => isNum(v) ? (v > 0 ? '+' : '') + fmt(v, unit, dec) : '–';

function stationCard(loc, mode, fcT, fcElev) {
  const S = state.st;
  const head = right => `<div class="flex items-center justify-between gap-2 px-4 pt-3"><div class="flex items-center gap-1.5 ${LABEL}"><span class="w-1.5 h-1.5 bg-emerald-500"></span>Live-Messung</div>${right || ''}</div>`;
  const ch = stationFor(loc, mode);
  if (!ch) {
    if (!S.list && !S.error) return `<section class="${PANEL} pb-3">${head()}<div class="h-12 mx-4 mt-2 shimmer"></div></section>`;
    return `<section class="${PANEL} pb-3">${head(S.error ? `<button data-act="st-retry" class="text-[11px] font-black uppercase tracking-wider text-sky-700 dark:text-sky-400 px-2 py-1 -mr-2">Neu laden</button>` : '')}
      <p class="${SUB} px-4 mt-1.5">${S.error ? 'Die Stationsdaten sind gerade nicht erreichbar.' : `Keine Messstation im Umkreis von ${ST_RADIUS} km (Messnetze: Tirol, Südtirol, Trentino und ganz Österreich).`}</p></section>`;
  }
  const s = ch.s;
  const chips = [
    (isNum(s.ws) || isNum(s.wg)) ? ['Wind', `${fmt(s.ws)}${isNum(s.wg) ? `<span class="text-xs font-bold text-zinc-400">/${fmt(s.wg)}</span>` : ''}`, 'km/h'] : null,
    isNum(s.hs) ? ['Schnee', fmt(s.hs), `cm${isNum(s.hs24) && Math.abs(s.hs24) >= 1 ? ` · ${signed(s.hs24)} in 24 h` : ''}`] : null,
    isNum(s.oft) ? ['Oberfläche', fmt(s.oft, '°', 1), 'Schnee'] : (isNum(s.rh) ? ['Feuchte', fmt(s.rh), '%'] : null)
  ].filter(Boolean);
  let cmp = '';
  if (isNum(s.t) && isNum(fcT)) {
    const near = isNum(s.alt) && isNum(fcElev) && Math.abs(s.alt - fcElev) <= 250;
    const diff = near ? s.t - fcT : null;
    cmp = `<div class="border-t border-zinc-200 dark:border-zinc-800 px-4 py-2 text-xs font-medium text-zinc-500 dark:text-zinc-400">Vorhersage für ${fmt(fcElev)} m: <b class="text-zinc-800 dark:text-zinc-200 tabular">${fmt(fcT, ' °C', 1)}</b>${isNum(diff) && Math.abs(diff) >= 1.5 ? ` · Station <b class="text-zinc-800 dark:text-zinc-200">${fmt(Math.abs(diff), ' °C', 1)} ${diff > 0 ? 'wärmer' : 'kälter'}</b>` : ''}</div>`;
  }
  return `<section class="${PANEL} fade-in">
    ${head(`<button data-info="stations" data-mode="${mode}" class="text-[11px] font-black uppercase tracking-wider text-sky-700 dark:text-sky-400 px-2 py-1 -mr-2">Wechseln</button>`)}
    <button data-info="station" data-sid="${esc(stKey(s))}" data-mode="${mode}" class="w-full text-left px-4 pt-1 pb-3 flex items-center gap-4 ${PRESS}" aria-label="Details zur Station ${esc(s.name)}">
      <div class="text-[44px] leading-none font-black tracking-tighter tabular shrink-0">${fmtT(s.t)}</div>
      <div class="min-w-0 flex-1">
        <div class="font-bold truncate">${esc(s.name)}</div>
        <div class="text-xs font-medium text-zinc-500 dark:text-zinc-400 truncate">${fmt(s.alt)} m · ${fmt(s.dist, ' km', s.dist < 10 ? 1 : 0)} · ${ago(s.time)}</div>
        <div class="text-[11px] font-medium text-zinc-400 dark:text-zinc-500 truncate">${ch.auto ? 'automatisch gewählt' : '★ von dir gewählt'} · ${SRC_NAME[s.src]}</div>
      </div>
      ${CHEVRON}
    </button>
    ${chips.length ? `<div class="grid grid-cols-3 border-t border-zinc-200 dark:border-zinc-800 divide-x divide-zinc-200 dark:divide-zinc-800">${chips.map(([l, v, u]) => `<div class="px-4 py-2">
      <div class="text-[10px] font-bold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">${l}</div>
      <div class="text-lg font-black tabular leading-tight">${v}</div>
      <div class="text-[10px] font-semibold text-zinc-400 dark:text-zinc-500 truncate">${u}</div></div>`).join('')}</div>` : ''}
    ${cmp}
  </section>`;
}

/* Kleines Liniendiagramm (SVG) mit optionalen Balken (z. B. Niederschlag) */
function lineChart(labels, vals, { cls = 'stroke-orange-500', unit = '°', dec = 0, bars = null, barCls = 'fill-sky-500' } = {}) {
  const n = vals.length, v = nums(vals);
  if (n < 2 || v.length < 2) return '';
  const W = 320, H = 136, L = 16, R = 16, T = 20, B = 24;
  const vMax = Math.max(...v), vMin = Math.min(...v);
  let lo = vMin, hi = vMax;
  if (hi - lo < 1) { hi += 0.5; lo -= 0.5; }
  const x = i => L + i * (W - L - R) / (n - 1), y = t => T + (hi - t) / (hi - lo) * (H - T - B);
  const segs = []; let cur = [];
  vals.forEach((t, i) => { if (isNum(t)) cur.push(`${x(i).toFixed(1)},${y(t).toFixed(1)}`); else if (cur.length) { segs.push(cur); cur = []; } });
  if (cur.length) segs.push(cur);
  let barSvg = '';
  if (bars) {
    const bm = Math.max(0.5, ...nums(bars)), bw = Math.max(2, (W - L - R) / n - 2);
    barSvg = bars.map((b, i) => isNum(b) && b > 0 ? `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${(H - B - b / bm * 36).toFixed(1)}" width="${bw.toFixed(1)}" height="${(b / bm * 36).toFixed(1)}" rx="1.5" class="${barCls}" opacity=".6"/>` : '').join('');
  }
  const step = Math.max(1, Math.ceil(n / 8));
  const lab = labels.map((l, i) => i % step === 0 ? `<text x="${x(i).toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="10" font-weight="700" class="fill-zinc-500 dark:fill-zinc-400">${esc(l)}</text>` : '').join('');
  const iHi = vals.indexOf(vMax), iLo = vals.indexOf(vMin);
  const mark = (i, above) => `<text x="${clamp(x(i), 18, W - 18).toFixed(1)}" y="${(y(vals[i]) + (above || y(vals[i]) + 15 > H - B - 2 ? -7 : 15)).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="900" class="fill-zinc-800 dark:fill-zinc-100">${fmt(vals[i], unit, dec)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="Verlauf">
    ${barSvg}${segs.map(sg => `<polyline points="${sg.join(' ')}" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="${cls}"/>`).join('')}
    ${mark(iHi, true)}${iLo !== iHi ? mark(iLo, false) : ''}${lab}</svg>`;
}

const slotOf = p => (p.slot === 'ski' ? state.ski : state.main);
const hourRange = (P, a, b) => range(Math.max(0, a), Math.min(P.n, b));
const hh = t => t.slice(11, 13);

function beaufort(v) {
  if (!isNum(v)) return '–';
  const B = [[2, 'Windstille'], [6, 'leiser Zug'], [12, 'leichte Brise'], [20, 'schwache Brise'], [29, 'mäßige Brise'], [39, 'frische Brise'], [50, 'starker Wind'], [62, 'steifer Wind'], [75, 'stürmischer Wind'], [89, 'Sturm'], [103, 'schwerer Sturm'], [118, 'orkanartiger Sturm']];
  for (let i = 0; i < B.length; i++) if (v < B[i][0]) return `Bft ${i} · ${B[i][1]}`;
  return 'Bft 12 · Orkan';
}

      body: `<div class="${CARD} p-4 flex items-center gap-4"><div class="text-6xl" aria-hidden="true">${w.icon}</div>
        <div><div class="text-5xl font-black tabular leading-none">${fmtT(g('temperature_2m'))}</div><div class="font-extrabold text-lg mt-1">${esc(w.text)}</div>
        <div class="${SUB}">Gefühlt ${fmt(g('apparent_temperature'), ' °C')}</div></div></div>
      ${rowsCard([

        ['🌬️ Wind', `${fmt(g('wind_speed_10m'))} km/h aus ${dirName(g('wind_direction_10m'))}`],
        ['💨 Böen', fmt(g('wind_gusts_10m'), ' km/h')],
        ['💧 Luftfeuchte', fmt(g('relative_humidity_2m'), ' %')],
        ['💦 Taupunkt', fmt(g('dew_point_2m'), ' °C')],
        ['😎 UV-Index', fmt(g('uv_index'), '', 1)]
      ])}
      ${navBtns(link(i - 1), link(i + 1))}
      <button data-info="day" data-d="${t.slice(0, 10)}" class="w-full py-3 bg-sky-600 text-white font-extrabold">Ganzen Tag ansehen</button>`
    };
  },
  day(p) {
    const S = state.main; if (!S.data) return null;
    const P = prep(S.data), h = P.h, dl = P.dl;
    let di = dl.time.indexOf(p.d); if (di < 0) di = P.todayD;
    const d = dl.time[di], g = k => hv(dl, k, di), w = wmo(g('weather_code'), 1);
    const I = range(0, P.n).filter(i => h.time[i].startsWith(d));
    const sr = g('sunrise'), ss = g('sunset');
    const mins = s => Number(s.slice(11, 13)) * 60 + Number(s.slice(14, 16));
    const len = sr && ss ? mins(ss) - mins(sr) : null;
    const link = j => j >= Math.max(0, P.todayD - 1) && j < dl.time.length ? { attrs: `data-info="day" data-d="${dl.time[j]}"`, label: dayLabel(dl.time[j], P.today) } : null;
    const rows = I.map(i => {
      const ww = wmo(hv(h, 'weather_code', i), hv(h, 'is_day', i)), pp = hv(h, 'precipitation_probability', i), mm = hv(h, 'precipitation', i);
      return `<button data-info="hour" data-t="${h.time[i]}" class="w-full flex items-center gap-2 py-2 text-left border-t border-zinc-200 dark:border-zinc-800 first:border-0 active:opacity-70">
        <span class="w-10 font-extrabold tabular">${hh(h.time[i])}:00</span><span class="w-8 text-xl text-center">${ww.icon}</span>
        <span class="w-12 font-black tabular text-right">${fmtT(hv(h, 'temperature_2m', i))}</span>
        <span class="flex-1 text-sm font-bold tabular text-right ${pp >= 30 ? 'text-blue-700 dark:text-sky-300' : 'text-zinc-500 dark:text-zinc-400'}">💧${fmt(pp, '%')}${isNum(mm) && mm >= 0.1 ? ` ${fmt(mm, '', 1)} mm` : ''}</span>
        <span class="w-20 text-sm font-bold tabular text-right text-zinc-600 dark:text-zinc-300">💨${fmt(hv(h, 'wind_speed_10m', i))}/${fmt(hv(h, 'wind_gusts_10m', i))}</span></button>`;
    }).join('');
    return {
      title: `${w.icon} ${dayLabel(d, P.today, true)}`, sub: `${esc(currentLoc().name)} · ${esc(w.text)}`,
      body: `${rowsCard([
        ['🌡️ Tiefst / Höchst', `${fmt(g('temperature_2m_min'), '°')} / ${fmt(g('temperature_2m_max'), '°')}`],
        ['☔ Regenrisiko max', fmt(g('precipitation_probability_max'), ' %')],
        ['🌧️ Niederschlag', fmt(g('precipitation_sum'), ' mm', 1)],
        isNum(g('snowfall_sum')) && g('snowfall_sum') > 0 ? ['❄️ Neuschnee', fmt(g('snowfall_sum'), ' cm', 1)] : null,
        ['🌬️ Wind max / Böen', `${fmt(g('wind_speed_10m_max'))} / ${fmt(g('wind_gusts_10m_max'), ' km/h')}`],
        ['😎 UV-Index max', fmt(g('uv_index_max'), '', 1)],
        ['🌅 Sonne', sr && ss ? `${sr.slice(11, 16)} – ${ss.slice(11, 16)}` : '–'],
        isNum(len) ? ['⏱️ Tageslänge', `${Math.floor(len / 60)} h ${pad(len % 60)} min`] : null
      ])}
      ${h3('Temperatur & Niederschlag')}
      ${chartCard(lineChart(I.map(i => hh(h.time[i])), I.map(i => hv(h, 'temperature_2m', i)), { bars: I.map(i => hv(h, 'precipitation', i)) }), 'Linie = Temperatur, Balken = Niederschlag')}
      ${h3('Stunde für Stunde')}
      <div class="${CARD} px-3 py-1">${rows}</div>
      ${navBtns(link(di - 1), link(di + 1))}`
    };
  },
  precip(p) {
    const S = state.main; if (!S.data) return null;
    const P = prep(S.data), h = P.h, I = hourRange(P, P.nowIdx, P.nowIdx + 24);
    const pops = I.map(i => hv(h, 'precipitation_probability', i)), mm = I.map(i => hv(h, 'precipitation', i));
    const first = I.find(i => (hv(h, 'precipitation', i) || 0) >= 0.2);
    return {
      title: '☔ Niederschlag', sub: `${esc(currentLoc().name)} · nächste 24 Stunden`,
      body: `${rowsCard([
        ['Summe 24 h', fmt(sum(mm), ' mm', 1)],
        ['Höchstes Regenrisiko', fmt(maxOf(pops), ' %')],
        ['Nächster Niederschlag', first != null ? `${dayLabel(h.time[first].slice(0, 10), P.today)} ${h.time[first].slice(11, 16)} Uhr` : 'keiner in Sicht'],
        ['Neuschnee 24 h', fmt(sum(I.map(i => hv(h, 'snowfall', i))), ' cm', 1)]
      ])}
      ${chartCard(lineChart(I.map(i => hh(h.time[i])), pops, { cls: 'stroke-sky-500', unit: '%', bars: mm }), 'Linie = Regenrisiko in %, Balken = Menge in mm')}
      ${note('💡', '<b>Regenrisiko</b> = Wahrscheinlichkeit, dass es in dieser Stunde mindestens 0,1 mm regnet. 40 % heißt nicht „40 % der Zeit“, sondern: an 4 von 10 vergleichbaren Tagen regnet es.')}`
    };
  },
  uv(p) {
    const S = state.main; if (!S.data) return null;
    const P = prep(S.data), h = P.h, today = range(0, P.n).filter(i => h.time[i].startsWith(P.today) && Number(hh(h.time[i])) >= 6 && Number(hh(h.time[i])) <= 20);
    const lv = [['0–2', 'niedrig', 'Kein Schutz nötig.'], ['3–5', 'mäßig', 'Mittags Schatten, Sonnenbrille, LSF 30.'], ['6–7', 'hoch', 'LSF 50, Kopfbedeckung, 11–15 Uhr meiden.'], ['8–10', 'sehr hoch', 'Möglichst nicht in die Sonne, LSF 50+.'], ['11+', 'extrem', 'Ungeschützte Haut verbrennt in Minuten.']];
    return {
      title: '😎 UV-Index', sub: `${esc(currentLoc().name)} · heute max ${fmt(hv(P.dl, 'uv_index_max', P.todayD), '', 1)}`,
      body: `${chartCard(lineChart(today.map(i => hh(h.time[i])), today.map(i => hv(h, 'uv_index', i)), { cls: 'stroke-amber-500', unit: '', dec: 1 }), 'UV-Index im Tagesverlauf')}
      ${rowsCard(lv.map(([r, l, t]) => [`${r} · ${l}`, `<span class="text-sm font-bold">${t}</span>`]))}
      ${note('🏔️', 'Pro 1000 Höhenmeter steigt die UV-Strahlung um rund 10 %, Schnee reflektiert bis zu 90 % – am Berg also deutlich mehr Schutz einplanen.')}`
    };
  },
  wind(p) {
    const S = slotOf(p); if (!S.data) return null;
    const P = prep(S.data), h = P.h, i0 = P.nowIdx, I = hourRange(P, i0, i0 + 24);
    const c = currentVals(S.data, P, S.ts);
    return {
      title: '🌬️ Wind', sub: `${esc(currentLoc().name)} · ${fmt(S.data.elevation)} m`,
      body: `<div class="${CARD} p-4 flex items-center gap-4">${compass(c.wind_direction_10m, 104)}
        <div><div class="text-4xl font-black tabular">${fmt(c.wind_speed_10m)}<span class="text-lg"> km/h</span></div>
        <div class="font-extrabold">aus ${dirName(c.wind_direction_10m)} · Böen ${fmt(c.wind_gusts_10m, ' km/h')}</div>
        <div class="${SUB}">${beaufort(c.wind_speed_10m)}</div></div></div>
      ${h3('Nächste 24 Stunden')}
      ${chartCard(lineChart(I.map(i => hh(h.time[i])), I.map(i => hv(h, 'wind_gusts_10m', i)), { cls: 'stroke-indigo-500', unit: '' }), 'Böen in km/h')}
      ${chartCard(lineChart(I.map(i => hh(h.time[i])), I.map(i => hv(h, 'wind_speed_10m', i)), { cls: 'stroke-emerald-500', unit: '' }), 'Mittelwind in km/h')}
      ${note('🧭', 'Die Pfeilspitze zeigt, <b>wohin</b> der Wind weht; „aus N“ bedeutet: Der Wind kommt von Norden.')}`
    };
  },
  humidity(p) {
    const S = state.main; if (!S.data) return null;
    const P = prep(S.data), h = P.h, I = hourRange(P, P.nowIdx, P.nowIdx + 24);
    const c = currentVals(S.data, P, S.ts);
    return {
      title: '💧 Luftfeuchte & Taupunkt', sub: esc(currentLoc().name),
      body: `${rowsCard([['Relative Feuchte', fmt(c.relative_humidity_2m, ' %')], ['Taupunkt', fmt(c.dew_point_2m, ' °C')], ['Abstand Temperatur – Taupunkt', fmt(isNum(c.temperature_2m) && isNum(c.dew_point_2m) ? c.temperature_2m - c.dew_point_2m : null, ' °C', 1)]])}
      ${chartCard(lineChart(I.map(i => hh(h.time[i])), I.map(i => hv(h, 'dew_point_2m', i)), { cls: 'stroke-sky-500', dec: 0 }), 'Taupunkt nächste 24 h')}
      ${note('💡', 'Der <b>Taupunkt</b> sagt mehr über das Gefühl als die relative Feuchte: unter 10 °C trocken, 16–20 °C schwül, über 20 °C drückend. Liegen Temperatur und Taupunkt weniger als 2–3 °C auseinander, drohen Nebel und nasse Straßen.')}`
    };
  },
  sun(p) {
    const S = state.main; if (!S.data) return null;
    const P = prep(S.data), dl = P.dl;
    const mins = s => Number(s.slice(11, 13)) * 60 + Number(s.slice(14, 16));
    const rows = range(P.todayD, Math.min(dl.time.length, P.todayD + 7)).map(i => {
      const sr = hv(dl, 'sunrise', i), ss = hv(dl, 'sunset', i), len = sr && ss ? mins(ss) - mins(sr) : null;
      return [dayLabel(dl.time[i], P.today), `${sr ? sr.slice(11, 16) : '–'} – ${ss ? ss.slice(11, 16) : '–'}${isNum(len) ? ` <span class="text-sm font-bold text-zinc-500 dark:text-zinc-400">(${Math.floor(len / 60)}:${pad(len % 60)} h)</span>` : ''}`];
    });
    return { title: '🌅 Sonnenauf- & -untergang', sub: esc(currentLoc().name), body: `${rowsCard(rows)}${note('⛰️', 'Die Zeiten gelten für freien Horizont. In engen Tälern verschwindet die Sonne oft deutlich früher hinter den Bergen.')}` };
  },
  clouds(p) {
    const S = slotOf(p); if (!S.data) return null;
    const P = prep(S.data), h = P.h, I = hourRange(P, P.nowIdx, P.nowIdx + 24);
    const g = k => hv(h, k, P.nowIdx), vis = g('visibility');
    return {
      title: '☁️ Bewölkung & Sicht', sub: `${esc(currentLoc().name)} · ${fmt(S.data.elevation)} m`,
      body: `${rowsCard([['Bewölkung gesamt', fmt(g('cloud_cover'), ' %')], isNum(g('cloud_cover_low')) ? ['davon tiefe Wolken', fmt(g('cloud_cover_low'), ' %')] : null, isNum(vis) ? ['Sicht', vis >= 20000 ? '> 20 km' : fmt(vis / 1000, ' km', 1)] : null])}
      ${chartCard(lineChart(I.map(i => hh(h.time[i])), I.map(i => hv(h, 'cloud_cover', i)), { cls: 'stroke-zinc-500', unit: '%' }), 'Bewölkung nächste 24 h in %')}
      ${note('🌫️', 'Viele <b>tiefe Wolken</b> im Tal bei klarer Höhe = Hochnebel: Oben scheint dann oft die Sonne. Unter ca. 1 km Sicht herrscht im Gelände Whiteout-Gefahr.')}`
    };
  },

  /* --- Rennrad --- */
  bike() {
    if (!lastBike || !state.main.data) return null;
    const { W, R, windowTxt, a, b } = lastBike, h = state.main.data.hourly;
    const rows = range(a, b).map(i => {
      const Wi = windowStats(h, i, i + 1), lv = rateBike(Wi).level;
      return `<div class="flex items-center gap-2 py-2 border-t border-zinc-200 dark:border-zinc-800 first:border-0">
        <span class="w-11 font-extrabold tabular">${h.time[i].slice(11, 16)}</span><span class="w-3.5 h-3.5 rounded-full ${LEVEL[lv].dot}"></span>
        <span class="w-12 font-black tabular text-right">${fmtT(Wi.tMin)}</span>
        <span class="flex-1 text-sm font-bold tabular text-right">💨 ${fmt(Wi.windAvg)}/${fmt(Wi.gustMax)}</span>
        <span class="w-14 text-sm font-bold tabular text-right text-blue-700 dark:text-sky-300">💧${fmt(Wi.popMax)}%</span></div>`;
    }).join('');
    const rule = (icon, name, lv, go, cond, no) => `<div class="${CARD} p-3.5"><div class="font-black">${icon} ${name}: ${LEVEL[lv].icon} ${LEVEL[lv].label}</div>
      <div class="text-sm font-semibold mt-1 leading-snug"><span class="${LEVEL[0].txt} font-extrabold">GO</span> ${go}<br><span class="${LEVEL[1].txt} font-extrabold">BEDINGT</span> ${cond}<br><span class="${LEVEL[2].txt} font-extrabold">NEIN</span> ${no}</div></div>`;
    return {
      title: `🚴 Rennrad-Ampel: ${LEVEL[R.level].label}`, sub: windowTxt,
      body: `${rule('💨', 'Wind', R.factors[0].level, 'Böen bis 38 km/h und Mittelwind bis 25 km/h', 'Böen bis 55 km/h oder Mittelwind bis 40 km/h', 'darüber – Seitenwind wird gefährlich')}
      ${rule('🌧️', 'Regen', R.factors[1].level, 'Regenrisiko unter 30 % und unter 0,3 mm', 'Regenrisiko bis 60 % oder bis 2 mm', 'ab 60 % bzw. 2 mm, bei Gewitter oder gefrierendem Regen')}
      ${rule('🌡️', 'Temperatur', R.factors[2].level, '7 bis 31 °C', '2 bis 7 °C oder 31 bis 36 °C', 'unter 2 °C (Glätte) oder über 36 °C')}
      ${h3('Stunde für Stunde')}
      <div class="${CARD} px-3 py-1">${rows}</div>
      ${note('🧮', `Im Zeitfenster: ${fmt(W.tMin)}–${fmt(W.tMax, ' °C')}, Wind Ø ${fmt(W.windAvg)} km/h, Böen bis ${fmt(W.gustMax)} km/h, Regenrisiko bis ${fmt(W.popMax)} %. Der schlechteste der drei Faktoren bestimmt die Ampel.`)}`
    };
  },
  clothing() {
    if (!lastBike) return null;
    const { W, C } = lastBike;
    const steps = [['ab 21 °C', 'Kurz/Kurz'], ['16–21 °C', 'Kurz/Kurz + Weste'], ['12–16 °C', 'Kurz/Kurz + Armlinge'], ['8–12 °C', 'Langarm + Knielinge'], ['3–8 °C', 'Lang/Lang + Windjacke'], ['−3–3 °C', 'Winter-Outfit'], ['unter −3 °C', 'Volle Winterausrüstung']];
    return {
      title: `👕 ${esc(C.head)}`, sub: lastBike.windowTxt,
      body: `${note('🌬️', `Beim Fahren kühlt der Fahrtwind (≈ 25 km/h) plus der halbe Umgebungswind (${fmt(W.windAvg)} km/h). So fühlen sich <b>${fmt(W.tMin, ' °C')}</b> Luft an wie <b>${fmt(C.eff, ' °C')}</b>. Nach diesem „Fahrt-Windchill“ richtet sich die Empfehlung.`)}
      ${rowsCard(steps.map(([t, l]) => [`<span class="${l === C.head.split(' + Regenjacke')[0] ? 'text-zinc-900 dark:text-white font-black' : ''}">${t}</span>`, l]))}
      <ul class="space-y-2">${C.items.map(([ic, t]) => `<li class="flex items-start gap-3 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 px-3 py-2.5"><span class="text-xl leading-6">${ic}</span><span class="font-bold leading-6">${t}</span></li>`).join('')}</ul>`
    };
  },

  /* --- Ski & Wachs --- */
  wax() {
    if (!lastWax) return null;
    const { A, SD, st, det, elevUsed, meas, day } = lastWax, w = A.cat;
    const steps = [
      'Belag mit der Messingbürste von vorne nach hinten ausbürsten (alte Wachsreste und Schmutz raus).',
      `Bügeleisen auf <b>${w.iron}</b> einstellen. Swix PS${w.code} ans Eisen halten und auf den Belag tropfen lassen oder einreiben.`,
      'In 2–3 langsamen Zügen von vorne nach hinten einbügeln – Eisen immer in Bewegung halten, Wachs darf nicht rauchen.',
      'Mindestens 20–30 Minuten abkühlen lassen (über Nacht hält es länger).',
      'Mit der Plexi-Abziehklinge von vorne nach hinten abziehen, Kanten und Rillen freikratzen.',
      'Bürsten: Messing → Nylon → Rosshaar, zum Schluss mit Fibertex/Polierpad auspolieren.'

    return {
      title: `🎿 Swix PS${w.code} ${w.color}`, sub: `${day} · ${fmt(elevUsed)} m · ${w.range}`,

        <div class="font-bold mt-1 leading-snug">Skitag ${fmt(SD.tMin)} bis ${fmt(SD.tMax, ' °C')}, Ø ${fmt(SD.tAvg, ' °C', 1)}. Schneeart: ${SNOW_NAMES[st]}${state.snowType === 'auto' ? ` (${det.why})` : ' (von dir gewählt)'}. Daraus ergibt sich eine Wachs-Referenz von <b>${fmt(A.tRef, ' °C', 1)}</b> → ${w.label}.</div></div>
      ${meas ? note('📡', `<b>${esc(meas.s.name)}</b> (${fmt(meas.s.alt)} m) misst ${fmt(meas.s.t, ' °C', 1)}${isNum(meas.s.oft) ? `, die Schnee-Oberfläche hat ${fmt(meas.s.oft, ' °C', 1)}` : ''}.${meas.hint}${isNum(meas.s.oft) && isNum(meas.s.t) && meas.s.oft < meas.s.t - 4 ? ' Der Schnee ist deutlich kälter als die Luft (klare Nacht) – vormittags läuft eher das härtere Wachs.' : ''}`) : ''}

      <ul class="space-y-2">${A.products.map(([ic, tier, name, txt], k) => `<li class="flex gap-3 items-start ${k ? 'bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800' : 'bg-sky-50 dark:bg-sky-950/50 border-2 border-sky-400 dark:border-sky-700'} p-3">
        <span class="text-2xl leading-7">${ic}</span><div><div class="text-xs font-extrabold uppercase tracking-wide text-zinc-600 dark:text-zinc-300">${tier}</div><div class="font-black text-lg leading-tight">${name}</div><div class="text-sm font-semibold mt-0.5 leading-snug">${txt}</div></div></li>`).join('')}</ul>

      ${note(A.hum.icon, `<b>${A.hum.title}.</b> ${A.hum.text}`)}
      ${note('〰️', `<b>Struktur: ${A.struct.name}.</b> ${A.struct.text}`)}
      ${A.notes.map(([ic, t]) => note(ic, t)).join('')}
      ${h3('So wachst du richtig')}
      <ol class="space-y-2">${steps.map((t, k) => `<li class="flex gap-3 items-start ${CARD} p-3"><span class="w-7 h-7 shrink-0 grid place-items-center rounded-full bg-zinc-900 text-white dark:bg-white dark:text-zinc-900 font-black">${k + 1}</span><span class="text-sm font-semibold leading-snug pt-0.5">${t}</span></li>`).join('')}</ol>
      <button data-info="waxchart" class="w-full py-3 bg-zinc-200 dark:bg-zinc-800 font-extrabold">Alle Swix-Farben & Temperaturen</button>
      <p class="text-xs font-semibold text-zinc-500 dark:text-zinc-400 px-1">Temperaturbereiche und Bügeltemperaturen laut Swix-Packungsangaben (ca.) – im Zweifel gilt die Angabe auf deiner Packung.</p>`
    };

  waxchart() {
    const cur = lastWax ? lastWax.A.idx : -1;

      title: '🎨 Swix-Farbtabelle', sub: 'Fluorfreie Gleitwachse · gleiche Nummer = gleicher Bereich',

        ${k === cur ? '<span class="text-xs font-black text-sky-700 dark:text-sky-300">EMPFOHLEN</span>' : ''}</li>`; }).join('')}
        <li class="flex items-center gap-3 ${CARD} p-3"><span class="w-12 h-12 shrink-0 bg-zinc-200 dark:bg-zinc-700 grid place-items-center text-2xl">🥶</span><div><div class="font-black">PS Polar</div><div class="text-sm font-semibold text-zinc-600 dark:text-zinc-300">ca. −14 bis −32 °C · für extreme Kälte</div></div></li>
        <li class="flex items-center gap-3 ${CARD} p-3"><span class="w-12 h-12 shrink-0 bg-zinc-200 dark:bg-zinc-700 grid place-items-center text-2xl">⚡</span><div><div class="font-black">F4 Glidewax</div><div class="text-sm font-semibold text-zinc-600 dark:text-zinc-300">alle Temperaturen · Flüssig/Paste ohne Bügeleisen</div></div></li></ul>
      ${note('📈', '<b>PS</b> = Performance Speed (Training, Alltag) · <b>HS</b> = High Speed (schneller) · <b>TS</b> = Top Speed (Rennen). Niedrige Nummern sind härter und robuster, hohe Nummern weicher und wasserabweisender.')}
      ${note('🔀', 'Liegt der Tag zwischen zwei Farben: das härtere (kältere) Wachs als Basis einbügeln, das wärmere dünn darüber – oder beide 50/50 mischen.')}`
    };
  },
  snow() {
    const S = state.ski; if (!S.data) return null;
    const P = prep(S.data), h = P.h, i0 = P.nowIdx;
    const I = hourRange(P, i0 - 23, i0 + 49);
    const depth = hv(h, 'snow_depth', i0), stc = stationFor(currentLoc(), 'ski');
    const s = stc && stc.s;
    return {
      title: '❄️ Neuschnee', sub: `${esc(currentLoc().name)} · ${fmt(S.data.elevation)} m`,
      body: `${rowsCard([
        ['Letzte 24 h', fmt(sum(hourRange(P, i0 - 23, i0 + 1).map(i => hv(h, 'snowfall', i))), ' cm', 1)],
        ['Nächste 24 h', fmt(sum(hourRange(P, i0 + 1, i0 + 25).map(i => hv(h, 'snowfall', i))), ' cm', 1)],
        ['Nächste 48 h', fmt(sum(hourRange(P, i0 + 1, i0 + 49).map(i => hv(h, 'snowfall', i))), ' cm', 1)],
        isNum(depth) ? ['Schneehöhe (Modell)', fmt(depth * 100, ' cm')] : null,
        s && isNum(s.hs) ? [`Schneehöhe gemessen<br><span class="text-xs">${esc(s.name)}, ${fmt(s.alt)} m</span>`, `${fmt(s.hs, ' cm')}${isNum(s.hs24) ? ` <span class="text-sm">(24 h: ${signed(s.hs24, ' cm')})</span>` : ''}`] : null
      ])}
      ${chartCard(lineChart(I.map(i => hh(h.time[i])), I.map(i => hv(h, 'temperature_2m', i)), { bars: I.map(i => hv(h, 'snowfall', i)), barCls: 'fill-indigo-500' }), 'Gestern bis übermorgen: Linie = Temperatur, Balken = Neuschnee pro Stunde')}
      ${note('📏', 'Die gemessene Schneehöhe der Station ist meist genauer als das Wettermodell. Wind verfrachtet Neuschnee – an Graten liegt oft viel weniger, in Mulden viel mehr.')}`
    };
  },
  fzl() {
    const S = state.ski; if (!S.data) return null;
    const P = prep(S.data), h = P.h, I = hourRange(P, P.nowIdx, P.nowIdx + 48);
    return {
      title: '🧊 Nullgradgrenze', sub: `${esc(currentLoc().name)} · du bist auf ${fmt(S.data.elevation)} m`,
      body: `${chartCard(lineChart(I.map(i => hh(h.time[i])), I.map(i => hv(h, 'freezing_level_height', i)), { cls: 'stroke-sky-500', unit: ' m' }), 'Höhe der 0-°C-Grenze in den nächsten 48 Stunden')}
      ${note('💡', 'Liegt die Nullgradgrenze <b>über</b> deiner Höhe, wird der Schnee weich und nass (wärmeres Wachs, grobe Struktur). Liegt sie deutlich <b>darunter</b>, bleibt er kalt und griffig. Bei Inversion kann es oben wärmer sein als im Tal.')}`
    };
  },

  /* --- Stationen --- */
  stations(p) {
    const loc = currentLoc(), S = state.st, mode = p.mode === 'ski' ? 'ski' : 'main';
    if (!loc) return null;
    if (!S.list) return S.error ? { title: '📡 Messstationen', body: errorCard(S.error) } : null;
    const f = p.f || 'all', ch = stationFor(loc, mode), curKey = ch ? stKey(ch.s) : null;
    const manual = mode === 'ski' ? loc.stSki : loc.stMain;
    const list = S.list.filter(s => f === 'berg' ? s.alt >= 1500 : f === 'tal' ? !(s.alt >= 1500) : true);
    const chip = (v, l) => `<button data-info="stations" data-mode="${mode}" data-f="${v}" class="shrink-0 px-3.5 py-2 font-extrabold text-sm border-2 ${f === v ? 'bg-zinc-900 text-white border-zinc-900 dark:bg-white dark:text-zinc-900 dark:border-white' : 'border-zinc-300 dark:border-zinc-700'}">${l}</button>`;
    const vals = s => [isNum(s.t) ? `🌡️ ${fmt(s.t, '°', 1)}` : '', isNum(s.hs) ? `❄️ ${fmt(s.hs)} cm` : '', isNum(s.wg) ? `💨 ${fmt(s.wg)} km/h` : (isNum(s.ws) ? `💨 ${fmt(s.ws)} km/h` : '')].filter(Boolean).join(' · ');
    const rows = list.map(s => {
      const k = stKey(s), on = k === curKey;
      return `<li class="flex items-stretch border-2 ${on ? 'border-sky-500 bg-sky-50 dark:bg-sky-950/40' : 'border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900'}">

          <div class="text-sm font-bold tabular mt-0.5">${vals(s) || '–'}</div>
        </button>
        <button data-info="station" data-sid="${esc(k)}" data-mode="${mode}" class="w-12 shrink-0 grid place-items-center text-xl text-zinc-500 dark:text-zinc-400" aria-label="Details zu ${esc(s.name)}">ⓘ</button>
      </li>`;
    }).join('');
    return {
      title: '📡 Messstationen', sub: `${mode === 'ski' ? 'Für Ski & Wachs' : 'Für Wetter'} · ${ST_RADIUS} km um ${esc(loc.name)}`,
      body: `<div class="no-scrollbar flex gap-2 overflow-x-auto -mx-4 px-4">${chip('all', 'Alle')}${chip('berg', '⛰️ Berg ab 1500 m')}${chip('tal', '🏘️ Tal')}</div>
        <button data-act="st-choose" data-v="" data-mode="${mode}" class="w-full text-left border-2 px-4 py-3 ${!manual ? 'border-sky-500 bg-sky-50 dark:bg-sky-950/40' : 'border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900'}">
          <div class="font-extrabold">${!manual ? '✓ ' : ''}Automatisch wählen</div>
          <div class="text-sm font-semibold text-zinc-600 dark:text-zinc-300">${mode === 'ski' ? 'Station, deren Höhe am besten zur Gipfellage passt' : 'Nächste Station mit ähnlicher Höhe'}</div></button>
        ${rows ? `<ul class="space-y-2">${rows}</ul>` : `<p class="${SUB} px-1">Keine Station in dieser Auswahl.</p>`}
