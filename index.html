   Auch per Link aufrufbar (z. B. Schnellzugriffe am App-Symbol): ?tab=ski&info=wax
   ===================================================================== */
let lastBike = null, lastWax = null;

const rowsCard = rows => {
  const r = rows.filter(Boolean);
  return `<div class="${CARD} divide-y divide-zinc-200 dark:divide-zinc-800">${r.map(([k, v]) => `<div class="flex items-baseline justify-between gap-3 px-4 py-2.5">
    <span class="text-sm font-medium text-zinc-600 dark:text-zinc-400">${k}</span><span class="font-bold tabular text-right">${v}</span></div>`).join('')}</div>`;
};
const note = (icon, html) => `<div class="flex gap-3 items-start rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800 px-4 py-3"><span class="text-lg leading-6 shrink-0">${icon}</span><div class="text-sm font-medium leading-snug">${html}</div></div>`;
const h3 = t => `<h3 class="${LABEL} pt-2">${t}</h3>`;
const chartCard = (svg, caption = '') => svg ? `<div class="${CARD} p-3">${svg}${caption ? `<p class="text-[11px] font-medium text-zinc-500 dark:text-zinc-400 mt-1">${caption}</p>` : ''}</div>` : '';
/* Vor/Zurück im Detail-Sheet: seitlich wischen (die Beschriftungen sind zusätzlich antippbar) */
function navBtns(prev, next) {
  const b = (x, side) => x ? `<button ${x.attrs} data-swipe="${side}" class="py-2 ${side === 'prev' ? 'pr-3 text-left' : 'pl-3 text-right'}">${side === 'prev' ? `‹ ${x.label}` : `${x.label} ›`}</button>` : '<span></span>';
  return `<div class="flex items-center justify-between pt-1 text-sm font-bold text-sky-700 dark:text-sky-300">
    ${b(prev, 'prev')}<span></span>${b(next, 'next')}</div>`;
}

/* Kleines Liniendiagramm (SVG) mit optionalen Balken (z. B. Niederschlag) */
function lineChart(labels, vals, { cls = 'stroke-orange-500', unit = '°', dec = 0, bars = null, barCls = 'fill-sky-500' } = {}) {
  const n = vals.length, v = nums(vals);
  if (n < 2 || v.length < 2) return '';
  const W = 320, H = 136, L = 16, R = 16, T = 20, B = 24;
  const vMax = Math.max(...v), vMin = Math.min(...v);
  let lo = vMin, hi = vMax;
  if (hi - lo < 1) { hi += 0.5; lo -= 0.5; }
  const x = i => L + i * (W - L - R) / (n - 1), y = t => T + (hi - t) / (hi - lo) * (H - T - B);
  const segs = []; let cur = [];
  vals.forEach((t, i) => { if (isNum(t)) cur.push(`${x(i).toFixed(1)},${y(t).toFixed(1)}`); else if (cur.length) { segs.push(cur); cur = []; } });
  if (cur.length) segs.push(cur);
  let barSvg = '';
  if (bars) {
    const bm = Math.max(0.5, ...nums(bars)), bw = Math.max(2, (W - L - R) / n - 2);
    barSvg = bars.map((b, i) => isNum(b) && b > 0 ? `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${(H - B - b / bm * 36).toFixed(1)}" width="${bw.toFixed(1)}" height="${(b / bm * 36).toFixed(1)}" rx="1.5" class="${barCls}" opacity=".6"/>` : '').join('');
  }
  const step = Math.max(1, Math.ceil(n / 8));
  const lab = labels.map((l, i) => i % step === 0 ? `<text x="${x(i).toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="10" font-weight="700" class="fill-zinc-500 dark:fill-zinc-400">${esc(l)}</text>` : '').join('');
  const iHi = vals.indexOf(vMax), iLo = vals.indexOf(vMin);
  const mark = (i, above) => `<text x="${clamp(x(i), 18, W - 18).toFixed(1)}" y="${(y(vals[i]) + (above || y(vals[i]) + 15 > H - B - 2 ? -7 : 15)).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="900" class="fill-zinc-800 dark:fill-zinc-100">${fmt(vals[i], unit, dec)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="Verlauf">
    ${barSvg}${segs.map(sg => `<polyline points="${sg.join(' ')}" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="${cls}"/>`).join('')}
    ${mark(iHi, true)}${iLo !== iHi ? mark(iLo, false) : ''}${lab}</svg>`;
}

const slotOf = p => (p.slot === 'ski' ? state.ski : state.main);
const hourRange = (P, a, b) => range(Math.max(0, a), Math.min(P.n, b));
const hh = t => t.slice(11, 13);

function beaufort(v) {
  if (!isNum(v)) return '–';
  const B = [[2, 'Windstille'], [6, 'leiser Zug'], [12, 'leichte Brise'], [20, 'schwache Brise'], [29, 'mäßige Brise'], [39, 'frische Brise'], [50, 'starker Wind'], [62, 'steifer Wind'], [75, 'stürmischer Wind'], [89, 'Sturm'], [103, 'schwerer Sturm'], [118, 'orkanartiger Sturm']];
  for (let i = 0; i < B.length; i++) if (v < B[i][0]) return `Bft ${i} · ${B[i][1]}`;
  return 'Bft 12 · Orkan';
}

const INFO = {
  /* --- Wetter --- */
  now(p) {
    const S = slotOf(p); if (!S.data) return null;
    const d = S.data, P = prep(d), h = P.h, dl = P.dl, di = P.todayD, i0 = P.nowIdx;
    const c = currentVals(d, P, S.ts), w = wmo(c.weather_code, c.is_day);
    const I = hourRange(P, i0, i0 + 13);
    const fzl = hv(h, 'freezing_level_height', i0), vis = hv(h, 'visibility', i0);
    return {
      title: `${w.icon} Jetzt auf ${fmt(d.elevation)} m`, sub: `${esc(currentLoc().name)} · Stand ${clock(S.ts)} Uhr`,
      body: `<div class="${CARD} p-4 flex items-center gap-4"><div class="text-6xl" aria-hidden="true">${w.icon}</div>
        <div><div class="text-5xl font-black tabular leading-none">${fmtT(c.temperature_2m)}</div><div class="font-extrabold text-lg mt-1">${esc(w.text)}</div>
        <div class="${SUB}">Gefühlt ${fmt(c.apparent_temperature, ' °C')} · H ${fmtT(hv(dl, 'temperature_2m_max', di))} T ${fmtT(hv(dl, 'temperature_2m_min', di))}</div></div></div>
      ${rowsCard([
        ['💧 Luftfeuchte', fmt(c.relative_humidity_2m, ' %')],
        ['💦 Taupunkt', fmt(c.dew_point_2m, ' °C')],
        ['☔ Regenrisiko', fmt(hv(h, 'precipitation_probability', i0), ' %')],
        ['🌧️ Niederschlag (1 h)', fmt(c.precipitation, ' mm', 1)],
        ['☁️ Bewölkung', fmt(c.cloud_cover, ' %')],
        ['🌬️ Wind', `${fW(c.wind_speed_10m)} aus ${dirName(c.wind_direction_10m)}`],
        ['💨 Böen', fW(c.wind_gusts_10m)],
        ['😎 UV-Index', fmt(hv(h, 'uv_index', i0), '', 1)],
        isNum(vis) ? ['👁️ Sicht', vis >= 20000 ? '> 20 km' : fmt(vis / 1000, ' km', vis < 10000 ? 1 : 0)] : null,
        isNum(fzl) ? ['🧊 Nullgradgrenze', fmt(fzl, ' m')] : null
      ])}
      ${h3('Nächste 12 Stunden')}
      ${chartCard(lineChart(I.map(i => hh(h.time[i])), I.map(i => hv(h, 'temperature_2m', i)), { bars: I.map(i => hv(h, 'precipitation', i)) }), 'Linie = Temperatur, Balken = Niederschlag')}`
    };
  },
  hour(p) {
    const S = state.main; if (!S.data) return null;
    const P = prep(S.data), h = P.h;
    let i = h.time.indexOf(p.t); if (i < 0) i = P.nowIdx;
    const g = k => hv(h, k, i), w = wmo(g('weather_code'), g('is_day')), t = h.time[i];
    const sn = g('snowfall');
    const link = j => j >= 0 && j < P.n ? { attrs: `data-info="hour" data-t="${h.time[j]}"`, label: `${h.time[j].slice(11, 16)}` } : null;
    return {
      title: `${dayLabel(t.slice(0, 10), P.today, true)} · ${t.slice(11, 16)} Uhr`, sub: esc(currentLoc().name),
      body: `<div class="${CARD} p-4 flex items-center gap-4"><div class="text-6xl" aria-hidden="true">${w.icon}</div>
        <div><div class="text-5xl font-black tabular leading-none">${fmtT(g('temperature_2m'))}</div><div class="font-extrabold text-lg mt-1">${esc(w.text)}</div>
        <div class="${SUB}">Gefühlt ${fmt(g('apparent_temperature'), ' °C')}</div></div></div>
      ${rowsCard([
        ['☔ Regenrisiko', fmt(g('precipitation_probability'), ' %')],
        ['🌧️ Niederschlag', fmt(g('precipitation'), ' mm', 1)],
        isNum(sn) && sn > 0 ? ['❄️ davon Schnee', fmt(sn, ' cm', 1)] : null,
        ['☁️ Bewölkung', `${fmt(g('cloud_cover'), ' %')}${isNum(g('cloud_cover_low')) ? ` · tief ${fmt(g('cloud_cover_low'), ' %')}` : ''}`],
        ['🌬️ Wind', `${fW(g('wind_speed_10m'))} aus ${dirName(g('wind_direction_10m'))}`],
        ['💨 Böen', fW(g('wind_gusts_10m'))],
        ['💧 Luftfeuchte', fmt(g('relative_humidity_2m'), ' %')],
        ['💦 Taupunkt', fmt(g('dew_point_2m'), ' °C')],
        ['😎 UV-Index', fmt(g('uv_index'), '', 1)]
      ])}
      ${navBtns(link(i - 1), link(i + 1))}
      <button data-info="day" data-d="${t.slice(0, 10)}" class="w-full py-3 rounded-full ac-bg text-white font-bold active:opacity-80 transition">Ganzen Tag ansehen</button>`
    };
  },
  day(p) {
    const S = state.main; if (!S.data) return null;
    const P = prep(S.data), h = P.h, dl = P.dl;
    let di = dl.time.indexOf(p.d); if (di < 0) di = P.todayD;
    const d = dl.time[di], g = k => hv(dl, k, di), w = wmo(g('weather_code'), 1);
    const I = range(0, P.n).filter(i => h.time[i].startsWith(d));
    const sr = g('sunrise'), ss = g('sunset');
    const mins = s => Number(s.slice(11, 13)) * 60 + Number(s.slice(14, 16));
    const len = sr && ss ? mins(ss) - mins(sr) : null;
    const link = j => j >= Math.max(0, P.todayD - 1) && j < dl.time.length ? { attrs: `data-info="day" data-d="${dl.time[j]}"`, label: dayLabel(dl.time[j], P.today) } : null;
    const rows = I.map(i => {
      const ww = wmo(hv(h, 'weather_code', i), hv(h, 'is_day', i)), pp = hv(h, 'precipitation_probability', i), mm = hv(h, 'precipitation', i);
      return `<button data-info="hour" data-t="${h.time[i]}" class="w-full flex items-center gap-2 py-2 text-left border-t border-zinc-200 dark:border-zinc-800 first:border-0 active:opacity-70">
        <span class="w-10 font-extrabold tabular">${hh(h.time[i])}:00</span><span class="w-8 text-xl text-center">${ww.icon}</span>
        <span class="w-14 text-right leading-tight"><span class="block font-black tabular">${fmtT(hv(h, 'temperature_2m', i))}</span><span class="block text-[10px] font-semibold text-zinc-400 tabular">gef. ${fmtT(hv(h, 'apparent_temperature', i))}</span></span>
        <span class="flex-1 text-sm font-bold tabular text-right ${pp >= 30 ? 'text-blue-700 dark:text-sky-300' : 'text-zinc-500 dark:text-zinc-400'}">💧${fmt(pp, '%')}${isNum(mm) && mm >= 0.1 ? ` ${fmt(mm, '', 1)} mm` : ''}</span>
        <span class="w-20 text-sm font-bold tabular text-right text-zinc-600 dark:text-zinc-300">💨${fmt(hv(h, 'wind_speed_10m', i))}/${fmt(hv(h, 'wind_gusts_10m', i))}</span></button>`;
    }).join('');
    return {
      title: `${w.icon} ${dayLabel(d, P.today, true)}`, sub: `${esc(currentLoc().name)} · ${esc(w.text)}`,
      body: `${rowsCard([
        ['🌡️ Tiefst / Höchst', `${fmt(g('temperature_2m_min'), '°')} / ${fmt(g('temperature_2m_max'), '°')}`],
        isNum(g('apparent_temperature_min')) ? ['🥶 Gefühlt', `${fmt(g('apparent_temperature_min'), '°')} / ${fmt(g('apparent_temperature_max'), '°')}`] : null,
        ['☔ Regenrisiko max', fmt(g('precipitation_probability_max'), ' %')],
        ['🌧️ Niederschlag', fmt(g('precipitation_sum'), ' mm', 1)],
        isNum(g('snowfall_sum')) && g('snowfall_sum') > 0 ? ['❄️ Neuschnee', fmt(g('snowfall_sum'), ' cm', 1)] : null,
        ['🌬️ Wind max / Böen', `${fmt(g('wind_speed_10m_max'))} / ${fW(g('wind_gusts_10m_max'))}`],
        ['😎 UV-Index max', fmt(g('uv_index_max'), '', 1)],
        ['🌅 Sonne', sr && ss ? `${sr.slice(11, 16)} – ${ss.slice(11, 16)}` : '–'],
        isNum(len) ? ['⏱️ Tageslänge', `${Math.floor(len / 60)} h ${pad(len % 60)} min`] : null
      ])}
      ${h3('Temperatur & Niederschlag')}
      ${chartCard(lineChart(I.map(i => hh(h.time[i])), I.map(i => hv(h, 'temperature_2m', i)), { bars: I.map(i => hv(h, 'precipitation', i)) }), 'Linie = Temperatur, Balken = Niederschlag')}
      ${h3('Stunde für Stunde')}
      <div class="${CARD} px-3 py-1">${rows}</div>
      ${navBtns(link(di - 1), link(di + 1))}`
    };
  },
  precip(p) {
    const S = state.main; if (!S.data) return null;
    const P = prep(S.data), h = P.h, I = hourRange(P, P.nowIdx, P.nowIdx + 24);
    const pops = I.map(i => hv(h, 'precipitation_probability', i)), mm = I.map(i => hv(h, 'precipitation', i));
    const first = I.find(i => (hv(h, 'precipitation', i) || 0) >= 0.2);
    return {
      title: '☔ Niederschlag', sub: `${esc(currentLoc().name)} · nächste 24 Stunden`,
      body: `${rowsCard([
        ['Summe 24 h', fmt(sum(mm), ' mm', 1)],
        ['Höchstes Regenrisiko', fmt(maxOf(pops), ' %')],
        ['Nächster Niederschlag', first != null ? `${dayLabel(h.time[first].slice(0, 10), P.today)} ${h.time[first].slice(11, 16)} Uhr` : 'keiner in Sicht'],
        ['Neuschnee 24 h', fmt(sum(I.map(i => hv(h, 'snowfall', i))), ' cm', 1)]
      ])}
      ${chartCard(lineChart(I.map(i => hh(h.time[i])), pops, { cls: 'stroke-sky-500', unit: '%', bars: mm }), 'Linie = Regenrisiko in %, Balken = Menge in mm')}
      ${note('💡', '<b>Regenrisiko</b> = Wahrscheinlichkeit, dass es in dieser Stunde mindestens 0,1 mm regnet. 40 % heißt nicht „40 % der Zeit“, sondern: an 4 von 10 vergleichbaren Tagen regnet es.')}`
    };
  },
  uv(p) {
    const S = state.main; if (!S.data) return null;
    const P = prep(S.data), h = P.h, today = range(0, P.n).filter(i => h.time[i].startsWith(P.today) && Number(hh(h.time[i])) >= 6 && Number(hh(h.time[i])) <= 20);
    const lv = [['0–2', 'niedrig', 'Kein Schutz nötig.'], ['3–5', 'mäßig', 'Mittags Schatten, Sonnenbrille, LSF 30.'], ['6–7', 'hoch', 'LSF 50, Kopfbedeckung, 11–15 Uhr meiden.'], ['8–10', 'sehr hoch', 'Möglichst nicht in die Sonne, LSF 50+.'], ['11+', 'extrem', 'Ungeschützte Haut verbrennt in Minuten.']];
    return {
      title: '😎 UV-Index', sub: `${esc(currentLoc().name)} · heute max ${fmt(hv(P.dl, 'uv_index_max', P.todayD), '', 1)}`,
      body: `${chartCard(lineChart(today.map(i => hh(h.time[i])), today.map(i => hv(h, 'uv_index', i)), { cls: 'stroke-amber-500', unit: '', dec: 1 }), 'UV-Index im Tagesverlauf')}
      ${rowsCard(lv.map(([r, l, t]) => [`${r} · ${l}`, `<span class="text-sm font-bold">${t}</span>`]))}
      ${note('🏔️', 'Pro 1000 Höhenmeter steigt die UV-Strahlung um rund 10 %, Schnee reflektiert bis zu 90 % – am Berg also deutlich mehr Schutz einplanen.')}`
    };
  },
  wind(p) {
    const S = slotOf(p); if (!S.data) return null;
    const P = prep(S.data), h = P.h, i0 = P.nowIdx, I = hourRange(P, i0, i0 + 24);
    const c = currentVals(S.data, P, S.ts);
    return {
      title: '🌬️ Wind', sub: `${esc(currentLoc().name)} · ${fmt(S.data.elevation)} m`,
      body: `<div class="${CARD} p-4 flex items-center gap-4">${compass(c.wind_direction_10m, 104)}
        <div><div class="text-4xl font-black tabular">${fW(c.wind_speed_10m, false)}<span class="text-lg"> ${windU()}</span></div>
        <div class="font-extrabold">aus ${dirName(c.wind_direction_10m)} · Böen ${fW(c.wind_gusts_10m)}</div>
        <div class="${SUB}">${beaufort(c.wind_speed_10m)}</div></div></div>
      ${h3('Nächste 24 Stunden')}
      ${chartCard(lineChart(I.map(i => hh(h.time[i])), I.map(i => windVal(hv(h, 'wind_gusts_10m', i))), { cls: 'stroke-indigo-500', unit: '' }), `Böen in ${windU()}`)}
      ${chartCard(lineChart(I.map(i => hh(h.time[i])), I.map(i => windVal(hv(h, 'wind_speed_10m', i))), { cls: 'stroke-emerald-500', unit: '' }), `Mittelwind in ${windU()}`)}
      ${note('🧭', 'Die Pfeilspitze zeigt, <b>wohin</b> der Wind weht; „aus N“ bedeutet: Der Wind kommt von Norden.')}`
    };
  },
  humidity(p) {
    const S = state.main; if (!S.data) return null;
    const P = prep(S.data), h = P.h, I = hourRange(P, P.nowIdx, P.nowIdx + 24);
    const c = currentVals(S.data, P, S.ts);
    return {
      title: '💧 Luftfeuchte & Taupunkt', sub: esc(currentLoc().name),
      body: `${rowsCard([['Relative Feuchte', fmt(c.relative_humidity_2m, ' %')], ['Taupunkt', fmt(c.dew_point_2m, ' °C')], ['Abstand Temperatur – Taupunkt', fmt(isNum(c.temperature_2m) && isNum(c.dew_point_2m) ? c.temperature_2m - c.dew_point_2m : null, ' °C', 1)]])}
      ${chartCard(lineChart(I.map(i => hh(h.time[i])), I.map(i => hv(h, 'dew_point_2m', i)), { cls: 'stroke-sky-500', dec: 0 }), 'Taupunkt nächste 24 h')}
      ${note('💡', 'Der <b>Taupunkt</b> sagt mehr über das Gefühl als die relative Feuchte: unter 10 °C trocken, 16–20 °C schwül, über 20 °C drückend. Liegen Temperatur und Taupunkt weniger als 2–3 °C auseinander, drohen Nebel und nasse Straßen.')}`
    };
  },
  sun(p) {
    const S = state.main; if (!S.data) return null;
    const P = prep(S.data), dl = P.dl;
    const mins = s => Number(s.slice(11, 13)) * 60 + Number(s.slice(14, 16));
    const rows = range(P.todayD, Math.min(dl.time.length, P.todayD + 7)).map(i => {
      const sr = hv(dl, 'sunrise', i), ss = hv(dl, 'sunset', i), len = sr && ss ? mins(ss) - mins(sr) : null;
      return [dayLabel(dl.time[i], P.today), `${sr ? sr.slice(11, 16) : '–'} – ${ss ? ss.slice(11, 16) : '–'}${isNum(len) ? ` <span class="text-sm font-bold text-zinc-500 dark:text-zinc-400">(${Math.floor(len / 60)}:${pad(len % 60)} h)</span>` : ''}`];
    });
    return { title: '🌅 Sonnenauf- & -untergang', sub: esc(currentLoc().name), body: `${rowsCard(rows)}${note('⛰️', 'Die Zeiten gelten für freien Horizont. In engen Tälern verschwindet die Sonne oft deutlich früher hinter den Bergen.')}` };
  },
  clouds(p) {
    const S = slotOf(p); if (!S.data) return null;
    const P = prep(S.data), h = P.h, I = hourRange(P, P.nowIdx, P.nowIdx + 24);
    const g = k => hv(h, k, P.nowIdx), vis = g('visibility');
    return {
      title: '☁️ Bewölkung & Sicht', sub: `${esc(currentLoc().name)} · ${fmt(S.data.elevation)} m`,
      body: `${rowsCard([['Bewölkung gesamt', fmt(g('cloud_cover'), ' %')], isNum(g('cloud_cover_low')) ? ['davon tiefe Wolken', fmt(g('cloud_cover_low'), ' %')] : null, isNum(vis) ? ['Sicht', vis >= 20000 ? '> 20 km' : fmt(vis / 1000, ' km', 1)] : null])}
      ${chartCard(lineChart(I.map(i => hh(h.time[i])), I.map(i => hv(h, 'cloud_cover', i)), { cls: 'stroke-zinc-500', unit: '%' }), 'Bewölkung nächste 24 h in %')}
      ${note('🌫️', 'Viele <b>tiefe Wolken</b> im Tal bei klarer Höhe = Hochnebel: Oben scheint dann oft die Sonne. Unter ca. 1 km Sicht herrscht im Gelände Whiteout-Gefahr.')}`
    };
  },

  /* --- Rennrad --- */
  bike() {
    if (!lastBike || !state.main.data) return null;
    const { W, R, windowTxt, a, b } = lastBike, h = state.main.data.hourly;
    const rows = range(a, b).map(i => {
      const Wi = windowStats(h, i, i + 1), lv = rateBike(Wi).level;
      return `<div class="flex items-center gap-2 py-2 border-t border-zinc-200 dark:border-zinc-800 first:border-0">
        <span class="w-11 font-extrabold tabular">${h.time[i].slice(11, 16)}</span><span class="w-3.5 h-3.5 rounded-full ${LEVEL[lv].dot}"></span>
        <span class="w-12 font-black tabular text-right">${fmtT(Wi.tMin)}</span>
        <span class="flex-1 text-sm font-bold tabular text-right">💨 ${fmt(Wi.windAvg)}/${fmt(Wi.gustMax)}</span>
        <span class="w-14 text-sm font-bold tabular text-right text-blue-700 dark:text-sky-300">💧${fmt(Wi.popMax)}%</span></div>`;
    }).join('');
    const rule = (icon, name, lv, go, cond, no) => `<div class="${CARD} p-3.5"><div class="font-black">${icon} ${name}: ${LEVEL[lv].icon} ${LEVEL[lv].label}</div>
      <div class="text-sm font-semibold mt-1 leading-snug"><span class="${LEVEL[0].txt} font-extrabold">GO</span> ${go}<br><span class="${LEVEL[1].txt} font-extrabold">BEDINGT</span> ${cond}<br><span class="${LEVEL[2].txt} font-extrabold">NEIN</span> ${no}</div></div>`;
    return {
      title: `🚴 Rennrad-Ampel: ${LEVEL[R.level].label}`, sub: windowTxt,
      body: `${rule('💨', 'Wind', R.factors[0].level, `Böen bis ${fW(38 * prefs.windTol)} und Mittelwind bis ${fW(25 * prefs.windTol)}`, `Böen bis ${fW(55 * prefs.windTol)} oder Mittelwind bis ${fW(40 * prefs.windTol)}`, 'darüber – Seitenwind wird gefährlich')}
      ${rule('🌧️', 'Regen', R.factors[1].level, 'Regenrisiko unter 30 % und unter 0,3 mm', 'Regenrisiko bis 60 % oder bis 2 mm', 'ab 60 % bzw. 2 mm, bei Gewitter oder gefrierendem Regen')}
      ${rule('🌡️', 'Temperatur', R.factors[2].level, `${fmt(7 - prefs.coldFeel)} bis 31 °C`, `${fmt(Math.max(2, 2 - prefs.coldFeel))} bis ${fmt(7 - prefs.coldFeel)} °C oder 31 bis 36 °C`, `unter ${fmt(Math.max(2, 2 - prefs.coldFeel))} °C (Glätte/Kälte) oder über 36 °C`)}
      ${prefs.coldFeel || prefs.windTol !== 1 ? note('⚙️', 'Die Grenzwerte sind an deine Einstellungen (Kälteempfinden, Windtoleranz) angepasst.') : ''}
      ${h3('Stunde für Stunde')}
      <div class="${CARD} px-3 py-1">${rows}</div>
      ${note('🧮', `Im Zeitfenster: ${fmt(W.tMin)}–${fmt(W.tMax, ' °C')}, Wind Ø ${fW(W.windAvg)}, Böen bis ${fW(W.gustMax)}, Regenrisiko bis ${fmt(W.popMax)} %. Der schlechteste der drei Faktoren bestimmt die Ampel.`)}`
    };
  },
  clothing() {
    if (!lastBike) return null;
    const { W, C } = lastBike;
    const steps = [['ab 21 °C', 'Kurz/Kurz'], ['16–21 °C', 'Kurz/Kurz + Weste'], ['12–16 °C', 'Kurz/Kurz + Armlinge'], ['8–12 °C', 'Langarm + Knielinge'], ['3–8 °C', 'Lang/Lang + Windjacke'], ['−3–3 °C', 'Winter-Outfit'], ['unter −3 °C', 'Volle Winterausrüstung']];
    return {
      title: `👕 ${esc(C.head)}`, sub: lastBike.windowTxt,
      body: `${note('🌬️', `Beim Fahren kühlt der Fahrtwind (≈ ${fW(prefs.bikeSpeed)}) plus der halbe Umgebungswind (${fW(W.windAvg)}). So fühlen sich <b>${fmt(W.tMin, ' °C')}</b> Luft an wie <b>${fmt(C.eff, ' °C')}</b>. Nach diesem „Fahrt-Windchill“ richtet sich die Empfehlung.`)}
      ${rowsCard(steps.map(([t, l]) => [`<span class="${l === C.head.split(' + Regenjacke')[0] ? 'text-zinc-900 dark:text-white font-black' : ''}">${t}</span>`, l]))}
      <ul class="space-y-2">${C.items.map(([ic, t]) => `<li class="flex items-start gap-3 rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800 px-3 py-2.5"><span class="text-xl leading-6">${ic}</span><span class="font-bold leading-6">${t}</span></li>`).join('')}</ul>`
    };
  },

  /* --- Ski & Wachs --- */
  wax() {
    if (!lastWax) return null;
    const { A, SD, st, det, elevUsed, meas, day } = lastWax, w = A.cat, B = A.B;
    const steps = [
      'Belag mit der Messingbürste von vorne nach hinten ausbürsten (alte Wachsreste und Schmutz raus).',
      `Bügeleisen auf <b>${w.iron}</b> einstellen. ${B.short(w)} ans Eisen halten und auf den Belag tropfen lassen oder einreiben.`,
      'In 2–3 langsamen Zügen von vorne nach hinten einbügeln – Eisen immer in Bewegung halten, Wachs darf nicht rauchen.',
      'Mindestens 20–30 Minuten abkühlen lassen (über Nacht hält es länger).',
      'Mit der Plexi-Abziehklinge von vorne nach hinten abziehen, Kanten und Rillen freikratzen.',
      'Bürsten: Messing → Nylon → Rosshaar, zum Schluss mit Fibertex/Polierpad auspolieren.'
    ];
    return {
      title: `🎿 ${B.title(w)}`, sub: `${day} · ${fmt(elevUsed)} m · ${w.range}`,
      body: `<div class=" ${w.card} p-4"><div class="text-sm font-extrabold opacity-90">Warum dieses Wachs?</div>
        <div class="font-bold mt-1 leading-snug">Skitag ${fmt(SD.tMin)} bis ${fmt(SD.tMax, ' °C')}, Ø ${fmt(SD.tAvg, ' °C', 1)}. Schneeart: ${SNOW_NAMES[st]}${state.snowType === 'auto' ? ` (${det.why})` : ' (von dir gewählt)'}. Daraus ergibt sich eine Wachs-Referenz von <b>${fmt(A.tRef, ' °C', 1)}</b> → ${w.label}.</div></div>
      ${meas ? note('📡', `<b>${esc(meas.s.name)}</b> (${fmt(meas.s.alt)} m) misst ${fmt(meas.s.t, ' °C', 1)}${isNum(meas.s.oft) ? `, die Schnee-Oberfläche hat ${fmt(meas.s.oft, ' °C', 1)}` : ''}.${meas.hint}${isNum(meas.s.oft) && isNum(meas.s.t) && meas.s.oft < meas.s.t - 4 ? ' Der Schnee ist deutlich kälter als die Luft (klare Nacht) – vormittags läuft eher das härtere Wachs.' : ''}`) : ''}
      ${h3(B === WAX_BRANDS.neutral ? 'Passende Wachse' : `${B.name}-Produkte für diese Bedingungen`)}
      <ul class="space-y-2">${A.products.map(([ic, tier, name, txt], k) => `<li class="flex gap-3 items-start rounded-2xl ${k ? 'bg-white dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800' : 'bg-sky-50 dark:bg-sky-950/50 border-2 border-sky-400 dark:border-sky-700'} p-3">
        <span class="text-2xl leading-7">${ic}</span><div><div class="text-xs font-extrabold uppercase tracking-wide text-zinc-600 dark:text-zinc-300">${tier}</div><div class="font-black text-lg leading-tight">${name}</div><div class="text-sm font-semibold mt-0.5 leading-snug">${txt}</div></div></li>`).join('')}</ul>
      ${A.mix ? note('🔀', A.mix) : ''}
      ${note(A.hum.icon, `<b>${A.hum.title}.</b> ${A.hum.text}`)}
      ${note('〰️', `<b>Struktur: ${A.struct.name}.</b> ${A.struct.text}`)}
      ${A.notes.map(([ic, t]) => note(ic, t)).join('')}
      ${h3('So wachst du richtig')}

  waxchart() {

  snow() {

      title: '❄️ Neuschnee', sub: `${esc(currentLoc().name)} · ${fmt(S.data.elevation)} m`,
      body: `${rowsCard([

      ])}

        ${hints.map(([ic, t]) => note(ic, t)).join('')}
        <div class="space-y-2">

/* --- Info-Sheet öffnen / schließen (mit Zurück-Geste) --- */
let info = null, navDepth = 0, ignorePop = 0;
function navPush() { try { history.pushState({ aw: ++navDepth }, ''); } catch (e) { navDepth = Math.max(0, navDepth - 1); } }
function navPop(n = 1) {
  n = Math.min(n, navDepth);
  if (n <= 0) return;
  navDepth -= n; ignorePop++;
  history.go(-n);
}
function renderInfo(keepScroll) {
  if (!info) return;
  let r = null;
  try { r = INFO[info.key](info.p || {}); }
  catch (e) { console.error(e); r = { title: 'Fehler', body: errorCard({ kind: 'render', message: e.message }) }; }
  const body = $('#infoBody'), top = body.scrollTop;
  $('#infoTitle').innerHTML = r ? r.title : 'Lade …';
  $('#infoSub').innerHTML = r && r.sub ? r.sub : '';
  body.innerHTML = r ? r.body : `<div class="flex items-center justify-center gap-2 py-12 font-bold text-zinc-600 dark:text-zinc-300">${SPINNER} Lade Daten …</div>`;
  body.scrollTop = keepScroll ? top : 0;
}
function openInfo(key, p = {}) {
  if (!INFO[key]) return;
  const el = $('#info'), was = !!info;
  info = { key, p };
  renderInfo(false);
  if (!was) {
    el.classList.remove('hidden'); el.setAttribute('aria-hidden', 'false');
    $('#infoBody').scrollTop = 0;
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      $('.sheet-panel', el).classList.remove('translate-y-full');
      $('.sheet-overlay', el).classList.remove('opacity-0');
    }));
    navPush();
  }
  if (key === 'stations' || key === 'station' || key === 'snow') loadStations();
}
function closeInfo(fromNav) {
  if (!info) return;
  info = null;
  const el = $('#info');
  $('.sheet-panel', el).classList.add('translate-y-full');
  $('.sheet-overlay', el).classList.add('opacity-0');
  if (!sheetOpen) document.body.style.overflow = '';
  setTimeout(() => { if (!info) { el.classList.add('hidden'); el.setAttribute('aria-hidden', 'true'); } }, 300);
  if (!fromNav) navPop(1);
}

/* --- Links (Schnellzugriffe, Lesezeichen): ?tab=ski&info=wax&loc=<id>&lat=..&lon=..&name=..&elev=.. --- */
let pendingInfo = null;
function applyDeepLink() {
  let q;
  try { q = new URLSearchParams(location.search); } catch (e) { return; }
  if (!Array.from(q.keys()).length) return;
  const tab = q.get('tab');
  if (TABS.includes(tab)) { state.tab = tab; LS.set('aw_tab', tab); }
  const id = q.get('loc'), lat = parseFloat(q.get('lat')), lon = parseFloat(q.get('lon'));
  let target = id ? state.locations.find(l => l.id === id) : null;
  if (!target && isNum(lat) && isNum(lon)) target = state.locations.find(l => Math.abs(l.lat - lat) < 0.005 && Math.abs(l.lon - lon) < 0.005);
  if (target) { state.selectedId = target.id; LS.set('aw_selected', target.id); }
  else if (isNum(lat) && isNum(lon)) {
    const ev = parseFloat(q.get('elev'));
    state.tempLoc = { id: '__temp', name: (q.get('name') || 'Ort aus Link').slice(0, 60), region: 'per Link geöffnet', lat, lon, elevation: isNum(ev) ? Math.round(ev) : null, valley: null };
    state.selectedId = '__temp'; persistLocs(); LS.set('aw_selected', '__temp');
  }
  const key = q.get('info');
  if (key && INFO[key]) pendingInfo = { key, p: { d: q.get('d') || '', t: q.get('t') || '', mode: q.get('mode') || '', slot: q.get('slot') || '' } };
  try { history.replaceState(null, '', location.pathname); } catch (e) { /* egal */ }
}

/* =====================================================================
   Astronomie (ohne Internet berechnet): Sonnen- & Mondstand, Dämmerung, Mondphasen (nach Meeus),
   Mondentfernung (Supermond), Sonnenwenden/Tagundnachtgleichen. Genauigkeit: Zeiten ±1–2 Min.
   ===================================================================== */
const RAD = Math.PI / 180, DAY_MS = 864e5, J1970 = 2440588, J2000 = 2451545, OBL = RAD * 23.4397;
const toDays = ms => ms / DAY_MS - 0.5 + J1970 - J2000;
const raOf = (l, b) => Math.atan2(Math.sin(l) * Math.cos(OBL) - Math.tan(b) * Math.sin(OBL), Math.cos(l));
const decOf = (l, b) => Math.asin(Math.sin(b) * Math.cos(OBL) + Math.cos(b) * Math.sin(OBL) * Math.sin(l));
const altOf = (H, phi, dec) => Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
const azOf = (H, phi, dec) => Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi));
const sidereal = (d, lw) => RAD * (280.16 + 360.9856235 * d) - lw;
function sunEcl(d) {
  const M = RAD * (357.5291 + 0.98560028 * d);
  const C = RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  return M + C + RAD * (102.9372 + 0.0000470935 * d) + Math.PI;   // ekliptikale Länge (inkl. Perihel-Präzession)
}
function sunPos(ms, lat, lon) {
  const d = toDays(ms), L = sunEcl(d), dec = decOf(L, 0), ra = raOf(L, 0), H = sidereal(d, RAD * -lon) - ra, phi = RAD * lat;
  return { alt: altOf(H, phi, dec) / RAD, az: (azOf(H, phi, dec) / RAD + 180) % 360 };
}
function moonEq(d) {
  const L = RAD * (218.316 + 13.176396 * d), M = RAD * (134.963 + 13.064993 * d), F = RAD * (93.272 + 13.229350 * d);
  const l = L + RAD * 6.289 * Math.sin(M), b = RAD * 5.128 * Math.sin(F);
  return { ra: raOf(l, b), dec: decOf(l, b), dist: 385001 - 20905 * Math.cos(M) };
}
function moonPos(ms, lat, lon) {
  const d = toDays(ms), c = moonEq(d), H = sidereal(d, RAD * -lon) - c.ra, phi = RAD * lat;
  let h = altOf(H, phi, c.dec);
  h += RAD * 0.017 / Math.tan(h + RAD * 10.26 / (h + RAD * 5.10));   // Refraktion
  return { alt: h / RAD, az: (azOf(H, phi, c.dec) / RAD + 180) % 360 };
}
/** Beleuchteter Anteil (0–1) und Phase (0 = Neumond, 0,5 = Vollmond) */
function moonIllum(ms) {

/* =====================================================================
   Polarlicht & Himmelsfarben
   · Polarlicht: 3-Tage-Kp-Vorhersage von NOAA SWPC (ohne Key, CORS *) + geomagnetische Breite des Ortes
     + Dunkelheit + Wolken + Mond → Chance pro Nacht (Schätzung).
   · Himmelsfarben: Abend-/Morgenrot, Alpenglühen, Venusgürtel, Regenbogen, Halo, Saharastaub
     (Open-Meteo Air Quality: dust, aerosol_optical_depth), saisonal leuchtende Nachtwolken & Zodiakallicht.
   ===================================================================== */
const KP_URL = 'https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json';
const AQ_API = 'https://air-quality-api.open-meteo.com/v1/air-quality';
const KP_TTL = 30 * 60 * 1000, AQ_TTL = 60 * 60 * 1000, RETRY_MS = 2 * 60 * 1000;
const space = { kp: LS.get('aw_kp_v1', null), kpLoading: false, kpError: null, kpTry: 0, aq: LS.get('aw_aq_v1', null), aqLoading: false, aqError: null, aqTry: 0 };
function skyRefresh() {
  if (state.tab === 'sky') render();
  else if (info && (info.key === 'aurora' || info.key === 'skycolors')) renderInfo(true);
}
/* Unterstützt das aktuelle (Objekte) und das frühere Format (Tabelle mit Kopfzeile) */
function parseKp(d) {
  const out = [];
  (Array.isArray(d) ? d : []).forEach(r => {
    const row = Array.isArray(r) ? r : r && [r.time_tag, r.kp, r.observed, r.noaa_scale];
    if (!row || row[0] === 'time_tag') return;
    const ts = String(row[0]).replace(' ', 'T'), t = Date.parse(/[zZ]$|[+-]\d\d:?\d\d$/.test(ts) ? ts : ts + 'Z'), kp = parseFloat(row[1]);
    if (isNum(t) && isNum(kp)) out.push([t, kp, String(row[2] || ''), row[3] || null]);
  });
  return out.sort((a, b) => a[0] - b[0]);
}
function loadKp(force = false) {
  const K = space.kp, now = Date.now();
  if (space.kpLoading || navigator.onLine === false) return;
  if (!force && ((K && now - K.ts < KP_TTL) || now - space.kpTry < RETRY_MS)) return;
  space.kpLoading = true; space.kpTry = now;
  fetchJSON(KP_URL, 12000).then(d => {
    const list = parseKp(d);
    if (!list.length) { const e = new Error('Keine Kp-Daten'); e.kind = 'data'; throw e; }
    space.kp = { ts: Date.now(), list }; space.kpError = null;
    LS.set('aw_kp_v1', space.kp);
  }).catch(e => { space.kpError = e; }).finally(() => { space.kpLoading = false; skyRefresh(); });
}
const aqKey = loc => `${(+loc.lat).toFixed(2)},${(+loc.lon).toFixed(2)}`;
function loadAq(force = false) {
  const loc = currentLoc(), now = Date.now();
  if (!loc || space.aqLoading || navigator.onLine === false) return;
  const key = aqKey(loc), A = space.aq;
  if (!force && ((A && A.key === key && now - A.ts < AQ_TTL) || (space.aqKeyTry === key && now - space.aqTry < RETRY_MS))) return;
  space.aqLoading = true; space.aqTry = now; space.aqKeyTry = key;
  const p = new URLSearchParams({ latitude: String(loc.lat), longitude: String(loc.lon), hourly: 'dust,aerosol_optical_depth', timezone: 'auto', forecast_days: '4' });
  fetchJSON(`${AQ_API}?${p}`, 12000).then(d => {
    const h = d.hourly || {};
    if (!Array.isArray(h.time) || !h.time.length) { const e = new Error('Keine Staubdaten'); e.kind = 'data'; throw e; }
    space.aq = { key, ts: Date.now(), time: h.time, dust: h.dust || [], aod: h.aerosol_optical_depth || [] };
    space.aqError = null;
    LS.set('aw_aq_v1', space.aq);
  }).catch(e => { space.aqError = e; }).finally(() => { space.aqLoading = false; skyRefresh(); });
}

/* --- Polarlicht --- */
/** Geomagnetische Breite (Dipol, geomagnetischer Nordpol ca. 80,8° N / 72,6° W, IGRF 2025) */
function geomagLat(lat, lon) {
  const pl = 80.8 * RAD, pL = -72.6 * RAD, la = lat * RAD, lo = lon * RAD;
  return Math.asin(Math.sin(la) * Math.sin(pl) + Math.cos(la) * Math.cos(pl) * Math.cos(lo - pL)) / RAD;
}
/** Kp, ab dem Polarlicht hier tief am Horizont fotografierbar wird (Erfahrungswerte: Tirol ≈ 7, Norddeutschland ≈ 5–6, Nordnorwegen ≈ 1) */
function kpNeed(mlat) {
  const m = Math.abs(mlat);
  return m >= 60 ? Math.max(0, 4.5 - (m - 60) * 0.65) : Math.min(9.5, 4.5 + (60 - m) * 0.2);
}
const kpChance = (kp, need) => 1 / (1 + Math.exp(-1.8 * (kp - need)));
const gScale = kp => (Math.round(kp) >= 5 ? Math.min(5, Math.round(kp) - 4) : 0);
const G_NAMES = ['', 'G1 gering', 'G2 mäßig', 'G3 stark', 'G4 sehr stark', 'G5 extrem'];
const AURORA_LV = [
  [0.02, 'Sehr gering', 'text-zinc-500 dark:text-zinc-400', 'bg-zinc-200 text-zinc-600 dark:bg-zinc-800 dark:text-zinc-300'],
  [0.1, 'Gering', 'text-zinc-700 dark:text-zinc-200', 'bg-zinc-200 text-zinc-800 dark:bg-zinc-700 dark:text-zinc-100'],
  [0.3, 'Möglich', 'text-amber-600 dark:text-amber-400', 'bg-amber-400 text-zinc-950'],
  [0.6, 'Gut', 'text-emerald-600 dark:text-emerald-400', 'bg-emerald-500 text-white'],
  [2, 'Sehr gut', 'text-emerald-600 dark:text-emerald-400', 'bg-emerald-600 text-white']
];
const auroraLv = p => AURORA_LV.find(x => p < x[0]) || AURORA_LV[AURORA_LV.length - 1];
const pctTxt = p => (p < 0.01 ? '< 1 %' : fmt(p * 100, ' %'));
/** Wolken in % zum Zeitpunkt (aus der stündlichen Vorhersage) */
function cloudAt(P, ms) {
  const off = state.main.data.utc_offset_seconds || 0;
  const i = P.h.time.indexOf(new Date(ms + off * 1000).toISOString().slice(0, 13) + ':00');

  const K = space.kp;

/* =====================================================================
   Aussehen & Anordnung (⚙️ › 🎨): Farben, Form, Hintergrund, Muster, Größen, Reihenfolge der Bereiche
   ===================================================================== */
/* [Name, Farbe, Schrift hell, Schrift dunkel, Verlauf-Ende] als „R G B“ */
const ACCENTS = {
  sky: ['Blau', '2 132 199', '3 105 161', '125 211 252', '29 78 216'],
  indigo: ['Indigo', '79 70 229', '55 48 163', '165 180 252', '49 46 129'],
  violet: ['Violett', '124 58 237', '91 33 182', '196 181 253', '76 29 149'],
  rose: ['Rosa', '225 29 72', '159 18 57', '253 164 175', '136 19 55'],
  orange: ['Orange', '234 88 12', '154 52 18', '253 186 116', '154 52 18'],
  amber: ['Gold', '217 119 6', '146 64 14', '252 211 77', '180 83 9'],
  emerald: ['Grün', '5 150 105', '6 95 70', '110 231 183', '6 78 59'],
  teal: ['Petrol', '13 148 136', '17 94 89', '94 234 212', '19 78 74'],
  zinc: ['Graphit', '82 82 91', '39 39 42', '228 228 231', '24 24 27']
};
const TAB_ACCENT = { wetter: 'sky', rad: 'emerald', ski: 'indigo', sky: 'amber' };
/* Bereiche je Tab (Reihenfolge = Standard) */
const SECTIONS = {
  wetter: [['hero', 'Aktuelles Wetter'], ['hours', 'Stündlich'], ['station', 'Messstation'], ['days', '7 Tage'], ['details', 'Details']],
  rad: [['hero', 'Rennrad-Ampel'], ['start', 'Startzeit & Dauer'], ['window', 'Im Zeitfenster'], ['clothing', 'Bekleidung']],
  ski: [['toggle', 'Tal / Berg'], ['now', 'Jetzt am Berg'], ['station', 'Messstation am Berg'], ['planner', 'Skitags-Planer'], ['wax', 'Skiwachs']],
  sky: [['hero', 'Sonnenauf- & -untergang'], ['light', 'Licht heute'], ['colors', 'Himmelsfarben'], ['aurora', 'Polarlicht'], ['moon', 'Mond'], ['stars', 'Sternenhimmel'], ['events', 'Kommende Ereignisse']]
};
function sectionOrder(tab) {
  const def = SECTIONS[tab].map(x => x[0]);
  const list = ((prefs.look.order && prefs.look.order[tab]) || []).filter((id, i, a) => def.includes(id) && a.indexOf(id) === i);
  def.forEach((id, i) => {                    // neue/fehlende Bereiche an ihrer Standardstelle einfügen
    if (list.includes(id)) return;
    const prev = def.slice(0, i).reverse().find(p => list.includes(p));
    list.splice(prev ? list.indexOf(prev) + 1 : 0, 0, id);
  });
  return list;
}
const isHidden = (tab, id) => !!(prefs.look.hide && Array.isArray(prefs.look.hide[tab]) && prefs.look.hide[tab].includes(id));
/** Bereiche eines Tabs in der gewünschten Reihenfolge (ausgeblendete weglassen) */
function arrange(tab, sec) {
  const html = sectionOrder(tab).filter(id => !isHidden(tab, id)).map(id => sec[id] || '').join('');
  return html.trim() ? html : `<div class="${PANEL} px-5 py-6 text-center"><div class="text-3xl mb-1">🙈</div><p class="${SUB}">Alle Bereiche sind ausgeblendet.</p>
    <button data-info="look" class="mt-3 px-5 py-2.5 rounded-full ac-bg text-white font-bold active:opacity-80 transition">Anordnung ändern</button></div>`;
}
/* Detail-Kacheln: 1, 2 oder 3 pro Reihe; leere Plätze am Ende auffüllen */
const gcols = () => ({ 1: 'grid-cols-1', 2: 'grid-cols-2', 3: 'grid-cols-3' }[prefs.look.tiles] || 'grid-cols-2');
function tiles(cells, rows = '') {
  const list = cells.filter(Boolean), c = Number(prefs.look.tiles) || 2, fill = (c - list.length % c) % c;
  return `<div class="${GRID} ${gcols()}">${list.join('')}${`<div class="${CELL}" aria-hidden="true"></div>`.repeat(fill)}${rows}</div>`;
}
const compactHero = () => prefs.look.heroSize === 'kompakt';

let acKey = null;
function setAccent() {
  const key = prefs.look.accent !== 'tab' && ACCENTS[prefs.look.accent] ? prefs.look.accent : (TAB_ACCENT[state.tab] || 'sky');
  const dark = document.documentElement.classList.contains('dark'), k = key + (dark ? ':d' : ':l');
  if (k === acKey) return;
  acKey = k;
  const a = ACCENTS[key], st = document.documentElement.style;
  st.setProperty('--ac', key === 'zinc' && dark ? '161 161 170' : a[1]);
  st.setProperty('--ac-ink', dark ? a[3] : a[2]);
  st.setProperty('--ac-deep', a[4]);
}
function applyLook() {
  const L = prefs.look, h = document.documentElement;
  const img = L.bg === 'foto' ? LS.get('aw_bgimg', null) : null;
  h.dataset.shape = L.shape; h.dataset.card = L.card; h.dataset.font = L.font;
  h.dataset.density = L.density; h.dataset.tiles = String(L.tiles);
  h.dataset.bg = L.bg === 'foto' && !img ? 'standard' : L.bg;
  $('#bgfx').style.backgroundImage = img ? `url("${img}")` : '';
  $('#bgpat').className = L.pattern && L.pattern !== 'none' ? `pat-${L.pattern}` : '';
  acKey = null; setAccent();
  const bg = getComputedStyle(h).getPropertyValue('--bg').trim().split(/\s+/).join(',');
  if (bg) $('#themeColor').setAttribute('content', `rgb(${bg})`);
}
/* Eigenes Hintergrundfoto: verkleinern (max. 1280 px) und auf dem Gerät speichern */
function setBgPhoto(file) {
  if (!file) return;
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const k = Math.min(1, 1280 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    let saved = false;
    for (const q of [0.72, 0.55, 0.4]) {
      try { localStorage.setItem('aw_bgimg', JSON.stringify(c.toDataURL('image/jpeg', q))); saved = true; break; } catch (e) { /* zu groß → stärker komprimieren */ }
    }
    if (!saved) { toast('Das Foto ist zu groß für den Speicher'); return; }
    const glass = prefs.look.card === 'flach';
    prefs.look.bg = 'foto';
    if (glass) prefs.look.card = 'glas';
    savePrefs(); applyLook(); render();
    toast(glass ? 'Foto gesetzt – Kacheln auf „Glas“ gestellt' : 'Hintergrundfoto gesetzt');
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Dieses Bild kann nicht geöffnet werden'); };
  img.src = url;
}
